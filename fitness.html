<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VOLT. - Espace Fitness</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap"/></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0057FF;--blue2:#2979FF;--blue-dark:#003FCC;
  --glow:rgba(0,87,255,.18);--soft:rgba(0,87,255,.07);
  --ink:#0A0F1E;--ink2:#2D3652;--ink3:#6B7A99;--ink4:#A8B4CC;
  --bg:#F7F9FF;--bg2:#EDF1FB;--white:#fff;
  --border:rgba(0,87,255,.1);--border2:rgba(10,15,30,.07);
  --green:#00C47A;--red:#FF3B5C;--orange:#FF9500;
  --sidebar:230px;
}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.bc{font-family:'Barlow Condensed',sans-serif}
.spin{width:20px;height:20px;border:2.5px solid rgba(0,87,255,.2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink);position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 70% 10%,rgba(0,87,255,.3),transparent 65%)}
.login-wrap::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.login-box{background:#fff;border-radius:28px;padding:44px 40px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 32px 80px rgba(0,0,0,.35);animation:fadeUp .6s ease both}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:56px;color:var(--ink);letter-spacing:-2px;line-height:1;margin-bottom:4px}
.login-tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--border);border-radius:50px;padding:4px 12px;margin-bottom:28px}
.login-tag span{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--ink);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;border-right:1px solid rgba(255,255,255,.05)}
.sidebar-logo{padding:26px 22px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;color:#fff;letter-spacing:-1px}
.sidebar-logo-badge{font-size:10px;font-weight:700;color:rgba(0,87,255,.7);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.sidebar-gym{padding:14px 22px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-gym-name{font-size:14px;font-weight:700;color:#fff;line-height:1.3}
.sidebar-gym-filiale{font-size:11px;color:rgba(255,255,255,.35);margin-top:3px}
.sidebar-nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:.12em;text-transform:uppercase;padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:rgba(0,87,255,.18);border-color:rgba(0,87,255,.25)}
.nav-item .ni{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav-item .nl{font-size:13px;font-weight:600;color:rgba(255,255,255,.6)}
.nav-item.active .nl{color:#fff}
.sidebar-footer{padding:12px 10px;border-top:1px solid rgba(255,255,255,.06)}

/* MAIN */
.main{margin-left:var(--sidebar);flex:1;padding:28px 32px;min-height:100vh;animation:fadeIn .3s ease}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:34px;color:var(--ink);letter-spacing:-.5px;line-height:1}
.page-sub{font-size:13px;font-weight:500;color:var(--ink3);margin-top:3px}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* SEARCH */
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap::before{content:'🔍';position:absolute;left:12px;font-size:13px;pointer-events:none}
.search-inp{background:var(--white);border:1.5px solid var(--border2);border-radius:50px;padding:8px 16px 8px 34px;font-size:13px;font-weight:500;color:var(--ink);font-family:'Barlow',sans-serif;outline:none;width:200px;transition:all .2s}
.search-inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,87,255,.08);width:240px}
.search-inp::placeholder{color:var(--ink4)}

/* CARDS */
.card{background:#fff;border-radius:20px;border:1px solid var(--border2);overflow:hidden}
.card-pad{padding:24px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:18px;padding:20px 22px;border:1px solid var(--border2);transition:all .2s;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:var(--soft);border-radius:0 0 0 60px;opacity:.6}
.kpi:hover{box-shadow:0 8px 24px var(--glow);border-color:rgba(0,87,255,.2);transform:translateY(-2px)}
.kpi-ico{font-size:22px;margin-bottom:10px;display:block}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:36px;color:var(--ink);line-height:1;letter-spacing:-.5px}
.kpi-val.blue{color:var(--blue)}
.kpi-val.green{color:var(--green)}
.kpi-val.orange{color:var(--orange)}
.kpi-label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.kpi-sub{font-size:12px;font-weight:500;color:var(--ink4);margin-top:3px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;padding:11px 16px;text-align:left;border-bottom:1.5px solid var(--border2);white-space:nowrap;background:var(--bg)}
td{font-size:13px;font-weight:500;color:var(--ink);padding:13px 16px;border-bottom:1px solid var(--border2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.td-name{font-weight:700;font-size:14px}
.td-sub{font-size:11px;color:var(--ink3);margin-top:1px}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:50px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-green{background:rgba(0,196,122,.1);color:var(--green)}
.badge-red{background:rgba(255,59,92,.1);color:var(--red)}
.badge-blue{background:var(--soft);color:var(--blue)}
.badge-orange{background:rgba(255,149,0,.1);color:var(--orange)}
.badge-gray{background:var(--bg2);color:var(--ink3)}

/* INPUTS & BUTTONS */
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,87,255,.07)}
.inp::placeholder{color:var(--ink4)}
.lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:5px}

/* MODALES */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.modal{background:var(--white);border-radius:18px;padding:26px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(10,15,30,.25);max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;margin-bottom:4px}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.btn{padding:10px 22px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 14px var(--glow)}
.btn-blue:hover{background:var(--blue2);transform:translateY(-1px)}
.btn-ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:7px 16px;font-size:13px}
.btn-success{background:rgba(0,196,122,.1);color:var(--green);border:1px solid rgba(0,196,122,.2)}
.btn-success:hover{background:var(--green);color:#fff;border-color:var(--green)}
.btn-danger{background:rgba(255,59,92,.08);color:var(--red);border:1px solid rgba(255,59,92,.15)}
.btn-orange{background:rgba(255,149,0,.1);color:var(--orange);border:1px solid rgba(255,149,0,.22)}
.btn-orange:hover{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-danger:hover{background:var(--red);color:#fff}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .3s;opacity:0;transform:translateY(10px);pointer-events:none;max-width:320px}
#toast.show{opacity:1;transform:translateY(0)}
#toast.err{background:var(--red)}

/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding:0 4px}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:3px;background:var(--blue);opacity:.7;transition:height .4s ease}
.bar-fill.today{opacity:1;background:var(--blue2)}
.bar-lbl{font-size:8px;font-weight:600;color:var(--ink4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}

/* EMPTY */
.empty{text-align:center;padding:60px 24px;color:var(--ink3)}
.empty-ico{font-size:40px;margin-bottom:14px}
.empty-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--ink);margin-bottom:6px}
.empty-sub{font-size:14px;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const BACKEND = 'https://volt-backend-final.vercel.app';

let S = {
  logged: false, page: 'dashboard',
  gym: null, token: null,
  stats: {}, members: [], virements: [], scans: [],
  search: '',
};

// ── API ──────────────────────────────────────────────
async function api(path, body, method='GET') {
  try {
    const opts = { method, headers: { 'Content-Type':'application/json' } };
    if (S.token) opts.headers['Authorization'] = 'Bearer ' + S.token;
    if (body && method !== 'GET') opts.body = JSON.stringify(body);
    const r = await fetch(BACKEND + path, opts);
    return await r.json();
  } catch(e) { return { error: e.message }; }
}

// ── HELPERS ──────────────────────────────────────────
function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = ok ? 'show' : 'show err';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.className = '', 3500);
}
function fmtChf(n) { return 'CHF ' + Number(n||0).toFixed(2); }
// Fenêtre d'abonnement figée du membre (début → fin + jours restants)
function subWindow(m) {
  if (!m.sub_start && !m.sub_end) return '<span style="color:var(--ink3)">—</span>';
  const left = (typeof m.days_left === 'number') ? m.days_left : null;
  let badge = '';
  if (m.subscribed && left !== null) {
    const col = left <= 0 ? 'var(--red)' : left <= 7 ? 'var(--orange)' : 'var(--ink3)';
    badge = `<div style="font-size:11px;font-weight:700;color:${col};margin-top:2px">${left} j restant${left>1?'s':''}</div>`;
  }
  let pause = '';
  if (m.paused_now) {
    pause = `<div style="font-size:11px;font-weight:700;color:var(--orange);margin-top:3px">⏸️ En pause jusqu'au ${m.paused_to}</div>`;
  } else if (m.pause_planned) {
    pause = `<div style="font-size:11px;font-weight:600;color:var(--ink3);margin-top:3px">⏸️ Pause prévue ${m.paused_from} → ${m.paused_to}</div>`;
  }
  return `<div style="font-size:12px;line-height:1.5"><strong>${m.sub_start||'—'}</strong><div style="color:var(--ink3)">→ ${m.sub_end||'—'}</div>${badge}${pause}</div>`;
}
function planLabel(p) { return {month:'Mensuel',quarter:'Trimestriel',year:'Annuel',custom:'Jours offerts'}[p]||p||'—'; }
function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function closeModal() { document.getElementById('modal-bg')?.remove(); }
function todayISO() { return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function planBadge(p) { return `<span class="badge badge-blue">${planLabel(p)}</span>`; }
function filterBySearch(arr, keys) {
  if (!S.search) return arr;
  const q = S.search.toLowerCase();
  return arr.filter(i => keys.some(k => (i[k]||'').toString().toLowerCase().includes(q)));
}

// ── NAV ──────────────────────────────────────────────
const PAGES = [
  { id:'dashboard', icon:'📊', label:'Vue d\'ensemble' },
  { id:'members',   icon:'👥', label:'Membres'         },
  { id:'scans',     icon:'⚡', label:'Consommation'    },
  { id:'virements', icon:'💰', label:'Revenus'         },
];

function goTo(page) {
  S.page = page; S.search = '';
  document.querySelectorAll('.nav-item[data-page]').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('main-content').innerHTML = renderPage();
  bindPage();
}

function renderPage() {
  if (S.page === 'dashboard') return pageDashboard();
  if (S.page === 'members')   return pageMembers();
  if (S.page === 'scans')     return pageScans();
  if (S.page === 'virements') return pageVirements();
  return '';
}

function bindPage() {
  const si = document.getElementById('search-inp');
  if (si) si.oninput = e => {
    S.search = e.target.value;
    document.getElementById('main-content').innerHTML = renderPage();
    bindPage();
  };
}

// ── LOGIN ────────────────────────────────────────────
function renderLogin() {
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">VOLT.</div>
      <div class="login-tag"><span>🏋️ Espace Fitness</span></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><label class="lbl">Email du fitness</label><input class="inp" id="l-email" type="email" placeholder="manager@fitness.ch" autocomplete="email"/></div>
        <div><label class="lbl">Mot de passe</label><input class="inp" id="l-pwd" type="password" placeholder="••••••••"/></div>
        <div id="l-err" style="display:none;background:#FFF0F2;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--red)"></div>
        <button class="btn btn-blue" style="width:100%;justify-content:center;margin-top:4px" id="login-btn" onclick="doLogin()">Accéder →</button>
        <div style="text-align:center;margin-top:2px"><a href="#" onclick="forgotPwd();return false" style="font-size:13px;font-weight:700;color:var(--blue);text-decoration:none">Mot de passe oublié ?</a></div>
      </div>
      <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--ink4)">Identifiants fournis par VOLT. · <a href="mailto:info@volt-energy.ch" style="color:var(--blue);text-decoration:none">info@volt-energy.ch</a></div>
    </div>
  </div>`;
  document.getElementById('l-pwd').onkeydown = e => { if (e.key==='Enter') doLogin(); };
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pwd   = document.getElementById('l-pwd').value;
  if (!email || !pwd) { showErr('Remplis tous les champs.'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showErr('Adresse email invalide.'); return; }
  const btn = document.getElementById('login-btn');
  btn.innerHTML = '<div class="spin"></div> Connexion...'; btn.disabled = true;

  const res = await api('/api/fitness?action=login', { email, password: pwd }, 'POST');
  if (res.error) {
    showErr(res.error);
    btn.innerHTML = 'Accéder →'; btn.disabled = false;
    return;
  }

  S.token = res.token; S.gym = res.gym; S.logged = true;

  // Charge toutes les données
  const [statsRes, membersRes, scansRes, virementsRes] = await Promise.all([
    api('/api/fitness?action=stats'),
    api('/api/fitness?action=members'),
    api('/api/fitness?action=scans'),
    api('/api/fitness?action=virements'),
  ]);
  if (!statsRes.error)     S.stats     = statsRes;
  if (!membersRes.error)   S.members   = membersRes.members || [];
  if (!scansRes.error)     S.scans     = scansRes.scans     || [];
  if (!virementsRes.error) S.virements = virementsRes.virements || [];

  renderApp();
  if (statsRes.error || membersRes.error || scansRes.error || virementsRes.error) {
    toast('Certaines données n\'ont pas pu être chargées (problème réseau). Réessaie.', false);
  }
}

async function forgotPwd() {
  const email = (document.getElementById('l-email').value || '').trim();
  if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showErr('Entre d\'abord ton email du fitness ci-dessus.'); return; }
  const res = await api('/api/login?action=forgot', { email }, 'POST');
  if (res.error) { showErr(res.error); return; }
  const err = document.getElementById('l-err');
  if (err) { err.style.background='#E8FFF4'; err.style.color='#009960'; err.textContent='✅ Si ce compte existe, un email de réinitialisation vient d\'être envoyé. Vérifie ta boîte mail (et les spams).'; err.style.display='block'; }
}

function showErr(msg) {
  const err = document.getElementById('l-err');
  if (err) { err.style.background=''; err.style.color=''; err.textContent = '❌ ' + msg; err.style.display = 'block'; }
}

function doLogout() {
  S = { logged:false, page:'dashboard', gym:null, token:null, stats:{}, members:[], virements:[], scans:[], search:'' };
  renderLogin();
}

// ── APP SHELL ────────────────────────────────────────
function renderApp() {
  const navItems = PAGES.map(p => `
    <button class="nav-item ${S.page===p.id?'active':''}" data-page="${p.id}" onclick="goTo('${p.id}')">
      <span class="ni">${p.icon}</span><span class="nl">${p.label}</span>
    </button>`).join('');

  document.getElementById('app').innerHTML = `
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-txt">VOLT.</div>
        <div class="sidebar-logo-badge">⚡ Espace Fitness</div>
      </div>
      <div class="sidebar-gym">
        <div class="sidebar-gym-name">${S.gym?.name || 'Mon fitness'}</div>
        <div class="sidebar-gym-filiale">${S.gym?.filiale || ''} ${S.gym?.address ? '· ' + S.gym.address : ''}</div>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section">Navigation</div>
        ${navItems}
      </div>
      <div class="sidebar-footer">
        <div style="padding:10px 12px;margin-bottom:4px">
          <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.6)">${S.gym?.email || ''}</div>
        </div>
        <button class="nav-item" onclick="doLogout()" style="width:100%">
          <span class="ni">🚪</span>
          <span class="nl" style="color:rgba(255,59,92,.7)">Déconnexion</span>
        </button>
      </div>
    </div>
    <div class="main" id="main-content">${renderPage()}</div>
  </div>`;
  bindPage();
}

// ── DASHBOARD ────────────────────────────────────────
/**
 * Etat des bornes de la salle : bidon d'eau et bacs de poudre.
 *
 * Le bidon n'a AUCUN capteur — la borne en tient un decompte et REFUSE de
 * servir en dessous de 2 L, pour que la pompe ne tourne jamais a vide et ne
 * grille pas. D'ou le ton directif du message quand le seuil est atteint : ce
 * n'est pas une suggestion, la machine est deja a l'arret.
 *
 * Le bloc disparait si la salle n'a aucune borne enregistree.
 */
function renderMachineStocks() {
  const machines = Array.isArray(S.stats?.machines) ? S.stats.machines : [];
  if (machines.length === 0) return '';

  const card = (m) => {
    const l = m.levels;
    const name = escapeHtml(m.name || m.machine_id);
    if (!l) {
      return `<div class="card card-pad">
        <div style="font-weight:700;margin-bottom:6px">${name}</div>
        <div style="font-size:13px;color:var(--ink4)">Pas encore de donnée — la borne n'a servi aucune boisson depuis la mise à jour.</div>
      </div>`;
    }
    const cap = l.water_capacity_ml || 16000;
    const ml  = typeof l.water_ml === 'number' ? l.water_ml : 0;
    const pct = Math.max(0, Math.min(100, Math.round(ml / cap * 100)));
    const blocked = ml <= 2000;
    const low     = !blocked && ml <= 4000;
    const color   = blocked ? 'var(--red,#e5484d)' : (low ? 'var(--orange,#f0922b)' : 'var(--green,#30a46c)');
    const msg = blocked
      ? '⛔ Machine à l\'arrêt — remplissez le bidon À RAS, puis confirmez sur l\'écran de la machine (Administration → Inventaire).'
      : (low ? '⚠️ Bidon bas — prévoyez un remplissage.' : '');
    const hoppers = Array.isArray(l.hoppers) ? l.hoppers : [];
    const lowHoppers = hoppers.filter(h => h.warn_g > 0 && h.grams <= h.warn_g);

    return `<div class="card card-pad">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <div style="font-weight:700">${name}</div>
        <div style="font-size:12px;color:var(--ink3)">${l.updated_at ? new Date(l.updated_at).toLocaleString('fr-CH') : ''}</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
        <span>💧 Réservoir d'eau</span>
        <strong style="color:${color}">${(ml/1000).toFixed(1)} L / ${Math.round(cap/1000)} L</strong>
      </div>
      <div style="height:8px;border-radius:4px;background:var(--soft,#eee);overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${color}"></div>
      </div>
      ${msg ? `<div style="margin-top:10px;font-size:13px;font-weight:600;color:${color}">${msg}</div>` : ''}
      <div style="margin-top:12px;font-size:13px">
        ${lowHoppers.length
          ? `📦 <strong>À recharger :</strong> ${lowHoppers.map(h=>escapeHtml(h.name||h.id)).join(', ')}`
          : (hoppers.length ? '📦 Bacs de poudre OK' : '')}
      </div>
    </div>`;
  };

  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px">
    ${machines.map(card).join('')}
  </div>`;
}

/**
 * Messages laissés par vos membres sur la borne, et distributions échouées.
 *
 * Les deux sont limités à VOS machines : le message part de la borne, qui est
 * rattachée à votre salle. Le bloc disparaît quand il n'y a rien à signaler,
 * pour ne pas encombrer le tableau de bord en fonctionnement normal.
 */
function renderIncidents() {
  const msgs   = Array.isArray(S.stats?.feedback) ? S.stats.feedback : [];
  const faults = Array.isArray(S.stats?.faults)   ? S.stats.faults   : [];
  if (msgs.length === 0 && faults.length === 0) return '';

  const msgCard = msgs.length ? `
    <div class="card card-pad">
      <div style="font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:14px">
        💬 Messages de vos membres (${msgs.length})
      </div>
      ${msgs.slice(0,5).map(m=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--border,#eee)">
          <div style="font-size:13px;white-space:pre-wrap">${escapeHtml(m.message)}</div>
          <div style="font-size:11px;color:var(--ink3);margin-top:5px">
            ${new Date(m.created_at).toLocaleString('fr-CH')}
            ${m.phone ? ' · <a href="tel:'+escapeHtml(m.phone)+'">'+escapeHtml(m.phone)+'</a>' : ' · sans numéro'}
          </div>
        </div>`).join('')}
    </div>` : '';

  const faultCard = faults.length ? `
    <div class="card card-pad">
      <div style="font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:14px">
        ⚠️ Distributions échouées (${faults.length})
      </div>
      ${faults.slice(0,5).map(f=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--border,#eee)">
          <div style="font-size:13px"><strong>${escapeHtml(f.product_name||'Boisson')}</strong> — ${escapeHtml(f.fail_reason||'motif non communiqué')}</div>
          <div style="font-size:11px;color:var(--ink3);margin-top:5px">${f.updated_at?new Date(f.updated_at).toLocaleString('fr-CH'):''}</div>
        </div>`).join('')}
      <div style="font-size:12px;color:var(--ink3);margin-top:10px">
        Le membre n'a rien perdu : ni sa boisson, ni son délai de 15 minutes.
      </div>
    </div>` : '';

  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px">
    ${msgCard}${faultCard}
  </div>`;
}

async function toggleAccess(userId, authorized) {
  const res = await api('/api/fitness?action=access', { user_id: userId, authorized }, 'POST');
  if (res.error) { toast('Erreur: ' + res.error, false); return; }
  const m = S.members.find(x=>x.id==userId);
  if (m) m.authorized = authorized;
  toast(authorized ? '🔓 Accès rétabli' : '🔒 Membre bloqué');
  goTo('members');
}

// Bascule entre "durée liée à un plan" et "nombre de jours exact".
function setSubMode(mode) {
  window._subMode = mode;
  const isPlan = mode === 'plan';
  const planRow = document.getElementById('sub-plan-row');
  const daysRow = document.getElementById('sub-days-row');
  const bPlan = document.getElementById('sub-mode-plan');
  const bDays = document.getElementById('sub-mode-days');
  if (planRow) planRow.style.display = isPlan ? '' : 'none';
  if (daysRow) daysRow.style.display = isPlan ? 'none' : '';
  if (bPlan) { bPlan.className = isPlan ? 'btn btn-sm' : 'btn btn-sm btn-ghost'; bPlan.style.background = isPlan ? 'var(--blue)' : ''; bPlan.style.color = isPlan ? '#fff' : ''; }
  if (bDays) { bDays.className = !isPlan ? 'btn btn-sm' : 'btn btn-sm btn-ghost'; bDays.style.background = !isPlan ? 'var(--blue)' : ''; bDays.style.color = !isPlan ? '#fff' : ''; }
  previewSub();
}

// Aperçu local, calqué sur le calcul serveur.
function previewSub() {
  const box = document.getElementById('sub-preview');
  if (!box) return;
  const start = (document.getElementById('sub-start')||{}).value;
  if (!start) { box.textContent = 'Choisis une date de début.'; return; }
  const [y,m,d] = start.split('-').map(Number);
  const startD = new Date(Date.UTC(y, m - 1, d));
  const f = dt => dt.toLocaleDateString('fr-CH', { timeZone:'UTC', day:'numeric', month:'short', year:'numeric' });

  if (window._subMode === 'days') {
    const n = parseInt((document.getElementById('sub-days')||{}).value, 10);
    if (!n || n < 1) { box.textContent = 'Indique un nombre de jours valide (≥ 1).'; return; }
    const endD = new Date(startD.getTime() + (n - 1) * 86400000);
    box.innerHTML = `📅 Du <strong>${f(startD)}</strong> au <strong>${f(endD)}</strong> inclus · <strong>${n} jour${n>1?'s':''}</strong>`;
    return;
  }

  const plan = (document.getElementById('sub-plan')||{}).value || 'month';
  const months = { month:1, quarter:3, year:12 }[plan] || 1;
  const idx = (m - 1) + months;
  const tY = y + Math.floor(idx / 12);
  const tM = (idx % 12) + 1;
  const lastDay = new Date(Date.UTC(tY, tM, 0)).getUTCDate();
  const endD = (d <= lastDay)
    ? new Date(Date.UTC(tY, tM - 1, d) - 86400000)
    : new Date(Date.UTC(tY, tM, 1) - 86400000);
  const days = Math.round((endD - startD) / 86400000) + 1;
  box.innerHTML = `📅 Du <strong>${f(startD)}</strong> au <strong>${f(endD)}</strong> inclus · <strong>${days} jours</strong>`;
}

async function toggleSubscribe(userId, subscribed, plan, startDate) {
  const btn = document.querySelector('#modal-bg .btn-blue, #modal-bg .btn-danger');
  if (btn) { btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; }
  const payload = { user_id: userId, subscribed, plan };
  if (subscribed && startDate) payload.start_date = startDate;
  if (subscribed && window._subMode === 'days') {
    const n = parseInt((document.getElementById('sub-days')||{}).value, 10);
    if (!n || n < 1) { toast('Nombre de jours invalide.', false); if (btn) { btn.disabled = false; btn.innerHTML = 'Activer ✓'; } return; }
    payload.days = n;
    delete payload.plan;
  }
  const res = await api('/api/fitness?action=subscribe', payload, 'POST');
  if (res.error) { toast('Erreur: ' + res.error, false); if (btn) { btn.disabled = false; btn.innerHTML = subscribed ? 'Activer ✓' : 'Résilier ✓'; } return; }
  closeModal();
  const m = S.members.find(x=>x.id==userId);
  if (m) {
    m.subscribed = subscribed;
    if (subscribed) {
      m.plan = res.plan || plan;
      m.sub_start = res.sub_start || m.sub_start;
      m.sub_end   = res.sub_end   || m.sub_end;
      m.days_left = typeof res.days === 'number' ? res.days : m.days_left;
    } else {
      m.sub_start = null; m.sub_end = null; m.days_left = null;
    }
  }
  toast(subscribed ? `✅ Abo activé — du ${res.sub_start} au ${res.sub_end} (${res.days} j)` : '⛔ Abonnement résilié');
  // Recharge pour refléter exactement l'état en base.
  try {
    const fresh = await api('/api/fitness?action=members');
    if (!fresh.error && Array.isArray(fresh.members)) S.members = fresh.members;
  } catch(e) {}
  goTo('members');
}

  <div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-title">⏸️ Mettre l'abonnement en pause</div>
      <div style="font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:18px">${escapeHtml(m.name)}</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="row2" style="gap:12px">
          <div style="flex:1"><label class="lbl">Du</label><input class="inp" type="date" id="pause-from" min="${t}" value="${t}" onchange="previewPause()"/></div>
          <div style="flex:1"><label class="lbl">Au (inclus)</label><input class="inp" type="date" id="pause-to" min="${t}" value="${t}" onchange="previewPause()"/></div>
        </div>
        <div id="pause-preview" style="background:rgba(0,87,255,.07);border:1px solid rgba(0,87,255,.2);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;color:var(--blue)"></div>
        <div style="background:rgba(0,196,122,.08);border:1px solid rgba(0,196,122,.2);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--green);font-weight:500">
          ✅ L'accès est suspendu pendant la pause, et la date de fin est repoussée d'autant. Le membre ne perd aucun jour.
        </div>
        <div class="row2" style="margin-top:4px">
          <button class="btn btn-blue" style="justify-content:center" onclick="submitPause('${userId}')">Mettre en pause ✓</button>
          <button class="btn btn-ghost" style="justify-content:center" onclick="closeModal()">Annuler</button>
        </div>
      </div>
    </div>
  </div>`);
  previewPause();
}

function previewPause() {
  const box = document.getElementById('pause-preview');
  if (!box) return;
  const f = (document.getElementById('pause-from')||{}).value;
  const t = (document.getElementById('pause-to')||{}).value;
  if (!f || !t) { box.textContent = 'Choisis les deux dates.'; return; }
  const fD = new Date(f + 'T00:00:00Z'), tD = new Date(t + 'T00:00:00Z');
  if (tD < fD) { box.textContent = '⚠️ La date de fin doit être après la date de début.'; return; }
  const n = Math.round((tD - fD) / 86400000) + 1;
  const fmt = d => d.toLocaleDateString('fr-CH',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'});
  box.innerHTML = `⏸️ Pause du <strong>${fmt(fD)}</strong> au <strong>${fmt(tD)}</strong> inclus · <strong>${n} jour${n>1?'s':''}</strong> rendus à la fin`;
}

async function submitPause(userId) {
  const btn = document.querySelector('#modal-bg .btn-blue');
  const from = (document.getElementById('pause-from')||{}).value;
  const to   = (document.getElementById('pause-to')||{}).value;
  if (!from || !to) { toast('Choisis les deux dates.', false); return; }
  if (btn) { btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; }
  const res = await api('/api/fitness?action=pause', { user_id: userId, from, to }, 'POST');
  if (res.error) { toast('Erreur: ' + res.error, false); if (btn) { btn.disabled=false; btn.innerHTML='Mettre en pause ✓'; } return; }
  closeModal();
  toast(`⏸️ Pause de ${res.days} j — fin repoussée au ${res.sub_end}`);
  await refreshMembers(); goTo('members');
}

async function cancelPause(userId) {
  const res = await api('/api/fitness?action=cancel-pause', { user_id: userId }, 'POST');
  if (res.error) { toast('Erreur: ' + res.error, false); return; }
  toast(`▶️ Pause annulée — fin ajustée au ${res.sub_end}`);
  await refreshMembers(); goTo('members');
}

async function refreshMembers() {
  try {
    const fresh = await api('/api/fitness?action=members');
    if (!fresh.error && Array.isArray(fresh.members)) S.members = fresh.members;
  } catch(e) {}
}

// ── Historique lisible d'un membre ──────────────────────
async function showSubHistory(userId) {
  const m = S.members.find(x=>x.id==userId);
  if (!m) return;
  document.body.insertAdjacentHTML('beforeend',`
  <div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:520px">
      <div class="modal-title">📜 Historique d'abonnement</div>
      <div style="font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:18px">${escapeHtml(m.name)}</div>
      <div id="sub-history-body" style="max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px">
        <div style="text-align:center;padding:24px;color:var(--ink3);font-size:13px">Chargement…</div>
      </div>
      <div class="row2" style="margin-top:18px">
        <button class="btn btn-ghost" style="justify-content:center;width:100%" onclick="closeModal()">Fermer</button>
      </div>
    </div>
  </div>`);

  const res = await api(`/api/fitness?action=sub-history&user_id=${userId}`);
  const body = document.getElementById('sub-history-body');
  if (!body) return;

  if (res.error) { body.innerHTML = `<div style="color:var(--red);font-size:13px">Erreur : ${escapeHtml(res.error)}</div>`; return; }
  if (!res.events || res.events.length === 0) {
    body.innerHTML = `<div style="text-align:center;padding:24px;color:var(--ink3);font-size:13px">Aucun événement enregistré pour ce membre.</div>`;
    return;
  }

  const SOURCE_LABEL = { admin:'Admin VOLT', gym:'Fitness', stripe:'Carte (Stripe)', twint:'TWINT', system:'Système' };
  body.innerHTML = res.events.map(e => `
    <div style="border:1px solid var(--border2);border-radius:10px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <div style="font-weight:700;font-size:13.5px">${escapeHtml(e.label)}</div>
        <div style="font-size:11.5px;color:var(--ink3);white-space:nowrap">${escapeHtml(e.when)}</div>
      </div>
      ${e.window ? `<div style="font-size:12.5px;color:var(--ink2);margin-top:4px">${escapeHtml(e.window)}${e.days?` · ${e.days} jour${e.days>1?'s':''}`:''}</div>` : ''}
      <div style="font-size:11.5px;color:var(--ink3);margin-top:4px">
        ${e.plan_label ? `${escapeHtml(e.plan_label)} · ` : ''}Source : ${SOURCE_LABEL[e.source]||escapeHtml(e.source||'—')}
      </div>
      ${e.note ? `<div style="font-size:11.5px;color:var(--ink3);margin-top:4px;font-style:italic">${escapeHtml(e.note)}</div>` : ''}
    </div>
  `).join('');
}

// ── CONSOMMATION ─────────────────────────────────────
function pageScans() {
  const totalMonth = S.scans.reduce((s,r)=>s+r.n,0);
  const maxDay     = S.scans.length ? S.scans.reduce((a,b)=>a.n>b.n?a:b,{n:0}) : null;
  const maxN       = Math.max(...S.scans.map(s=>s.n), 1);
  const today      = new Date().toISOString().slice(0,10);

  return `
  <div class="topbar">
    <div><div class="page-title">Consommation</div><div class="page-sub">Boissons distribuées — 30 derniers jours</div></div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><span class="kpi-ico">⚡</span>
      <div class="kpi-val blue">${totalMonth}</div>
      <div class="kpi-label">Boissons ce mois</div>
    </div>
    <div class="kpi"><span class="kpi-ico">📅</span>
      <div class="kpi-val green">${maxDay ? maxDay.n : 0}</div>
      <div class="kpi-label">Record journalier</div>
      <div class="kpi-sub">${maxDay ? new Date(maxDay.day).toLocaleDateString('fr-CH',{day:'numeric',month:'short'}) : '—'}</div>
    </div>
    <div class="kpi"><span class="kpi-ico">📊</span>
      <div class="kpi-val orange">${S.scans.length ? Math.round(totalMonth/S.scans.length*10)/10 : 0}</div>
      <div class="kpi-label">Moyenne / jour</div>
    </div>
  </div>

  <div class="card card-pad">
    <div style="font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:20px">Détail par jour</div>
    ${S.scans.length === 0
      ? '<div class="empty"><div class="empty-ico">📊</div><div class="empty-sub">Aucun scan enregistré ce mois</div></div>'
      : `<div class="bar-chart" style="height:140px">
          ${S.scans.map(s => `
            <div class="bar-item">
              <div style="font-size:9px;font-weight:700;color:var(--ink3);margin-bottom:2px">${s.n}</div>
              <div class="bar-fill ${s.day===today?'today':''}" style="height:${Math.max(Math.round(s.n/maxN*100),3)}px"></div>
              <div class="bar-lbl">${new Date(s.day).toLocaleDateString('fr-CH',{day:'numeric',month:'numeric'})}</div>
            </div>`).join('')}
        </div>
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border2)">
          <div class="table-wrap"><table>
            <thead><tr><th>Date</th><th>Boissons</th></tr></thead>
            <tbody>
              ${[...S.scans].reverse().map(s=>`<tr>
                <td>${new Date(s.day).toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'})}</td>
                <td><strong>${s.n}</strong></td>
              </tr>`).join('')}
            </tbody>
          </table></div>
        </div>`
    }
  </div>`;
}

// ── REVENUS ──────────────────────────────────────────
function pageVirements() {
  const total = S.virements.reduce((s,v)=>s+v.total,0);

  return `
  <div class="topbar">
    <div><div class="page-title">Revenus</div><div class="page-sub">CA généré par vos membres abonnés</div></div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><span class="kpi-ico">💰</span>
      <div class="kpi-val blue">${fmtChf(S.virements[0]?.total || 0)}</div>
      <div class="kpi-label">Ce mois</div>
    </div>
    <div class="kpi"><span class="kpi-ico">📈</span>
      <div class="kpi-val green">${fmtChf(total)}</div>
      <div class="kpi-label">Total cumulé</div>
    </div>
    <div class="kpi"><span class="kpi-ico">👥</span>
      <div class="kpi-val orange">${S.members.filter(m=>m.subscribed).length}</div>
      <div class="kpi-label">Membres actifs</div>
    </div>
  </div>

  <div class="card">
    ${S.virements.length === 0
      ? '<div class="empty"><div class="empty-ico">💰</div><div class="empty-title">Aucun revenu</div><div class="empty-sub">Les revenus apparaîtront dès qu\'un membre souscrit un abonnement</div></div>'
      : `<div class="table-wrap"><table>
          <thead><tr><th>Mois</th><th>CA généré</th><th>Paiements</th><th>Statut</th></tr></thead>
          <tbody>
            ${S.virements.map(v=>`<tr>
              <td style="font-weight:700">${v.month}</td>
              <td><strong style="font-family:'Barlow Condensed',sans-serif;font-size:18px">${fmtChf(v.total)}</strong></td>
              <td style="color:var(--ink3)">${v.nb_payments} paiement(s)</td>
              <td><span class="badge badge-green">✓ Comptabilisé</span></td>
            </tr>`).join('')}
          </tbody>
          <tfoot><tr style="background:var(--bg)">
            <td><strong>TOTAL</strong></td>
            <td><strong style="font-family:'Barlow Condensed',sans-serif;font-size:18px">${fmtChf(total)}</strong></td>
            <td colspan="2"></td>
          </tr></tfoot>
        </table></div>`
    }
  </div>

  <div style="margin-top:16px;background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:16px 20px;font-size:13px;color:var(--ink2);font-weight:500">
    💡 Ces chiffres représentent le CA total généré par vos membres. Les reversements sont effectués par VOLT. chaque mois. Pour toute question : <a href="mailto:info@volt-energy.ch" style="color:var(--blue);font-weight:700;text-decoration:none">info@volt-energy.ch</a>
  </div>`;
}

// ── REFRESH ──────────────────────────────────────────
async function refreshData() {
  toast('🔄 Actualisation...');
  const [statsRes, membersRes, scansRes, virementsRes] = await Promise.all([
    api('/api/fitness?action=stats'),
    api('/api/fitness?action=members'),
    api('/api/fitness?action=scans'),
    api('/api/fitness?action=virements'),
  ]);
  if (!statsRes.error)     S.stats     = statsRes;
  if (!membersRes.error)   S.members   = membersRes.members   || [];
  if (!scansRes.error)     S.scans     = scansRes.scans       || [];
  if (!virementsRes.error) S.virements = virementsRes.virements || [];
  goTo(S.page);
  if (statsRes.error || membersRes.error || scansRes.error || virementsRes.error) {
    toast('⚠️ Erreur réseau — données incomplètes.', false);
  } else {
    toast('✅ Données actualisées !');
  }
}

// ── BOOT ─────────────────────────────────────────────
renderLogin();
</script>
</body>
</html>
