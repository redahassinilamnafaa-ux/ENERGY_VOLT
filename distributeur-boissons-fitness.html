<style>
.svc{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:52px}
.svc-card{background:var(--white);border:1.5px solid var(--border2);border-radius:24px;padding:30px;display:flex;gap:20px;align-items:flex-start;transition:transform .3s,box-shadow .3s,border-color .3s}
.svc-card:hover{transform:translateY(-5px);box-shadow:0 20px 50px var(--blue-glow);border-color:var(--blue)}
.svc-ic{width:56px;height:56px;border-radius:16px;flex-shrink:0;background:var(--blue-soft);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px}
.svc-card h3{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--ink);margin-bottom:8px;text-transform:uppercase;letter-spacing:.01em}
.svc-card p{font-size:14px;color:var(--ink3);line-height:1.7;font-weight:500}
.svc-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;color:var(--blue);line-height:1}
.statband{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--white);border:1.5px solid var(--border2);border-radius:24px;overflow:hidden;margin-top:54px}
.statband .s{padding:30px 22px;text-align:center;border-right:1px solid var(--border2)}
.statband .s:last-child{border-right:none}
.statband .n{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:46px;line-height:1;color:var(--ink)}
.statband .n small{color:var(--blue);font-size:24px}
.statband .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:8px}
@media(max-width:920px){.svc{grid-template-columns:1fr}.statband{grid-template-columns:repeat(2,1fr)}.statband .s:nth-child(2){border-right:none}}
@media(max-width:560px){.statband{grid-template-columns:1fr}.statband .s{border-right:none;border-bottom:1px solid var(--border2)}}
.faq-item{background:var(--white);border-radius:16px;margin-bottom:8px;overflow:hidden;border:1.5px solid var(--border2);transition:border-color .25s,box-shadow .25s,transform .25s;cursor:pointer}
.faq-item:hover{border-color:var(--blue);box-shadow:0 8px 30px var(--blue-glow);transform:translateY(-2px)}
.faq-item.open{border-color:var(--blue);box-shadow:0 8px 30px var(--blue-glow)}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;cursor:pointer;gap:16px}
.faq-q-text{font-size:16px;font-weight:700;color:var(--ink)}
.faq-icon{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--blue);transition:all .3s;font-weight:700}
.faq-item.open .faq-icon{background:var(--blue);color:#fff;transform:rotate(45deg)}
.faq-a{font-size:14px;color:var(--ink3);line-height:1.8;max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s;font-weight:500;padding:0 24px}
.faq-item.open .faq-a{max-height:300px;padding:0 24px 20px}
/* machines */
.machines-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.machine-card{background:var(--white);border:1.5px solid var(--border2);border-radius:24px;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}
.machine-card:hover{transform:translateY(-5px);box-shadow:0 20px 50px var(--blue-glow);border-color:var(--blue)}
.machine-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--blue-soft);color:var(--blue);border-radius:20px;padding:5px 14px;margin:20px 20px 0}
.machine-badge-pro{background:var(--ink);color:#fff}
.machine-img{padding:24px;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:260px}
.machine-img img{max-height:240px;width:auto;object-fit:contain;display:block;margin:0 auto}
.machine-body{padding:24px}
.machine-body h3{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;text-transform:uppercase;color:var(--ink);margin-bottom:10px}
.machine-desc{font-size:14px;color:var(--ink3);line-height:1.7;font-weight:500;margin-bottom:20px}
.machine-specs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.machine-specs li{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink)}
.spec-icon{font-size:16px;flex-shrink:0}
@media(max-width:700px){.machines-grid{grid-template-columns:1fr}}
</style>
