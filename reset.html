<!DOCTYPE html>
<html lang="fr">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>VOLT. · Réinitialiser le mot de passe</title>
<link rel="icon" type="image/png" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root{--ink:#040c22;--blue:#0057FF;--blue-dark:#0042c4;--soft:#f4f6fb;--border:#e6e9f0;--ink3:#8a93a6;--red:#FF3B5C;--green:#00C47A}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--ink);color:var(--ink)}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
  .wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 70% 10%,rgba(0,87,255,.3),transparent 65%)}
  .wrap::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
  .box{background:#fff;border-radius:28px;padding:44px 40px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 32px 80px rgba(0,0,0,.35)}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:56px;color:var(--ink);letter-spacing:-2px;line-height:1;margin-bottom:4px}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--border);border-radius:50px;padding:4px 12px;margin-bottom:28px}
  .tag span{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}
  h1{font-size:22px;font-weight:800;margin-bottom:8px}
  .sub{font-size:14px;color:var(--ink3);line-height:1.6;margin-bottom:24px}
  .lbl{display:block;font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:8px;letter-spacing:.02em}
  .inp{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;font-family:inherit;color:var(--ink);transition:all .2s;margin-bottom:16px}
  .inp:focus{outline:none;border-color:var(--blue);background:#fff}
  .btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:15px 20px;font-size:15px;font-weight:900;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;letter-spacing:.03em}
  .btn:hover{background:var(--blue-dark)}
  .btn:disabled{opacity:.6;cursor:default}
  .err{display:none;color:var(--red);font-size:13px;font-weight:600;margin-bottom:14px;background:#FFEBEF;padding:12px 14px;border-radius:10px}
  .ok-box{display:none;text-align:center}
  .ok-box .ico{font-size:56px;margin-bottom:14px}
  .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .link{display:inline-block;margin-top:18px;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="logo">VOLT.</div>
      <div class="tag"><span>🔑 Réinitialisation</span></div>

      <div id="form-view">
        <h1>Nouveau mot de passe</h1>
        <div class="sub">Choisis un nouveau mot de passe pour ton compte VOLT.</div>
        <div class="err" id="err"></div>
        <label class="lbl">Nouveau mot de passe</label>
        <input class="inp" id="pwd" type="password" placeholder="••••••••" autocomplete="new-password"/>
        <label class="lbl">Confirmer le mot de passe</label>
        <input class="inp" id="pwd2" type="password" placeholder="••••••••" autocomplete="new-password"/>
        <button class="btn" id="btn" onclick="submitReset()">Enregistrer →</button>
      </div>

      <div class="ok-box" id="ok-view">
        <div class="ico">✅</div>
        <h1>Mot de passe modifié</h1>
        <div class="sub" id="ok-sub">Tu peux maintenant te connecter avec ton nouveau mot de passe.</div>
        <a class="link" id="ok-link" href="/VoltApp.html">← Aller à la connexion</a>
      </div>
    </div>
  </div>

<script>
const BACKEND = 'https://volt-backend-final.vercel.app';
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';

function showErr(msg){ const e=document.getElementById('err'); e.textContent=msg; e.style.display='block'; }

if (!token) {
  document.getElementById('form-view').innerHTML =
    '<h1>Lien invalide</h1><div class="sub">Ce lien de réinitialisation est incomplet ou a expiré. Refais une demande depuis la page de connexion.</div><a class="link" href="/VoltApp.html">← Retour à la connexion</a>';
}

async function submitReset(){
  const pwd  = document.getElementById('pwd').value;
  const pwd2 = document.getElementById('pwd2').value;
  document.getElementById('err').style.display='none';
  if (!pwd || !pwd2) { showErr('Remplis les deux champs.'); return; }
  if (pwd.length < 6) { showErr('Mot de passe trop court (min. 6 caractères).'); return; }
  if (pwd !== pwd2) { showErr('Les deux mots de passe ne correspondent pas.'); return; }
  const btn = document.getElementById('btn');
  btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true;
  try {
    const r = await fetch(BACKEND + '/api/login?action=reset', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, password: pwd })
    });
    const res = await r.json();
    if (res.error) { showErr(res.error); btn.innerHTML='Enregistrer →'; btn.disabled=false; return; }
    // Succès : adapter le lien de connexion selon le type de compte
    const link = document.getElementById('ok-link');
    if (res.account_type === 'gym') {
      link.href = '/fitness.html';
      document.getElementById('ok-sub').textContent = 'Tu peux maintenant te connecter à ton Espace Fitness.';
      link.textContent = '← Aller à l\'Espace Fitness';
    }
    document.getElementById('form-view').style.display='none';
    document.getElementById('ok-view').style.display='block';
  } catch(e) {
    showErr('Erreur réseau. Réessaie.'); btn.innerHTML='Enregistrer →'; btn.disabled=false;
  }
}
document.getElementById('pwd2')?.addEventListener('keydown', e=>{ if(e.key==='Enter') submitReset(); });
</script>
</body>
</html>
