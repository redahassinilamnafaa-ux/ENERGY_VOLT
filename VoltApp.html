<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VOLT.</title>

<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="VOLT."/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" type="image/png" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
::-webkit-scrollbar{display:none}
:root{
  --blue:#0057FF;
  --blue-mid:#2979FF;
  --blue-dark:#003FCC;
  --blue-soft:rgba(0,87,255,.07);
  --blue-soft2:rgba(0,87,255,.12);
  --blue-glow:rgba(0,87,255,.22);
  --ink:#060D2E;
  --ink2:#2D3652;
  --ink3:#6B7A99;
  --ink4:#A8B4CC;
  --bg:#F7F9FF;
  --bg2:#EDF1FB;
  --white:#FFFFFF;
  --border:rgba(0,87,255,.1);
  --border2:rgba(10,15,30,.07);
  --green:#00C47A;
  --red:#FF3B5C;
  --orange:#FF9500;
}
::selection{background:var(--blue);color:#fff}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:82px;overscroll-behavior-y:contain}
.screen-full{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.bc{font-family:'Barlow Condensed',sans-serif}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--border2);display:flex;z-index:100;padding:8px 0 max(16px,env(safe-area-inset-bottom))}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px 0;transition:color .15s}
.bnav-btn .ni{font-size:22px;line-height:1}
.bnav-btn .nl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bnav-btn.on{color:var(--blue)}
.bnav-btn:not(.on){color:var(--ink3)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:var(--white)}
.inp::placeholder{color:var(--ink4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 18px var(--blue-glow)}
.btn-blue:not(:disabled):hover{background:var(--blue-mid);transform:translateY(-2px);box-shadow:0 8px 32px var(--blue-glow)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink2)}
.btn-ghost{background:var(--bg2);color:var(--ink)}
.btn-sm{padding:9px 18px;font-size:16px;width:auto;border-radius:50px}
.card{background:var(--white);border-radius:20px;border:1px solid var(--border2)}
.hdr{background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%);padding:16px 20px 0}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}
.logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#fff;letter-spacing:-.5px}
.qr-card{background:var(--ink);border-radius:24px;margin:14px 16px 0;padding:22px 18px;position:relative;overflow:hidden;animation:fadeIn .35s ease}
.qr-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 80% 0%,rgba(0,87,255,.85),rgba(0,60,220,.45) 50%,rgba(0,20,120,.2) 80%,transparent);pointer-events:none}
.qr-inner{position:relative;z-index:1}
.qr-box{background:var(--white);border-radius:16px;padding:12px;display:inline-block}
.qr-box.blur{filter:blur(6px);pointer-events:none}
.qr-overlay{position:absolute;inset:0;border-radius:16px;background:rgba(6,13,46,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .3s}
.qr-cd{filter:grayscale(1) brightness(.35);transition:filter .3s}
.cd-track{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:8px 0}
.cd-fill{height:100%;border-radius:2px;transition:width 1s linear,background .5s}
.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-k{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.row-item{background:var(--white);display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:4px;cursor:pointer;border:1px solid var(--border2);transition:background .12s}
.row-item:active{background:var(--bg2)}
.row-ico{width:36px;height:36px;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.row-lbl{font-size:15px;font-weight:600;flex:1;color:var(--ink)}
.row-r{font-size:13px;font-weight:600;color:var(--ink3)}
.row-chev{font-size:18px;color:var(--ink4)}
.row-danger .row-lbl{color:var(--red)}
.row-danger .row-ico{background:#FFF0F2}
.row-danger .row-chev{color:var(--red)}
.hist-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border2)}
.hist-row:last-child{border-bottom:none}
.hist-ico{width:44px;height:44px;background:var(--blue-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--white);border-radius:16px;padding:14px 10px;border:1px solid var(--border2);text-align:center}
.stat-v{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:var(--ink);line-height:1}
.stat-l{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.plan-card{border:1.5px solid var(--border2);border-radius:20px;padding:20px;cursor:pointer;transition:all .22s;position:relative;margin-bottom:10px;background:var(--white)}
.plan-card:hover{border-color:var(--blue);box-shadow:0 8px 28px var(--blue-glow);transform:translateY(-2px)}
.plan-card.sel{border:2px solid var(--blue);box-shadow:0 8px 28px var(--blue-glow),0 0 0 3px var(--blue-soft)}
.plan-card.feat{background:linear-gradient(145deg,var(--blue-dark),var(--blue));border-color:transparent;box-shadow:0 12px 32px var(--blue-glow)}
.plan-card.feat.sel{box-shadow:0 16px 44px rgba(0,87,255,.4),0 0 0 3px rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.6)!important}
.stats-card{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px;padding:22px;margin-bottom:14px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.52);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--white);border-radius:28px 28px 0 0;width:100%;max-width:430px;padding:26px 22px max(40px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-pill{width:36px;height:4px;background:#E0E0DF;border-radius:2px;margin:0 auto 22px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:20px;color:var(--ink)}
#notif{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:990;max-width:390px;width:calc(100% - 40px);box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#notif.show{transform:translateX(-50%) translateY(0)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--ink);color:#fff;border-radius:50px;padding:11px 20px;font-size:14px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#stripe-el{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;transition:border-color .2s}
#stripe-el.StripeElement--focus{border-color:var(--blue);background:var(--white)}
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
#install-banner{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--ink);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:200;max-width:400px;width:calc(100% - 32px);box-shadow:0 4px 30px rgba(0,0,0,.25);border:1px solid var(--border);animation:fadeUp .3s ease}
</style>
</head>
<body>
<div id="app"><div id="volt-splash" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%)"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:76px;color:#fff;letter-spacing:-2px;line-height:1">VOLT.</div><div style="font-size:14px;font-weight:500;color:rgba(255,255,255,.38);margin-top:12px">Chargement…</div></div></div>
<div id="toast"></div>
<div id="notif">
  <span id="notif-icon" style="font-size:20px;flex-shrink:0"></span>
  <span id="notif-text" style="font-size:13px;font-weight:700;flex:1"></span>
  <button onclick="document.getElementById('notif').classList.remove('show')" style="background:none;border:none;color:rgba(255,255,255,.35);font-size:18px;cursor:pointer">✕</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
<script src="https://js.stripe.com/v3/" async></script>
<script>
const CFG = {
  API: 'https://volt-backend-final.vercel.app',
  STRIPE_KEY: 'pk_live_51TYCHoClAT61ADIRmCN6fiHdNNAzqWW3Se7zCOVUQzRrMllm8VQdGPwnOfpNE9rTKqCpFQbCPBhj1TJgTIkIoyDR000T77uHse',
  CD_SECS: 900,
};
const PLANS = [
  { id:'month',   label:'MENSUEL',      chf:'9.90',  per:'/mois',    saving:null,             badge:null,             feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Sans engagement'] },
  { id:'quarter', label:'TRIMESTRIEL',  chf:'24.90', per:'/3 mois',  saving:'Econ. 5 CHF',    badge:'🔥 POPULAIRE',      feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Priorité support'] },
  { id:'year',    label:'ANNUEL',       chf:'79.90', per:'/an',      saving:'Econ. 38 CHF',   badge:'⚡ MEILLEURE OFFRE', feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Accès premium futur'] },
];
const DEMO = false;
const DEMO_USER = { name:'Alex Demo', email:'demo@volt.ch', subscribed:true, plan:'quarter', created_at:'2025-01-01T00:00:00Z' };
const PARAMS = new URLSearchParams(window.location.search);
let S = { screen:'splash', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true };
let cdTimer = null, qrRotateTimer = null, qrCache = { dataUrl:null, expiry:0 };
function saveSess() { try { localStorage.setItem('volt_s', JSON.stringify(S)); } catch(e){} }
function loadSess() { try { const d = JSON.parse(localStorage.getItem('volt_s')||'{}'); if (d.token && d.user) { S = Object.assign(S, d); S.screen = 'home'; } } catch(e) {} }
function cdLeft() { return Math.max(0, Math.floor((S.cdEnd||0) - Date.now()/1000)); }
function fmtCd(s) { const m = Math.floor(s/60); const sc = s%60; return m+':'+String(sc).padStart(2,'0'); }
function api(path, body, method='POST') {
  const opts = { method: method||'POST', headers: { 'Content-Type':'application/json' } };
  if (S.token) opts.headers['Authorization'] = 'Bearer '+S.token;
  if (body) opts.body = JSON.stringify(body);
  return fetch(CFG.API+path, opts).then(r=>r.json()).catch(()=>({error:'Réseau indisponible'}));
}
function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = (ok?'✅ ':'❌ ')+msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3400);
}
function showNotif(icon, msg) {
  const n = document.getElementById('notif');
  if (!n) return;
  document.getElementById('notif-icon').textContent = icon;
  document.getElementById('notif-text').textContent = msg;
  n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'), 5000);
}
function startCdTick() {
  if (cdTimer) clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    const left = cdLeft();
    const fillEl = document.getElementById('cd-fill');
    const lblEl  = document.getElementById('cd-lbl');
    const qrEl   = document.getElementById('qr-el');
    const ovEl   = document.getElementById('qr-overlay');
    if (fillEl) {
      const pct = left / CFG.CD_SECS * 100;
      fillEl.style.width = pct+'%';
      fillEl.style.background = left < 60 ? 'var(--red)' : left < 180 ? 'var(--orange)' : 'var(--blue)';
    }
    if (lblEl) lblEl.textContent = left > 0 ? '⏳ Disponible dans '+fmtCd(left) : '';
    if (ovEl) {
      if (left > 0) {
        ovEl.style.opacity = '1';
        if (qrEl) qrEl.classList.add('qr-cd');
      } else {
        ovEl.style.opacity = '0';
        if (qrEl) qrEl.classList.remove('qr-cd');
        clearInterval(cdTimer); cdTimer = null;
      }
    }
    if (left === 0) { clearInterval(cdTimer); cdTimer = null; }
  }, 1000);
}
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (!S.user || !S.token) { app.innerHTML = renderLogin(); bindLogin(); return; }
  if (S.screen === 'verify-success') { app.innerHTML = renderVerifySuccess(); return; }
  app.innerHTML = renderMain();
  bindMain();
}
function renderVerifySuccess() {
  return `
  <div class="screen-full" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:var(--bg)">
    <div style="font-size:64px;margin-bottom:24px">✅</div>
    <div class="bc" style="font-size:36px;font-weight:900;color:var(--ink);margin-bottom:12px">Email vérifié !</div>
    <div style="font-size:16px;color:var(--ink3);margin-bottom:32px">Ton compte est activé. Connecte-toi pour accéder à VOLT.</div>
    <button class="btn btn-blue" style="max-width:280px" onclick="S.screen='home';S.tab='conn';render()">Se connecter</button>
  </div>`;
}
function renderLogin() {
  const t = S.tab||'conn';
  const logoLine = `<div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:62px;color:#fff;letter-spacing:-2px;line-height:1">VOLT.</div><div style="font-size:13px;font-weight:500;color:rgba(255,255,255,.4);margin-top:8px">Abonnement boissons premium</div>`;
  const tabs = `<div style="display:flex;background:rgba(255,255,255,.1);border-radius:50px;padding:3px;margin-bottom:28px">
    <button onclick="S.tab='conn';render()" style="flex:1;padding:9px;border-radius:50px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;cursor:pointer;transition:all .2s;${t==='conn'?'background:#fff;color:var(--blue)':'background:none;color:rgba(255,255,255,.6)'}">CONNEXION</button>
    <button onclick="S.tab='inscr';render()" style="flex:1;padding:9px;border-radius:50px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;cursor:pointer;transition:all .2s;${t==='inscr'?'background:#fff;color:var(--blue)':'background:none;color:rgba(255,255,255,.6)'}">INSCRIPTION</button>
  </div>`;
  if (t === 'conn') {
    return `<div class="screen-full" style="background:linear-gradient(160deg,#060D2E 0%,#0A1A5C 55%,#0D2280 100%);display:flex;flex-direction:column;padding:48px 24px 40px">
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div style="text-align:center;margin-bottom:48px">${logoLine}</div>
        ${tabs}
        <label class="lbl" style="color:rgba(255,255,255,.5)">Email</label>
        <input id="l-email" type="email" class="inp" placeholder="ton@email.com" style="margin-bottom:14px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff" autocomplete="email"/>
        <label class="lbl" style="color:rgba(255,255,255,.5)">Mot de passe</label>
        <input id="l-pass" type="password" class="inp" placeholder="••••••••" style="margin-bottom:22px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff" autocomplete="current-password"/>
        <button id="l-btn" class="btn btn-blue" onclick="doLogin()">SE CONNECTER</button>
        <div id="l-err" style="color:#FF6B85;font-size:13px;font-weight:600;margin-top:12px;text-align:center"></div>
        <button onclick="showForgot()" style="background:none;border:none;color:rgba(255,255,255,.45);font-size:13px;font-weight:500;cursor:pointer;margin-top:16px;text-decoration:underline">Mot de passe oublié ?</button>
      </div>
    </div>`;
  }
  const planSel = S.plan||'quarter';
  const planBtns = PLANS.map(p=>`<button onclick="S.plan='${p.id}';render()" style="flex:1;padding:8px 4px;border-radius:10px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;${planSel===p.id?'background:#fff;color:var(--blue)':'background:none;color:rgba(255,255,255,.5)'}">${p.label}<br><span style="font-size:12px;font-weight:700">${p.chf} CHF</span></button>`).join('');
  const plan = PLANS.find(p=>p.id===planSel)||PLANS[1];
  return `<div class="screen-full" style="background:linear-gradient(160deg,#060D2E 0%,#0A1A5C 55%,#0D2280 100%);display:flex;flex-direction:column;padding:36px 24px 40px;overflow-y:auto">
    <div style="text-align:center;margin-bottom:32px">${logoLine}</div>
    ${tabs}
    <div class="row2" style="margin-bottom:14px">
      <div>
        <label class="lbl" style="color:rgba(255,255,255,.5)">Prénom</label>
        <input id="r-fn" type="text" class="inp" placeholder="Alex" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff" autocomplete="given-name"/>
      </div>
      <div>
        <label class="lbl" style="color:rgba(255,255,255,.5)">Nom</label>
        <input id="r-ln" type="text" class="inp" placeholder="Dupont" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff" autocomplete="family-name"/>
      </div>
    </div>
    <label class="lbl" style="color:rgba(255,255,255,.5)">Email</label>
    <input id="r-email" type="email" class="inp" placeholder="ton@email.com" style="margin-bottom:14px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff" autocomplete="email"/>
    <label class="lbl" style="color:rgba(255,255,255,.5)">Mot de passe</label>
    <input id="r-pass" type="password" class="inp" placeholder="8 caractères minimum" style="margin-bottom:14px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff" autocomplete="new-password"/>
    <label class="lbl" style="color:rgba(255,255,255,.5)">Choisir un abonnement</label>
    <div style="display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;margin-bottom:8px">${planBtns}</div>
    <div style="background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;margin-bottom:16px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:#fff">${plan.label} — ${plan.chf} CHF${plan.per}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.45);margin-top:4px">${plan.feat.join(' · ')}</div>

      `}

  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) el.remove(); });
  if (isCard) { waitForStripeAndMount(); }
}
let stripe = null, stripeCard = null;
function waitForStripeAndMount(attempt=0) {
  if (typeof Stripe !== 'undefined') {
    stripe = Stripe(CFG.STRIPE_KEY);
    const elements = stripe.elements();
    stripeCard = elements.create('card', { style: { base: { fontFamily:'Barlow,sans-serif', fontSize:'16px', color:'#060D2E' } } });
    stripeCard.mount('#stripe-el');
  } else if (attempt < 20) {
    setTimeout(() => waitForStripeAndMount(attempt+1), 300);
  }
}
async function doPayCard() {
  const btn = document.getElementById('pay-btn');
  const errEl = document.getElementById('pay-err');
  if (!btn || !stripeCard) return;
  btn.disabled = true; btn.innerHTML = '<div class="spin"></div>';
  if (!stripe) { if (errEl) errEl.textContent = 'Stripe non chargé. Recharge la page.'; btn.disabled=false; btn.textContent='PAYER'; return; }
  const plan = PLANS.find(p=>p.id===S.plan)||PLANS[1];
  const intentRes = await api('/api/pay-intent', { plan: plan.id });
  if (intentRes.error) { if (errEl) errEl.textContent = intentRes.error; btn.disabled=false; btn.innerHTML='PAYER '+plan.chf+' CHF'; return; }
  const { error, paymentIntent } = await stripe.confirmCardPayment(intentRes.client_secret, { payment_method: { card: stripeCard } });
  if (error) { if (errEl) errEl.textContent = error.message; btn.disabled=false; btn.innerHTML='PAYER '+plan.chf+' CHF'; return; }
  if (paymentIntent.status === 'succeeded') {
    const confirmRes = await api('/api/pay-confirm', { payment_intent_id: paymentIntent.id });
    if (confirmRes.error) { if (errEl) errEl.textContent = confirmRes.error; btn.disabled=false; btn.innerHTML='PAYER '+plan.chf+' CHF'; return; }
    const meRes = await api('/api/user-update?action=me', null, 'GET');
    if (meRes.user) { S.user = Object.assign({}, S.user, meRes.user); saveSess(); }
    const m = document.getElementById('pay-modal'); if (m) m.remove();
    render();
    toast('✅ Abonnement activé ! Bienvenue chez VOLT.', true);
  }
}
async function doPayTwint() {
  const btn = document.getElementById('pay-btn');
  const errEl = document.getElementById('pay-err');
  if (!btn) return;
  btn.disabled = true; btn.innerHTML = '<div class="spin"></div>';
  if (!stripe) {
    if (typeof Stripe !== 'undefined') { stripe = Stripe(CFG.STRIPE_KEY); }
    else { if (errEl) errEl.textContent = 'Stripe non chargé. Recharge la page.'; btn.disabled=false; btn.innerHTML='PAYER AVEC TWINT'; return; }
  }
  const plan = PLANS.find(p=>p.id===S.plan)||PLANS[1];
  const intentRes = await api('/api/pay-intent', { plan: plan.id, method: 'twint' });
  if (intentRes.error) { if (errEl) errEl.textContent = intentRes.error; btn.disabled=false; btn.innerHTML='PAYER AVEC TWINT'; return; }
  const returnUrl = window.location.origin + window.location.pathname + '?payment=twint_success&payment_intent=' + intentRes.payment_intent_id;
  const { error } = await stripe.confirmTwintPayment(intentRes.client_secret, { return_url: returnUrl });
  if (error) { if (errEl) errEl.textContent = error.message; btn.disabled=false; btn.innerHTML='PAYER AVEC TWINT'; }
}

async function doRegister() {
  const fn    = document.getElementById('r-fn')?.value?.trim();
  const ln    = document.getElementById('r-ln')?.value?.trim();
  const email = document.getElementById('r-email')?.value?.trim();
  const pass  = document.getElementById('r-pass')?.value;
  const btn   = document.getElementById('r-btn');
  const err   = document.getElementById('r-err');
  if (!fn||!ln||!email||!pass) { if(err) err.textContent='Remplis tous les champs.'; return; }
  if (pass.length<8) { if(err) err.textContent='Mot de passe trop court (8 caractères min).'; return; }
  if (!S.cgv) { if(err) err.textContent='Accepte les CGV pour continuer.'; return; }
  if (btn) { btn.disabled=true; btn.innerHTML='<div class="spin"></div>'; }
  const res = await api('/api/register', { first_name:fn, last_name:ln, email, password:pass, plan:S.plan });
  if (res.error) { if(err) err.textContent=res.error; if(btn){btn.disabled=false;btn.textContent='COMMENCER';} return; }
  if (btn) { btn.disabled=false; btn.textContent='COMMENCER'; }
  if (err) err.style.color='var(--green)';
  if (err) err.textContent=res.message||'Vérifie ta boîte mail !';
}
function doLogout() {
  localStorage.removeItem('volt_s');
  S = { screen:'splash', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true };
  render();
}

function showForgot() {
  const el = document.createElement('div'); el.className='modal-bg'; el.id='forgot-modal';
  el.innerHTML = `<div class="modal"><div class="modal-pill"></div><div class="modal-title">Mot de passe oublié</div>
    <label class="lbl">Email</label>

    <div id="fg-msg" style="font-size:13px;font-weight:600;margin-top:12px;text-align:center"></div>
    <button onclick="document.getElementById('forgot-modal').remove()" class="btn btn-ghost" style="margin-top:10px">Annuler</button>

  el.addEventListener('click', e=>{ if(e.target===el) el.remove(); });

async function doForgot() {
  const email = document.getElementById('fg-email')?.value?.trim();
  const msg = document.getElementById('fg-msg');
  if (!email) { if(msg) {msg.style.color='var(--red)';msg.textContent='Entre ton email.';} return; }
  const res = await api('/api/forgot-password', { email });
  if (msg) {
    msg.style.color = res.error ? 'var(--red)' : 'var(--green)';
    msg.textContent = res.error || res.message || 'Email envoyé !';
  }
}

async function doEditProfile() {
  const fn = document.getElementById('ep-fn')?.value?.trim();
  const ln = document.getElementById('ep-ln')?.value?.trim();
  const msg = document.getElementById('ep-msg');
  if (!fn||!ln) { if(msg){msg.style.color='var(--red)';msg.textContent='Remplis tous les champs.';} return; }
  const res = await api('/api/user-update', { first_name:fn, last_name:ln });
  if (msg) { msg.style.color=res.error?'var(--red)':'var(--green)'; msg.textContent=res.error||'Profil mis à jour !'; }
  if (!res.error && res.user) { S.user = Object.assign({}, S.user, res.user); saveSess(); render(); document.getElementById('edit-modal')?.remove(); }
}

async function doChangePass() {
  const oldP = document.getElementById('cp-old')?.value;
  const newP = document.getElementById('cp-new')?.value;
  const msg  = document.getElementById('cp-msg');
  if (!oldP||!newP) { if(msg){msg.style.color='var(--red)';msg.textContent='Remplis tous les champs.';} return; }
  if (newP.length<8) { if(msg){msg.style.color='var(--red)';msg.textContent='8 caractères minimum.';} return; }
  const res = await api('/api/user-update', { old_password:oldP, new_password:newP });
  if (msg) { msg.style.color=res.error?'var(--red)':'var(--green)'; msg.textContent=res.error||'Mot de passe mis à jour !'; }
}

function toggleNotif() {
  S.notifs = !S.notifs;
  const tog = document.getElementById('notif-tog');
  if (tog) { tog.style.background = S.notifs?'var(--blue)':'var(--bg2)'; tog.querySelector('.toggle-k').style.left=S.notifs?'21px':'3px'; }
  saveSess();
  if (S.notifs && 'Notification' in window) Notification.requestPermission();
}

  el.innerHTML = `<div class="modal"><div class="modal-pill"></div><div class="modal-title">Conditions générales</div>

function showQrImg(el, dataUrl) {
  el.innerHTML = `<img src="${dataUrl}" width="180" height="180" style="display:block;border-radius:8px"/>`;
}
function bindLogin() {}
function bindMain() {
  const scr = S.screen||'home';
  if (scr === 'home') bindHome();
  else if (scr === 'scan') bindScan();
}
function bindScan() {
  if (S.user?.subscribed) { generateRotatingQR(); if (cdLeft()>0) startCdTick(); }
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = document.getElementById('install-banner'); if (b) b.style.display='flex'; });
function installApp() { if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.then(()=>{ deferredInstall=null; const b=document.getElementById('install-banner'); if(b) b.remove(); }); } }
async function generateRotatingQR() { const el = document.getElementById('qr-el'); if (!el) return; if (typeof QRCode === 'undefined') { setTimeout(generateRotatingQR, 400); return; } const now = Date.now(); const hasQR = !!el.querySelector('img'); const reschedule = (ms) => { if (qrRotateTimer) clearTimeout(qrRotateTimer); qrRotateTimer = setTimeout(generateRotatingQR, ms); }; if (qrCache.dataUrl && now < qrCache.expiry) { if (!hasQR) showQrImg(el, qrCache.dataUrl); reschedule(Math.max(500, qrCache.expiry - now)); return; } if (!hasQR) { el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center"><div class="spin" style="border-color:rgba(0,87,255,.3);border-top-color:var(--blue)"></div></div>'; } const res = await api('/api/qr-token', null, 'GET'); if (res.error) { if (!hasQR) el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; reschedule(10_000); return; } const prevCd = cdLeft(); if (res.cooldown_remaining > 0) { S.cdEnd = Date.now()/1000 + res.cooldown_remaining; saveSess(); if (prevCd === 0) { render(); return; } startCdTick(); } if (!res.token) { if (!hasQR) el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; reschedule(10_000); return; } try { const tmp = document.createElement('div'); new QRCode(tmp, { text: 'volt://' + res.token, width: 180, height: 180, colorDark: '#050A14', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); const canvas = tmp.querySelector('canvas'); const dataUrl = canvas ? canvas.toDataURL() : null; if (dataUrl) { qrCache.dataUrl = dataUrl; qrCache.expiry = now + 9_500; showQrImg(el, dataUrl); } else { el.innerHTML = ''; while (tmp.firstChild) el.appendChild(tmp.firstChild); } } catch(e) { if (!hasQR) el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; } reschedule(10_000); }
function bindHome() { const u = S.user; if (u.subscribed) { generateRotatingQR(); } if (cdLeft() > 0) startCdTick(); api('/api/user-update?action=history', null, 'GET').then(r => { if (r.history) { S.history = r.history; saveSess(); const cnt = document.getElementById('scan-count'); const st = document.getElementById('stat-today'); const sm = document.getElementById('stat-month'); if (cnt) cnt.textContent = r.history.filter(h=>h.month).length; if (st) st.textContent = r.history.filter(h=>h.today).length; if (sm) sm.textContent = r.history.filter(h=>h.month).length; const hEl = document.getElementById('home-hist'); if (hEl) hEl.innerHTML = S.history.length === 0 ? '<div style="padding:24px 0;text-align:center;color:var(--ink3);font-size:14px;font-weight:500">Ton historique apparaîtra ici</div>' : S.history.slice(0,3).map((h,i,a) => '<div class="hist-row"'+(i===a.length-1?' style="border-bottom:none"':'')+'>  <div class="hist-ico">🥤</div><div><div style="font-size:15px;font-weight:600">1 boisson prise</div><div style="font-size:12px;font-weight:500;color:var(--ink3)">'+h.gym+'</div></div><div style="font-size:12px;font-weight:600;color:var(--ink3);margin-left:auto">'+h.time+'</div></div>').join(''); } else { ['scan-count','stat-today','stat-month'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent = '0'; }); } }); }
(function boot() { try { loadSess(); const qsPlan = PARAMS.get('plan'); if (['month','quarter','year'].includes(qsPlan)) S.plan = qsPlan; const qsTab = PARAMS.get('tab'); if ((qsTab === 'signup' || qsTab === 'inscr') && !S.user) S.tab = 'inscr'; if (DEMO && !S.user) { S.user = DEMO_USER; S.token = 'demo'; S.screen = 'home'; } const VERIFY_STATUS = PARAMS.get('verify'); if (VERIFY_STATUS === 'success') { localStorage.removeItem('volt_s'); S = { screen:'verify-success', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true }; window.history.replaceState({}, document.title, window.location.pathname); } else if (VERIFY_STATUS === 'expired') { window.history.replaceState({}, document.title, window.location.pathname); setTimeout(() => toast('Lien expiré. Reconnecte-toi pour renvoyer un email.', false), 400); } const PAYMENT_STATUS = PARAMS.get('payment'); if (PAYMENT_STATUS === 'twint_success') { const piId = PARAMS.get('payment_intent'); const redirectStatus = PARAMS.get('redirect_status'); window.history.replaceState({}, document.title, window.location.pathname); setTimeout(async () => { if (redirectStatus === 'failed') { toast('Paiement TWINT annulé ou refusé. Réessaie.', false); render(); return; } if (S.token) { if (piId) { const confirmRes = await api('/api/pay-confirm', { payment_intent_id: piId, method: 'twint' }); if (confirmRes && confirmRes.error) { toast(confirmRes.error || 'Erreur de paiement TWINT.', false); render(); return; } } const meRes = await api('/api/user-update?action=me', null, 'GET'); if (meRes.user) { S.user = Object.assign({}, S.user, meRes.user); saveSess(); render(); if (S.user.subscribed) { toast('✅ Abonnement activé ! Bienvenue chez VOLT.', true); } else { toast('Paiement en cours de traitement. Réessaie dans quelques instants.', true); } } } }, 500); } render(); if (S.token && S.user && !DEMO) { api('/api/user-update?action=me', null, 'GET').then(meRes => { if (meRes && meRes.user) { S.user = Object.assign({}, S.user, meRes.user); saveSess(); render(); } }).catch(() => {}); } } catch(e) { try { const app = document.getElementById('app'); if (app) { app.innerHTML = renderLogin(); bindLogin(); } } catch(e2) { const app = document.getElementById('app'); if (app) app.innerHTML = '<div style="height:100%;background:#060D2E;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:60px;color:#fff;letter-spacing:-2px">VOLT.</div><div style="color:rgba(255,255,255,.5);font-size:14px;margin-top:16px">Erreur de chargement.</div><button onclick="location.reload()" style="margin-top:24px;background:#0057FF;color:#fff;border:none;border-radius:50px;padding:14px 32px;font-size:16px;font-weight:700;cursor:pointer">Réessayer</button></div>'; } } })();
</script>
