*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}

:root{

  --blue-mid:#2979FF;
  --blue-dark:#003FCC;
  --blue-soft:rgba(0,87,255,.07);

  --ink2:#2D3652;

.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:82px;overscroll-behavior-y:contain}

.bc{font-family:'Barlow Condensed',sans-serif}

.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px 0;transition:color .15s}
.bnav-btn .ni{font-size:22px;line-height:1}
.bnav-btn .nl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bnav-btn.on{color:var(--blue)}

.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:var(--white)}
.inp::placeholder{color:var(--ink4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 18px var(--blue-glow)}
.btn-blue:not(:disabled):hover{background:var(--blue-mid);transform:translateY(-2px);box-shadow:0 8px 32px var(--blue-glow)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink2)}
.btn-ghost{background:var(--bg2);color:var(--ink)}

.card{background:var(--white);border-radius:20px;border:1px solid var(--border2)}
.hdr{background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%);padding:16px 20px 0}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}
.logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#fff;letter-spacing:-.5px}
.qr-card{background:var(--ink);border-radius:24px;margin:14px 16px 0;padding:22px 18px;position:relative;overflow:hidden;animation:fadeIn .35s ease}
.qr-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 80% 0%,rgba(0,87,255,.85),rgba(0,60,220,.45) 50%,rgba(0,20,120,.2) 80%,transparent);pointer-events:none}
.qr-inner{position:relative;z-index:1}
.qr-box{background:var(--white);border-radius:16px;padding:12px;display:inline-block}
.qr-box.blur{filter:blur(6px);pointer-events:none}
.qr-overlay{position:absolute;inset:0;border-radius:16px;background:rgba(6,13,46,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .3s}
.qr-cd{filter:grayscale(1) brightness(.35);transition:filter .3s}
.cd-track{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:8px 0}

.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}

.row-r{font-size:13px;font-weight:600;color:var(--ink3)}
.row-chev{font-size:18px;color:var(--ink4)}
.row-danger .row-lbl{color:var(--red)}
.row-danger .row-ico{background:#FFF0F2}
.row-danger .row-chev{color:var(--red)}
.hist-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border2)}
.hist-row:last-child{border-bottom:none}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--white);border-radius:16px;padding:14px 10px;border:1px solid var(--border2);text-align:center}

.stat-l{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.plan-card{border:1.5px solid var(--border2);border-radius:20px;padding:20px;cursor:pointer;transition:all .22s;position:relative;margin-bottom:10px;background:var(--white)}
.plan-card:hover{border-color:var(--blue);box-shadow:0 8px 28px var(--blue-glow);transform:translateY(-2px)}
.plan-card.sel{border:2px solid var(--blue);box-shadow:0 8px 28px var(--blue-glow),0 0 0 3px var(--blue-soft)}
.plan-card.feat{background:linear-gradient(145deg,var(--blue-dark),var(--blue));border-color:transparent;box-shadow:0 12px 32px var(--blue-glow)}
.plan-card.feat.sel{box-shadow:0 16px 44px rgba(0,87,255,.4),0 0 0 3px rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.6)!important}
.ref-card{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px;padding:22px;margin-bottom:14px}
.ref-link-box{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.52);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--white);border-radius:28px 28px 0 0;width:100%;max-width:430px;padding:26px 22px max(40px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-pill{width:36px;height:4px;background:#E0E0DF;border-radius:2px;margin:0 auto 22px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:20px;color:var(--ink)}
#notif{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:990;max-width:390px;width:calc(100% - 40px);box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#notif.show{transform:translateX(-50%) translateY(0)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--ink);color:#fff;border-radius:50px;padding:11px 20px;font-size:14px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#stripe-el{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;transition:border-color .2s}
#stripe-el.StripeElement--focus{border-color:var(--blue);background:var(--white)}
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
#install-banner{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--ink);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:200;max-width:400px;width:calc(100% - 32px);box-shadow:0 4px 30px rgba(0,0,0,.25);border:1px solid var(--border);animation:fadeUp .3s ease}
</style>

<body>
<div id="app"><div id="volt-splash" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%)"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:76px;color:#fff;letter-spacing:-2px;line-height:1">VOLT.</div><div style="font-size:14px;font-weight:500;color:rgba(255,255,255,.38);margin-top:12px">Chargement…</div></div></div>

<script>
const CFG = {
  API: 'https://volt-backend-final.vercel.app',
  STRIPE_KEY: 'pk_live_51TYCHoClAT61ADIRmCN6fiHdNNAzqWW3Se7zCOVUQzRrMllm8VQdGPwnOfpNE9rTKqCpFQbCPBhj1TJgTIkIoyDR000T77uHse',
  CD_SECS: 900,
};
const PLANS = [
  { id:'month',   label:'MENSUEL',      chf:'9.90',  per:'/mois',    saving:null,             badge:null,             feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Sans engagement'] },
  { id:'quarter', label:'TRIMESTRIEL',  chf:'24.90', per:'/3 mois',  saving:'Éco. CHF 4.80',  badge:'⭐ POPULAIRE',    feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Renouvellement auto.'] },
  { id:'year',    label:'ANNUEL',       chf:'89.90', per:'/an',      saving:'Éco. CHF 28.90', badge:'🏆 MEILLEUR PRIX', feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Tarif le plus bas'] },
];
window.getExpiryText = function(u) {
  if (!u || !u.subscribed) return 'NON ABONNÉ';
  let d;
  if (u.sub_expires_at) { d = new Date(u.sub_expires_at); }
  else {
    d = u.created_at ? new Date(u.created_at) : new Date();
    const plan = PLANS.find(p => p.id === u.plan);
    if (plan) {
      if (plan.id === 'month') d.setMonth(d.getMonth() + 1);
      else if (plan.id === 'quarter') d.setMonth(d.getMonth() + 3);
      else if (plan.id === 'year') d.setFullYear(d.getFullYear() + 1);
    }
  }
  return d.toLocaleDateString('fr-CH');
};
const PARAMS = new URLSearchParams(location.search);
const DEMO = false; // Mode démo désactivé en production
if (PARAMS.get('ref')) localStorage.setItem('volt_ref', PARAMS.get('ref'));
let S = { screen:'login', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true };
const DEMO_USER = { id:'demo-00000001', name:'Alex Martin', email:'demo@volt.energy.ch', phone:'+41 79 000 00 00', initials:'AM', plan:'quarter', subscribed:true, authorized:true, gym:'Fitness partenaire', referral_code:'VOLTAM01', referral_count:3, free_months:3 };
function loadSess() { try { const d = JSON.parse(localStorage.getItem('volt_s') || 'null'); if (d && d.user) { S.user = d.user; S.token = d.token; S.cdEnd = d.cdEnd || 0; S.history = d.history || []; S.screen = 'home'; } } catch(e) {} }
function saveSess() { localStorage.setItem('volt_s', JSON.stringify({ user:S.user, token:S.token, cdEnd:S.cdEnd, history:S.history })); }
function doLogout() { localStorage.removeItem('volt_s'); qrCache = { dataUrl: null, expiry: 0 }; if (qrRotateTimer) { clearTimeout(qrRotateTimer); qrRotateTimer = null; } S = { screen:'login', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true }; render(); }
window.navPay = function() { nav("pay"); };
window.togglePwd = function(id, btn) { var el = document.getElementById(id); if (!el) return; var show = el.type === 'password'; el.type = show ? 'text' : 'password'; btn.innerHTML = show ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; };
window.toggleQrView = function() { var o = document.getElementById('cd-overlay'); if (!o || o._h) return; o._h = true; o.style.opacity = '0'; o.style.pointerEvents = 'none'; setTimeout(function() { o.style.opacity = '1'; o.style.pointerEvents = ''; o._h = false; }, 4000); };
window.goToLogin = function() { localStorage.removeItem("volt_s"); S = { screen:"login", user:null, token:null, plan:"quarter", cdEnd:0, history:[], tab:"conn", cgv:false, payMethod:"card", notifs:true }; window.history.replaceState({}, document.title, window.location.pathname); render(); };
window.toggleNotifs = function() { S.notifs = !S.notifs; saveSess(); const lbl = document.getElementById('notif-toggle-label'); if (lbl) { lbl.textContent = S.notifs ? 'Actives' : 'Désactivées'; lbl.style.color = S.notifs ? 'var(--blue)' : 'var(--ink3)'; } toast(S.notifs ? 'Notifications activées 🔔' : 'Notifications désactivées 🕕'); };
window.showInvoices = async function() {
  openModal('Mes factures', '<div id="inv-list" style="display:flex;flex-direction:column;gap:10px"><div style="text-align:center;padding:20px"><div class="spin" style="border-color:rgba(0,87,255,.3);border-top-color:var(--blue);margin:0 auto"></div></div></div><button class="btn btn-ghost" style="margin-top:12px" onclick="closeModal()">Fermer</button>');
  const res = await api('/api/user-update?action=invoices', null, 'GET');
  const el = document.getElementById('inv-list'); if (!el) return;
  if (res.error || !res.invoices) { el.innerHTML = '<div style="text-align:center;color:var(--ink3);font-size:14px;padding:20px">Impossible de charger les factures.</div>'; return; }
  if (res.invoices.length === 0) { el.innerHTML = '<div style="text-align:center;padding:24px"><div style="font-size:36px;margin-bottom:10px">🧧</div><div style="font-size:14px;font-weight:600;color:var(--ink)">Aucune facture pour l\'instant</div></div>'; return; }
  el.innerHTML = res.invoices.map(inv => '<div style="background:var(--bg2);border-radius:14px;padding:14px 16px;border:1px solid var(--border2)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-size:15px;font-weight:700;color:var(--ink)">CHF ' + inv.amount + '</div><div style="background:rgba(0,196,122,.12);border-radius:50px;padding:3px 10px;font-size:11px;font-weight:700;color:#00C47A">✓ PAYÉ</div></div><div style="font-size:12px;color:var(--ink3);margin-bottom:10px">' + inv.date + ' · ' + (inv.number || inv.id) + '</div><div style="display:flex;gap:8px">' + (inv.hosted_url ? '<a href="' + inv.hosted_url + '" target="_blank" style="flex:1;background:var(--blue);color:#fff;text-align:center;padding:8px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none">Voir →</a>' : '') + '<button onclick="sendOneInvoice(\'' + inv.id + '\')" style="flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:8px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer">Email 📧</button></div></div>').join('');
};
window.sendOneInvoice = async function(invoiceId) { toast('Envoi en cours...'); const res = await api('/api/user-update?action=invoices', { invoice_id: invoiceId }, 'POST'); if (res.error) { toast(res.error, false); return; } toast('Facture envoyée à ' + S.user.email + ' 📧'); };
window.confirmDeleteAccount = function() { openModal('Supprimer mon compte', '<div style="display:flex;flex-direction:column;gap:14px"><div style="text-align:center;font-size:40px;margin-bottom:4px">⚠️</div><div style="font-size:15px;font-weight:600;color:var(--ink);text-align:center;line-height:1.6">Cette action est <strong>irréversible</strong>.<br/>Ton compte, tes données et ton abonnement seront définitivement supprimés.</div><div style="background:#FFF0F2;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;color:var(--red);text-align:center">⚠ Tu perdras immédiatement accès à VOLT.</div><button class="btn" style="background:var(--red);color:#fff;font-family:\'Barlow Condensed\',sans-serif;font-size:19px;font-weight:900" onclick="doDeleteAccount()">OUI, SUPPRIMER MON COMPTE</button><button class="btn btn-ghost" onclick="closeModal()">Annuler</button></div>'); };
window.doDeleteAccount = async function() { closeModal(); const res = await api('/api/user-update', {}, 'DELETE'); if (res && res.error) { toast(res.error, false); return; } toast('Compte supprimé. À bientôt 👋'); setTimeout(() => { localStorage.removeItem('volt_s'); S = { screen:'login', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true }; render(); }, 1500); };
async function api(path, body, method, _retry) { if (DEMO) return demoApi(path, body); try { const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000); const r = await fetch(CFG.API + path, { signal: ctrl.signal, method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type':'application/json', 'Authorization': S.token ? 'Bearer '+S.token : '' }, body: body ? JSON.stringify(body) : undefined }); clearTimeout(t); const isAuthRoute = path.indexOf('/api/login') === 0 || path.indexOf('/api/register') === 0; if (r.status === 401 && S.token && !isAuthRoute) { doLogout(); return { error: 'Session expirée.' }; } return r.json(); } catch(e) { if (!_retry) { await new Promise(r => setTimeout(r, 1500)); return api(path, body, method, true); } return { error:'Connexion impossible.' }; } }
function demoApi(path, body) { if (path === '/api/login') { if ((body.email||'').toLowerCase() === 'demo@volt.energy.ch') return { user: DEMO_USER, token: 'demo-tok' }; return { error: 'Email ou mot de passe incorrect.' }; } if (path === '/api/register') return { user: Object.assign({}, DEMO_USER, { name:(body.firstName+' '+body.lastName).trim(), email:body.email, subscribed:false }), token:'demo-tok2' }; if (path === '/api/pay-intent') return { ok:true, demo:true }; if (path === '/api/qr-token') return { token:'demo-'+Date.now(), expires_at:new Date(Date.now()+120000).toISOString(), ttl:120, cooldown_remaining:0 }; if (path === '/api/user-update?action=history') return { history:[] }; return { ok:true }; }
function cdLeft() { return Math.max(0, Math.ceil(S.cdEnd - Date.now()/1000)); }
function fmtCd(s) { return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; }
function fmtAvailAt() { try { const d = new Date(S.cdEnd*1000); const f = new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Zurich',hour:'2-digit',minute:'2-digit',hour12:false}); return f.format(d).replace(':','h'); } catch(e) { const d = new Date(S.cdEnd*1000); return d.getHours().toString().padStart(2,'0')+'h'+d.getMinutes().toString().padStart(2,'0'); } }
function toast(msg, good) { const el = document.getElementById('toast'); el.textContent = msg; el.style.background = good===false ? '#FF3B5C' : '#050A14'; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2600); }
function notif(icon, text) { document.getElementById('notif-icon').textContent = icon; document.getElementById('notif-text').textContent = text; const el = document.getElementById('notif'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); }

function waitForStripeKey(attempts) { attempts = attempts || 0; if (attempts > 20) return; if (!CFG.STRIPE_KEY || CFG.STRIPE_KEY === '') { setTimeout(() => waitForStripeKey(attempts + 1), 200); return; } initStripe(); }
function initStripe() { if (!window.Stripe || !CFG.STRIPE_KEY) return; try { stripeInst = Stripe(CFG.STRIPE_KEY); const els = stripeInst.elements({ locale: 'fr' }); const style = { base: { fontSize: '16px', color: '#0A0F1E', fontFamily: '"Barlow", sans-serif', '::placeholder': { color: '#A8B4CC' } } }; stripeCard = els.create('card', { style, hidePostalCode: true }); stripeCard.mount('#stripe-el'); stripeCard.on('focus', () => { const el = document.getElementById('stripe-el'); if (el) { el.style.borderColor = 'var(--blue)'; el.style.background = 'var(--white)'; } }); stripeCard.on('blur', () => { const el = document.getElementById('stripe-el'); if (el) { el.style.borderColor = 'transparent'; el.style.background = 'var(--bg2)'; } }); } catch(e) { console.error('Stripe init error:', e); } }
async function doPay() { const btn = document.getElementById('btn-pay'); if (!btn) return; btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; const plan = PLANS.find(p=>p.id===S.plan); if (DEMO) { S.user.subscribed = true; S.user.plan = S.plan; saveSess(); toast('✅ Abonnement activé !'); notif('✅','Abonnement activé ! Ton QR est prêt.'); S.screen = 'home'; render(); return; } const res = await api('/api/pay-intent', { plan_id: plan.id }); if (res.error) { showPayErr(res.error); btn.innerHTML = 'PAYER CHF '+plan.chf+' →'; btn.disabled = false; return; } try { const { setupIntent, error } = await stripeInst.confirmCardSetup(res.client_secret, { payment_method: { card: stripeCard, billing_details: { email: S.user.email, name: S.user.name } } }); if (error) { showPayErr(error.message); btn.innerHTML = 'PAYER CHF '+plan.chf+' →'; btn.disabled = false; return; } const confirm = await api('/api/pay-confirm', { setup_intent_id: setupIntent.id, payment_method_id: setupIntent.payment_method, plan_id: S.plan, customer_id: res.customer_id, price_id: res.price_id }); if (confirm.error) { showPayErr(confirm.error); btn.innerHTML = 'PAYER CHF '+plan.chf+' →'; btn.disabled = false; return; } S.user.subscribed = true; S.user.plan = S.plan; saveSess(); toast('✅ Abonnement activé ! Renouvellement automatique.'); notif('✅','Abonnement activé ! Ton QR est prêt.'); S.screen = 'home'; render(); } catch(e) { console.error('doPay error:', e); showPayErr('Erreur: ' + (e.message || JSON.stringify(e))); btn.innerHTML = 'PAYER CHF '+plan.chf+' →'; btn.disabled = false; } }
function showPayErr(msg) { const el = document.getElementById('pay-err'); if (el) { el.textContent = msg; el.style.display = 'block'; } }
async function doTwint() { const btn = document.getElementById('btn-twint'); if (btn) { btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; } const plan = PLANS.find(p=>p.id===S.plan); const returnUrl = window.location.origin + window.location.pathname + '?payment=twint_success'; const res = await api('/api/pay-intent', { plan_id: plan.id, method: 'twint', return_url: returnUrl }); if (DEMO || res.demo) { S.user.subscribed = true; S.user.plan = S.plan; saveSess(); toast('✅ Abonnement activé (TWINT) !'); S.screen = 'home'; render(); return; } if (res.error) { toast(res.error, false); if (btn) { btn.innerHTML = 'PAYER AVEC TWINT →'; btn.disabled = false; } return; } if (res.client_secret) { try { if (!stripeInst) initStripe(); const result = await stripeInst.confirmTwintPayment(res.client_secret, { payment_method: { twint: {} }, return_url: returnUrl }); if (result.error) { toast(result.error.message || 'Erreur de paiement TWINT.', false); if (btn) { btn.innerHTML = 'PAYER AVEC TWINT →'; btn.disabled = false; } } } catch(e) { toast('Erreur TWINT: ' + e.message, false); if (btn) { btn.innerHTML = 'PAYER AVEC TWINT →'; btn.disabled = false; } } return; } if (res.redirect_url) { window.location.href = res.redirect_url; return; } if (btn) { btn.innerHTML = 'PAYER AVEC TWINT →'; btn.disabled = false; } toast('Erreur de paiement.', false); }

:18px;color:#fff;margin-top:2px">'+planLabel+'</div></div>'+(u.subscribed ? '<div style="background:rgba(0,196,122,.2);border-radius:50px;padding:5px 12px;font-size:11px;font-weight:700;color:#00C47A">● ACTIF</div>' : '<div style="background:rgba(255,59,92,.15);border-radius:50px;padding:5px 12px;font-size:11px;font-weight:700;color:#FF3B5C">⚠ INACTIF</div>')+'</div><div style="display:flex;justify-content:center;margin-bottom:16px"><div style="position:relative">'+(!u.subscribed ? '<div style="width:204px;height:204px;background:#1a2133;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed rgba(255,255,255,.15);margin:0 auto"><div style="font-size:48px;margin-bottom:8px">🔒</div><div style="font-size:14px;font-weight:700;color:rgba(255,255,255,.6);text-align:center">Abonnement<br>Requis</div></div>' : '<div class="qr-box'+(cd>0?' qr-cd':'')+'" id="qr-el"></div>'+(cd > 0 ? '<div class="qr-overlay" style="width:204px;height:204px" id="cd-overlay"><div class="bc" id="cd-time" style="font-weight:900;font-size:52px;color:#fff;letter-spacing:1px;text-shadow:0 2px 16px rgba(0,0,0,.6)">'+fmtCd(cd)+'</div><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.55);margin-top:2px;letter-spacing:.1em;text-transform:uppercase">PROCHAIN SCAN</div></div>' : ''))+'</div></div>'+(u.subscribed ? (cd === 0 ? '<div style="text-align:center;margin-bottom:12px"><span style="background:rgba(0,196,122,.15);border-radius:50px;padding:5px 16px;font-size:12px;font-weight:700;color:#00C47A">✓ PRÊT À SCANNER</span></div>' : '<div style="text-align:center;margin-bottom:12px"><span style="background:rgba(255,149,0,.15);border-radius:50px;padding:5px 16px;font-size:12px;font-weight:700;color:#FF9500">⏳ Dispo à '+fmtAvailAt()+'</span></div>') : '')+''+'<div style="display:flex;justify-content:space-between;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)"><div style="text-align:center"><div class="bc" style="font-weight:900;font-size:22px;color:#fff">∞</div><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase">RÉSEAU</div></div><div style="text-align:center"><div class="bc" style="font-weight:900;font-size:22px;color:#fff">15</div><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase">MIN COOLDOWN</div></div><div style="text-align:center"><div class="bc" id="scan-count" style="font-weight:900;font-size:22px;color:#fff">—</div><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase">CE MOIS</div></div></div></div></div>'+(cd===0?'<div style="padding:14px 16px 0"><div style="background:rgba(0,87,255,.06);border:1.5px solid rgba(0,87,255,.18);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px"><div style="font-size:22px;flex-shrink:0">📲</div><div><div class="bc" style="font-weight:800;font-size:18px;color:var(--ink)">PRÉSENTE TON CODE QR AU SCANNER</div><div style="font-size:12px;font-weight:500;color:var(--ink3);margin-top:2px">La machine lit ton Code QR automatiquement</div></div></div></div>':'')+expiryBanner+'<div style="padding:12px 16px 0"><div class="stat-grid"><div class="stat-box"><div class="stat-v" id="stat-today">—</div><div class="stat-l">Aujourd\'hui</div></div><div class="stat-box"><div class="stat-v" id="stat-month">—</div><div class="stat-l">Ce mois</div></div><div class="stat-box"><div class="stat-v">15\'</div><div class="stat-l">Cooldown</div></div></div></div><div style="padding:12px 16px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase">Dernières boissons</div><button onclick="nav(\'hist\')" style="background:none;border:none;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer">Voir tout →</button></div><div class="card" id="home-hist" style="padding:0 16px">'+(S.history.length === 0 ? '<div style="padding:24px 0;text-align:center;color:var(--ink3);font-size:14px;font-weight:500">Ton historique apparaîtra ici</div>' : S.history.slice(0,3).map((h,i,a) => '<div class="hist-row"'+(i===a.length-1?' style="border-bottom:none"':'')+'>  <div class="hist-ico">🥤</div><div><div style="font-size:15px;font-weight:600">1 boisson prise</div><div style="font-size:12px;font-weight:500;color:var(--ink3)">'+h.gym+'</div></div><div style="font-size:12px;font-weight:600;color:var(--ink3);margin-left:auto">'+h.time+'</div></div>').join(''))+'</div></div>'+(!u.subscribed ? '<div style="padding:14px 16px 0"><button class="btn btn-blue" onclick="navPay()">⚡ ACTIVER MON ABONNEMENT</button></div>' : '')+'</div>'; }
let qrRotateTimer = null;
let qrCache = { dataUrl: null, expiry: 0 };
function showQrImg(el, dataUrl) { let img = el.querySelector('img'); if (img) { img.src = dataUrl; } else { el.innerHTML = '<img src="' + dataUrl + '" style="width:180px;height:180px;display:block;border-radius:4px"/>'; } }
async function generateRotatingQR() { const el = document.getElementById('qr-el'); if (!el) return; if (typeof QRCode === 'undefined') { setTimeout(generateRotatingQR, 400); return; } const now = Date.now(); const hasQR = !!el.querySelector('img'); const reschedule = (ms) => { if (qrRotateTimer) clearTimeout(qrRotateTimer); qrRotateTimer = setTimeout(generateRotatingQR, ms); }; if (qrCache.dataUrl && now < qrCache.expiry) { if (!hasQR) showQrImg(el, qrCache.dataUrl); reschedule(Math.max(500, qrCache.expiry - now)); return; } if (!hasQR) { el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center"><div class="spin" style="border-color:rgba(0,87,255,.3);border-top-color:var(--blue)"></div></div>'; } const res = await api('/api/qr-token', null, 'GET'); if (res.error) { if (!hasQR) el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; reschedule(10_000); return; } const prevCd = cdLeft(); if (res.cooldown_remaining > 0) { S.cdEnd = Date.now()/1000 + res.cooldown_remaining; saveSess(); if (prevCd === 0) { render(); return; } startCdTick(); } if (!res.token) { if (!hasQR) el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; reschedule(10_000); return; } try { const tmp = document.createElement('div'); new QRCode(tmp, { text: 'volt://' + res.token, width: 180, height: 180, colorDark: '#050A14', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); const canvas = tmp.querySelector('canvas'); const dataUrl = canvas ? canvas.toDataURL() : null; if (dataUrl) { qrCache.dataUrl = dataUrl; qrCache.expiry = now + 9_500; showQrImg(el, dataUrl); } else { el.innerHTML = ''; while (tmp.firstChild) el.appendChild(tmp.firstChild); } } catch(e) { if (!hasQR) el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; } reschedule(10_000); }
function bindHome() { const u = S.user; if (u.subscribed) { generateRotatingQR(); } if (cdLeft() > 0) startCdTick(); api('/api/user-update?action=history', null, 'GET').then(r => { if (r.history) { S.history = r.history; saveSess(); const cnt = document.getElementById('scan-count'); const st = document.getElementById('stat-today'); const sm = document.getElementById('stat-month'); if (cnt) cnt.textContent = r.history.filter(h=>h.month).length; if (st) st.textContent = r.history.filter(h=>h.today).length; if (sm) sm.textContent = r.history.filter(h=>h.month).length; const hEl = document.getElementById('home-hist'); if (hEl) hEl.innerHTML = S.history.length === 0 ? '<div style="padding:24px 0;text-align:center;color:var(--ink3);font-size:14px;font-weight:500">Ton historique apparaîtra ici</div>' : S.history.slice(0,3).map((h,i,a) => '<div class="hist-row"'+(i===a.length-1?' style="border-bottom:none"':'')+'>  <div class="hist-ico">🥤</div><div><div style="font-size:15px;font-weight:600">1 boisson prise</div><div style="font-size:12px;font-weight:500;color:var(--ink3)">'+h.gym+'</div></div><div style="font-size:12px;font-weight:600;color:var(--ink3);margin-left:auto">'+h.time+'</div></div>').join(''); } else { ['scan-count','stat-today','stat-month'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent = '0'; }); } }); }
(function boot() { try { loadSess(); const qsPlan = PARAMS.get('plan'); if (['month','quarter','year'].includes(qsPlan)) S.plan = qsPlan; const qsTab = PARAMS.get('tab'); if ((qsTab === 'signup' || qsTab === 'inscr') && !S.user) S.tab = 'inscr'; if (DEMO && !S.user) { S.user = DEMO_USER; S.token = 'demo'; S.screen = 'home'; } const VERIFY_STATUS = PARAMS.get('verify'); if (VERIFY_STATUS === 'success') { localStorage.removeItem('volt_s'); S = { screen:'verify-success', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true }; window.history.replaceState({}, document.title, window.location.pathname); } else if (VERIFY_STATUS === 'expired') { window.history.replaceState({}, document.title, window.location.pathname); setTimeout(() => toast('Lien expiré. Reconnecte-toi pour renvoyer un email.', false), 400); } const PAYMENT_STATUS = PARAMS.get('payment'); if (PAYMENT_STATUS === 'twint_success') { const piId = PARAMS.get('payment_intent'); window.history.replaceState({}, document.title, window.location.pathname); setTimeout(async () => { if (S.token) { if (piId) { await api('/api/pay-confirm', { payment_intent_id: piId, method: 'twint' }); } const meRes = await api('/api/user-update?action=me', null, 'GET'); if (meRes.user) { S.user = Object.assign({}, S.user, meRes.user); saveSess(); render(); if (S.user.subscribed) { toast('✅ Abonnement activé ! Bienvenue chez VOLT.', true); } else { toast('Paiement en cours de traitement. Réessaie dans quelques instants.', true); } } } }, 500); } render(); } catch(e) { try { const app = document.getElementById('app'); if (app) { app.innerHTML = renderLogin(); bindLogin(); } } catch(e2) { const app = document.getElementById('app'); if (app) app.innerHTML = '<div style="height:100%;background:#060D2E;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:60px;color:#fff;letter-spacing:-2px">VOLT.</div><div style="color:rgba(255,255,255,.5);font-size:14px;margin-top:16px">Erreur de chargement.</div><button onclick="location.reload()" style="margin-top:24px;background:#0057FF;color:#fff;border:none;border-radius:50px;padding:14px 32px;font-size:16px;font-weight:700;cursor:pointer">Réessayer</button></div>'; } } })();
