*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
::selection{background:var(--blue);color:#fff}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:82px}
.screen-full{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bc{font-family:'Barlow Condensed',sans-serif}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--border2);display:flex;z-index:100;padding:8px 0 max(16px,env(safe-area-inset-bottom))}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px 0;transition:color .15s}
.bnav-btn .ni{font-size:22px;line-height:1}
.bnav-btn .nl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bnav-btn.on{color:var(--blue)}
.bnav-btn:not(.on){color:var(--ink3)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:var(--white)}
.inp::placeholder{color:var(--ink4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 18px var(--blue-glow)}
.btn-blue:not(:disabled):hover{background:var(--blue-mid);transform:translateY(-2px);box-shadow:0 8px 32px var(--blue-glow)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink2)}
.btn-ghost{background:var(--bg2);color:var(--ink)}
.btn-sm{padding:9px 18px;font-size:16px;width:auto;border-radius:50px}
.card{background:var(--white);border-radius:20px;border:1px solid var(--border2)}
.hdr{background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%);padding:16px 20px 0}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}
.logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#fff;letter-spacing:-.5px}
.qr-card{background:var(--ink);border-radius:24px;margin:14px 16px 0;padding:22px 18px;position:relative;overflow:hidden;animation:fadeIn .35s ease}
.qr-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 80% 0%,rgba(0,87,255,.85),rgba(0,60,220,.45) 50%,rgba(0,20,120,.2) 80%,transparent);pointer-events:none}
.qr-inner{position:relative;z-index:1}
.qr-box{background:var(--white);border-radius:16px;padding:12px;display:inline-block}
.qr-box.blur{filter:blur(6px);pointer-events:none}
.qr-overlay{position:absolute;inset:0;border-radius:16px;background:rgba(10,15,30,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .3s;cursor:pointer}
.cd-track{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:8px 0}
.cd-fill{height:100%;border-radius:2px;transition:width 1s linear,background .5s}
.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-k{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.row-item{background:var(--white);display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:4px;cursor:pointer;border:1px solid var(--border2);transition:background .12s}
.row-item:active{background:var(--bg2)}
.row-ico{width:36px;height:36px;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.row-lbl{font-size:15px;font-weight:600;flex:1;color:var(--ink)}
.row-r{font-size:13px;font-weight:600;color:var(--ink3)}
.row-chev{font-size:18px;color:var(--ink4)}
.row-danger .row-lbl{color:var(--red)}
.row-danger .row-ico{background:#FFF0F2}
.row-danger .row-chev{color:var(--red)}
.hist-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border2)}
.hist-row:last-child{border-bottom:none}
.hist-ico{width:44px;height:44px;background:var(--blue-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--white);border-radius:16px;padding:14px 10px;border:1px solid var(--border2);text-align:center}
.stat-v{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:var(--ink);line-height:1}
.stat-l{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.plan-card{border:1.5px solid var(--border2);border-radius:20px;padding:20px;cursor:pointer;transition:all .22s;position:relative;margin-bottom:10px;background:var(--white)}
.plan-card:hover{border-color:var(--blue);box-shadow:0 8px 28px var(--blue-glow);transform:translateY(-2px)}
.plan-card.sel{border:2px solid var(--blue);box-shadow:0 8px 28px var(--blue-glow),0 0 0 3px var(--blue-soft)}
.plan-card.feat{background:linear-gradient(145deg,var(--blue-dark),var(--blue));border-color:transparent;box-shadow:0 12px 32px var(--blue-glow)}
.plan-card.feat.sel{box-shadow:0 16px 44px rgba(0,87,255,.4),0 0 0 3px rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.6)!important}
.ref-card{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px;padding:22px;margin-bottom:14px}
.ref-link-box{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.52);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--white);border-radius:28px 28px 0 0;width:100%;max-width:430px;padding:26px 22px max(40px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-pill{width:36px;height:4px;background:#E0E0DF;border-radius:2px;margin:0 auto 22px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:20px;color:var(--ink)}
#notif{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:990;max-width:390px;width:calc(100% - 40px);box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#notif.show{transform:translateX(-50%) translateY(0)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--ink);color:#fff;border-radius:50px;padding:11px 20px;font-size:14px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#stripe-el{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;transition:border-color .2s}
#stripe-el.StripeElement--focus{border-color:var(--blue);background:var(--white)}
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
#install-banner{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--ink);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:200;max-width:400px;width:calc(100% - 32px);box-shadow:0 4px 30px rgba(0,0,0,.25);border:1px solid var(--border);animation:fadeUp .3s ease}
</style>
</head>
<body>
<div id="app"><div id="volt-splash" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%)"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:76px;color:#fff;letter-spacing:-2px;line-height:1">VOLT.</div><div style="font-size:14px;font-weight:500;color:rgba(255,255,255,.38);margin-top:12px">Chargement…</div></div></div>

<script>
const CFG = {
  API: 'https://volt-backend-final.vercel.app',
  STRIPE_KEY: 'pk_live_51TYCHoClAT61ADIRmCN6fiHdNNAzqWW3Se7zCOVUQzRrMllm8VQdGPwnOfpNE9rTKqCpFQbCPBhj1TJgTIkIoyDR000T77uHse',
  DEMO_CODE: 'volt-admin-2025',

const PLANS = [
  { id:'month',   label:'MENSUEL',      chf:'9.90',  per:'/mois',    saving:null,             badge:null,             feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Sans engagement'] },
  { id:'quarter', label:'TRIMESTRIEL',  chf:'24.90', per:'/3 mois',  saving:'Éco. CHF 4.80',  badge:'⭐ POPULAIRE',    feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Renouvellement auto.'] },
  { id:'year',    label:'ANNUEL',       chf:'89.90', per:'/an',      saving:'Éco. CHF 28.90', badge:'🏆 MEILLEUR PRIX', feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Tarif le plus bas'] },
];
window.getExpiryText = function(u) {
  if (!u || !u.subscribed) return 'NON ABONNÉ';
  let d;
  if (u.sub_expires_at) { d = new Date(u.sub_expires_at); }
  else {
    d = u.created_at ? new Date(u.created_at) : new Date();
    const plan = PLANS.find(p => p.id === u.plan);
    if (plan) {
      if (plan.id === 'month') d.setMonth(d.getMonth() + 1);
      else if (plan.id === 'quarter') d.setMonth(d.getMonth() + 3);
      else if (plan.id === 'year') d.setFullYear(d.getFullYear() + 1);
    }
  }
  return d.toLocaleDateString('fr-CH');
};
const PARAMS = new URLSearchParams(location.search);
const DEMO = PARAMS.get('access') === CFG.DEMO_CODE;
if (PARAMS.get('ref')) localStorage.setItem('volt_ref', PARAMS.get('ref'));
let S = { screen:'login', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true };
const DEMO_USER = { id:'demo-00000001', name:'Alex Martin', email:'demo@volt.energy.ch', phone:'+41 79 000 00 00', initials:'AM', plan:'quarter', subscribed:true, authorized:true, gym:'Fitness partenaire', referral_code:'VOLTAM01', referral_count:3, free_months:3 };
function loadSess() { try { const d = JSON.parse(localStorage.getItem('volt_s') || 'null'); if (d && d.user) { S.user = d.user; S.token = d.token; S.cdEnd = d.cdEnd || 0; S.screen = 'home'; } } catch(e) {} }
function saveSess() { localStorage.setItem('volt_s', JSON.stringify({ user:S.user, token:S.token, cdEnd:S.cdEnd })); }

window.navPay = function() { nav("pay"); };
window.toggleQrView = function() { var o = document.getElementById('cd-overlay'); if (!o || o._h) return; o._h = true; o.style.opacity = '0'; o.style.pointerEvents = 'none'; setTimeout(function() { o.style.opacity = '1'; o.style.pointerEvents = ''; o._h = false; }, 4000); };
window.goToLogin = function() { localStorage.removeItem("volt_s"); S = { screen:"login", user:null, token:null, plan:"quarter", cdEnd:0, history:[], tab:"conn", cgv:false, payMethod:"card", notifs:true }; window.history.replaceState({}, document.title, window.location.pathname); render(); };

window.shareRef = function() { const code = S.user && S.user.referral_code; if (!code) return; const url = 'https://volt.energy.ch/?ref=' + code; if (navigator.share) { navigator.share({ title: 'VOLT. – Boissons illimitées', text: 'Rejoins VOLT. avec mon code et profite d\'un mois offert !', url }); } else { navigator.clipboard.writeText(url).then(() => toast('Lien copié !')); } };
let qrRotateTimer = null;
const qrCache = { dataUrl: null, expiry: 0 };
function cdLeft() { return Math.max(0, Math.ceil(S.cdEnd - Date.now()/1000)); }
let cdTick = null;
function startCdTick() { if (cdTick) return; cdTick = setInterval(() => { const el = document.getElementById('cd-txt'); const bar = document.getElementById('cd-bar'); const left = cdLeft(); if (el) { if (left <= 0) { el.textContent = 'PRÊT'; if (bar) { bar.style.width = '100%'; bar.style.background = 'var(--green)'; } clearInterval(cdTick); cdTick = null; generateRotatingQR(); } else { const m = Math.floor(left/60), s = left%60; el.textContent = m + ':' + String(s).padStart(2,'0'); const pct = Math.max(0, 1 - left/CFG.CD_SECS); if (bar) { bar.style.width = (pct*100) + '%'; bar.style.background = left < 60 ? 'var(--green)' : left < 300 ? 'var(--orange)' : 'var(--blue)'; } } } else { clearInterval(cdTick); cdTick = null; } }, 1000); }
async function api(path, body, method) { const m = method || (body ? 'POST' : 'GET'); const opts = { method: m, headers: {} }; if (S.token && S.token !== 'demo') opts.headers['Authorization'] = 'Bearer ' + S.token; if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); } try { const r = await fetch(CFG.API + path, opts); const j = await r.json(); return j; } catch(e) { return { error: 'Réseau indisponible' }; } }
function toast(msg, success) { const t = document.getElementById('toast'); if (!t) return; t.textContent = msg; t.style.background = success === false ? 'var(--red)' : success === true ? 'var(--green)' : 'var(--ink)'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2400); }
function showNotif(icon, text) { const n = document.getElementById('notif'); const ni = document.getElementById('notif-icon'); const nt = document.getElementById('notif-text'); if (!n) return; ni.textContent = icon; nt.textContent = text; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), 4000); }
function nav(screen) { S.screen = screen; render(); }
function render() {

  if (S.screen === 'more') { app.innerHTML = renderMore(); bindMore(); return; }
}

}

}

function bindLogin() {

function daysUntilExpiry(u) {
  if (!u || !u.subscribed) return null;
  let d;
  if (u.sub_expires_at) { d = new Date(u.sub_expires_at); }
  else {
    d = u.created_at ? new Date(u.created_at) : new Date();
    const plan = PLANS.find(p => p.id === u.plan);
    if (plan) {
      if (plan.id === 'month') d.setMonth(d.getMonth() + 1);
      else if (plan.id === 'quarter') d.setMonth(d.getMonth() + 3);
      else if (plan.id === 'year') d.setFullYear(d.getFullYear() + 1);
    }
  }
  const diff = d - new Date();
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}
function renderExpiryBanner(u) {
  const days = daysUntilExpiry(u);
  if (days === null || days > 7) return '';
  const urgent = days <= 2;
  const color = urgent ? 'var(--red)' : 'var(--orange)';
  const bg = urgent ? 'rgba(255,59,92,.10)' : 'rgba(255,149,0,.10)';
  const icon = urgent ? '🚨' : '⏰';
  const msg = days <= 0
    ? 'Ton abonnement a expiré. Renouvelle-le pour continuer.'
    : days === 1
      ? 'Ton abonnement expire demain ! Renouvelle maintenant.'
      : `Ton abonnement expire dans ${days} jours.`;
  return `<div style="margin:12px 16px 0;padding:12px 14px;background:${bg};border:1.5px solid ${color};border-radius:14px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="nav('pay')">
    <span style="font-size:20px;flex-shrink:0">${icon}</span>
    <span style="flex:1;font-size:13px;font-weight:600;color:${color};line-height:1.4">${msg}</span>
    <span style="font-size:13px;font-weight:700;color:${color};white-space:nowrap">Renouveler →</span>
  </div>`;
}

ow-item" onclick="window.open(\'https://volt.energy.ch/faq\',\'_blank\')"><div class="row-ico">❓</div><span class="row-lbl">FAQ & Aide</span><span class="row-chev">›</span></div><div class="row-item" onclick="window.open(\'https://volt.energy.ch/partenaires\',\'_blank\')"><div class="row-ico">📍</div><span class="row-lbl">Trouver un partenaire</span><span class="row-chev">›</span></div><div class="row-item" onclick="window.open(\'https://volt.energy.ch/cgv\',\'_blank\')"><div class="row-ico">📄</div><span class="row-lbl">Conditions Générales</span><span class="row-chev">›</span></div><div class="row-item" onclick="window.open(\'https://volt.energy.ch/privacy\',\'_blank\')"><div class="row-ico">🔒</div><span class="row-lbl">Politique de confidentialité</span><span class="row-chev">›</span></div><div class="row-item" onclick="window.open(\'mailto:support@volt.energy.ch\',\'_blank\')"><div class="row-ico">✉️</div><span class="row-lbl">Contacter le support</span><span class="row-chev">›</span></div></div></div>' + bnav('more');
}

function renderPay() {
  const u = S.user || {};
  const plans = PLANS;
  let plansHtml = plans.map(p => {
    const isFeat = p.id === 'year';
    const isSel = S.plan === p.id;
    let cls = 'plan-card' + (isFeat?' feat':'') + (isSel?' sel':'');
    const textColor = isFeat ? '#fff' : 'var(--ink)';
    const subColor = isFeat ? 'rgba(255,255,255,.7)' : 'var(--ink3)';
    const badgeHtml = p.badge ? `<div style="position:absolute;top:-1px;right:14px;background:${isFeat?'rgba(255,255,255,.22)':'var(--blue)'};color:#fff;font-size:10px;font-weight:800;padding:4px 10px;border-radius:0 0 10px 10px;letter-spacing:.04em">${p.badge}</div>` : '';
    const savingHtml = p.saving ? `<span style="font-size:12px;font-weight:700;color:${isFeat?'rgba(255,255,255,.7)':'var(--green)'};background:${isFeat?'rgba(255,255,255,.15)':'rgba(0,196,122,.12)'};padding:3px 8px;border-radius:20px">${p.saving}</span>` : '';
    const featHtml = p.feat.map(f=>`<div style="display:flex;align-items:center;gap:6px;font-size:13px;color:${subColor};margin-bottom:3px"><span style="color:${isFeat?'rgba(255,255,255,.6)':'var(--blue)'};font-size:11px">✓</span>${f}</div>`).join('');
    return `<div class="${cls}" onclick="selPlan('${p.id}')">${badgeHtml}<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><div><div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:${textColor};letter-spacing:.02em">${p.label}</div>${savingHtml}</div><div style="text-align:right"><div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;color:${textColor};line-height:1">CHF ${p.chf}</div><div style="font-size:12px;color:${subColor}">${p.per}</div></div></div><div>${featHtml}</div></div>`;
  }).join('');
  const hasStripe = typeof Stripe !== 'undefined';
  let payMethodHtml = '';
  if (hasStripe) {
    payMethodHtml = `<div style="display:flex;gap:8px;margin-bottom:14px"><button id="pm-card" onclick="switchPayMethod('card')" class="btn btn-sm" style="flex:1;font-size:14px;background:var(--blue);color:#fff">💳 Carte</button><button id="pm-twint" onclick="switchPayMethod('twint')" class="btn btn-sm" style="flex:1;font-size:14px;background:var(--bg2);color:var(--ink)">TWINT</button></div><div id="card-section"><div style="margin-bottom:10px"><label class="lbl">Carte de crédit / débit</label><div id="stripe-el"></div></div></div><div id="twint-section" style="display:none"><div style="background:var(--bg2);border-radius:12px;padding:16px;text-align:center;margin-bottom:10px"><div style="font-size:32px;margin-bottom:8px">📱</div><div style="font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px">Paiement TWINT</div><div style="font-size:13px;color:var(--ink3);line-height:1.5">Tu seras redirigé vers TWINT pour confirmer le paiement.</div></div></div>`;
  }
  const alreadySub = u.subscribed;
  return '<div class="screen"><div class="hdr" style="padding-bottom:16px"><div class="hdr-row"><div class="logo-txt">' + (alreadySub?'Renouveler':'Abonnement') + '</div></div></div><div style="padding:16px">' + (alreadySub?'<div style="background:var(--blue-soft);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px;font-weight:600;color:var(--blue)">✅ Abonnement actif jusqu\'au ' + getExpiryText(u) + '. Tu peux le renouveler ici.</div>':'') + plansHtml + (hasStripe?'<div style="margin-bottom:16px"><div class="lbl" style="margin-bottom:10px">Moyen de paiement</div>' + payMethodHtml + '</div>':'<div style="background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:16px;font-size:13px;color:var(--ink3);text-align:center">Chargement du module de paiement…</div>') + '<button id="pay-btn" class="btn btn-blue">PAYER CHF ' + (PLANS.find(p=>p.id===S.plan)||PLANS[0]).chf + '</button><div style="text-align:center;margin-top:12px;font-size:11px;color:var(--ink4)">🔒 Paiement sécurisé · Powered by Stripe</div></div></div>' + bnav('pay');
}
window.selPlan = function(id) {
  S.plan = id;
  const payBtn = document.getElementById('pay-btn');
  if (payBtn) { const p = PLANS.find(x=>x.id===id)||PLANS[0]; payBtn.textContent = 'PAYER CHF ' + p.chf; }
  document.querySelectorAll('.plan-card').forEach((el,i) => {
    const p = PLANS[i];
    const isFeat = p && p.id === 'year';
    el.classList.toggle('sel', p && p.id === id);
    if (isFeat) el.style.border = (p.id === id) ? '2px solid rgba(255,255,255,.6)' : '';
    else el.style.borderColor = (p && p.id === id) ? 'var(--blue)' : '';
  });
};
window.switchPayMethod = function(method) {
  S.payMethod = method;
  const cardSection = document.getElementById('card-section');
  const twintSection = document.getElementById('twint-section');
  const pmCard = document.getElementById('pm-card');
  const pmTwint = document.getElementById('pm-twint');
  if (!cardSection) return;
  if (method === 'card') {
    cardSection.style.display = ''; twintSection.style.display = 'none';
    if (pmCard) { pmCard.style.background = 'var(--blue)'; pmCard.style.color = '#fff'; }
    if (pmTwint) { pmTwint.style.background = 'var(--bg2)'; pmTwint.style.color = 'var(--ink)'; }
  } else {
    cardSection.style.display = 'none'; twintSection.style.display = '';
    if (pmTwint) { pmTwint.style.background = 'var(--blue)'; pmTwint.style.color = '#fff'; }
    if (pmCard) { pmCard.style.background = 'var(--bg2)'; pmCard.style.color = 'var(--ink)'; }
  }
};
let stripeInstance = null, stripeElements = null, cardElement = null;
function bindPay() {
  if (typeof Stripe !== 'undefined' && !stripeInstance) {
    stripeInstance = Stripe(CFG.STRIPE_KEY);
    stripeElements = stripeInstance.elements();
    cardElement = stripeElements.create('card', { style: { base: { fontFamily: '\'Barlow\', sans-serif', fontSize: '16px', color: '#060D2E', '::placeholder': { color: '#A8B4CC' } } } });
    const stripeEl = document.getElementById('stripe-el');
    if (stripeEl) cardElement.mount('#stripe-el');
  } else if (stripeInstance && cardElement) {
    const stripeEl = document.getElementById('stripe-el');
    if (stripeEl) { try { cardElement.mount('#stripe-el'); } catch(e) {} }
  }
  const payBtn = document.getElementById('pay-btn');
  if (payBtn) payBtn.onclick = async function() {
    if (typeof Stripe === 'undefined') { toast('Module de paiement non chargé. Recharge la page.', false); return; }
    if (S.payMethod === 'twint') {
      payBtn.disabled = true; payBtn.innerHTML = '<div class="spin"></div>';
      const res = await api('/api/pay-twint', { plan: S.plan });
      payBtn.disabled = false; payBtn.textContent = 'PAYER CHF ' + (PLANS.find(p=>p.id===S.plan)||PLANS[0]).chf;
      if (res.error) { toast(res.error, false); return; }
      if (res.redirect_url) { window.location.href = res.redirect_url; }
      return;
    }
    if (!cardElement) { toast('Carte non initialisée. Recharge la page.', false); return; }
    payBtn.disabled = true; payBtn.innerHTML = '<div class="spin"></div>';
    const res = await api('/api/pay', { plan: S.plan });
    if (res.error) { toast(res.error, false); payBtn.disabled = false; payBtn.textContent = 'PAYER CHF ' + (PLANS.find(p=>p.id===S.plan)||PLANS[0]).chf; return; }
    const { error: stripeError, paymentIntent } = await stripeInstance.confirmCardPayment(res.client_secret, { payment_method: { card: cardElement } });
    if (stripeError) { toast(stripeError.message, false); payBtn.disabled = false; payBtn.textContent = 'PAYER CHF ' + (PLANS.find(p=>p.id===S.plan)||PLANS[0]).chf; return; }
    if (paymentIntent.status === 'succeeded') {
      const confirm = await api('/api/pay-confirm', { payment_intent_id: paymentIntent.id, method: 'card' });
      if (confirm.error) { toast(confirm.error, false); payBtn.disabled = false; payBtn.textContent = 'PAYER CHF ' + (PLANS.find(p=>p.id===S.plan)||PLANS[0]).chf; return; }
      const meRes = await api('/api/user-update?action=me', null, 'GET');
      if (meRes.user) { S.user = Object.assign({}, S.user, meRes.user); saveSess(); }
      toast('✅ Abonnement activé ! Bienvenue chez VOLT.', true);
      nav('home');
    }
  };
}
function bindHome() { const u = S.user; if (u.subscribed) { generateRotatingQR(); } if (cdLeft() > 0) startCdTick(); api('/api/user-update?action=history', null, 'GET').then(r => { if (r.history) { S.history = r.history; const cnt = document.getElementById('scan-count'); const st = document.getElementById('stat-today'); const sm = document.getElementById('stat-month'); if (cnt) cnt.textContent = r.history.length; if (st) st.textContent = r.history.filter(h=>h.today).length; if (sm) sm.textContent = r.history.length; } else { ['scan-count','stat-today','stat-month'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent = '0'; }); } }); }
async function generateRotatingQR() { const el = document.getElementById('qr-el'); if (!el) return; if (typeof QRCode === 'undefined') { setTimeout(generateRotatingQR, 400); return; } const now = Date.now(); if (qrCache.dataUrl && now < qrCache.expiry) { el.innerHTML = '<img src="' + qrCache.dataUrl + '" style="width:180px;height:180px;display:block;border-radius:4px"/>'; return; } el.style.opacity = '0'; el.style.transition = 'opacity 0.25s'; el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center"><div class="spin" style="border-color:rgba(0,87,255,.3);border-top-color:var(--blue)"></div></div>'; requestAnimationFrame(() => { el.style.opacity = '1'; }); const res = await api('/api/qr-token', null, 'GET'); if (res.error || !res.token) { el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; return; } const prevCd = cdLeft(); if (res.cooldown_remaining > 0) { S.cdEnd = Date.now()/1000 + res.cooldown_remaining; saveSess(); if (prevCd === 0) { render(); return; } startCdTick(); } el.style.opacity = '0'; el.innerHTML = ''; try { new QRCode(el, { text: 'volt://' + res.token, width: 180, height: 180, colorDark: '#050A14', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); const canvas = el.querySelector('canvas'); if (canvas) { qrCache.dataUrl = canvas.toDataURL(); qrCache.expiry = now + 110_000; } } catch(e) { el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; } requestAnimationFrame(() => { el.style.transition = 'opacity 0.4s'; el.style.opacity = '1'; }); if (qrRotateTimer) clearTimeout(qrRotateTimer); qrRotateTimer = setTimeout(generateRotatingQR, 110_000); }
(function boot() { try { loadSess(); if (DEMO && !S.user) { S.user = DEMO_USER; S.token = 'demo'; S.screen = 'home'; } const VERIFY_STATUS = PARAMS.get('verify'); if (VERIFY_STATUS === 'success') { localStorage.removeItem('volt_s'); S = { screen:'verify-success', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true }; window.history.replaceState({}, document.title, window.location.pathname); } else if (VERIFY_STATUS === 'expired') { window.history.replaceState({}, document.title, window.location.pathname); setTimeout(() => toast('Lien expiré. Reconnecte-toi pour renvoyer un email.', false), 400); } const PAYMENT_STATUS = PARAMS.get('payment'); if (PAYMENT_STATUS === 'twint_success') { const piId = PARAMS.get('payment_intent'); window.history.replaceState({}, document.title, window.location.pathname); setTimeout(async () => { if (S.token) { if (piId) { await api('/api/pay-confirm', { payment_intent_id: piId, method: 'twint' }); } const meRes = await api('/api/user-update?action=me', null, 'GET'); if (meRes.user) { S.user = Object.assign({}, S.user, meRes.user); saveSess(); render(); if (S.user.subscribed) { toast('✅ Abonnement activé ! Bienvenue chez VOLT.', true); } else { toast('Paiement en cours de traitement. Réessaie dans quelques instants.', true); } } } }, 500); } render(); } catch(e) { try { const app = document.getElementById('app'); if (app) { app.innerHTML = renderLogin(); bindLogin(); } } catch(e2) { const app = document.getElementById('app'); if (app) app.innerHTML = '<div style="height:100%;background:#060D2E;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:60px;color:#fff;letter-spacing:-2px">VOLT.</div><div style="color:rgba(255,255,255,.5);font-size:14px;margin-top:16px">Erreur de chargement.</div><button onclick="location.reload()" style="margin-top:24px;background:#0057FF;color:#fff;border:none;border-radius:50px;padding:14px 32px;font-size:16px;font-weight:700;cursor:pointer">Réessayer</button></div>'; } } })();
