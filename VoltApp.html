<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VOLT.</title>
<meta name="theme-color" content="#060D2E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="VOLT."/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" type="image/png" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
::-webkit-scrollbar{display:none}
:root{
  --blue:#0057FF;
  --blue-mid:#2979FF;
  --blue-dark:#003FCC;
  --blue-soft:rgba(0,87,255,.07);
  --blue-soft2:rgba(0,87,255,.12);
  --blue-glow:rgba(0,87,255,.22);
  --ink:#060D2E;
  --ink2:#2D3652;
  --ink3:#6B7A99;
  --ink4:#A8B4CC;
  --bg:#F7F9FF;
  --bg2:#EDF1FB;
  --white:#FFFFFF;
  --border:rgba(0,87,255,.1);
  --border2:rgba(10,15,30,.07);
  --green:#00C47A;
  --red:#FF3B5C;
  --orange:#FF9500;
}
::selection{background:var(--blue);color:#fff}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:82px;overscroll-behavior-y:contain}
.screen-full{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.bc{font-family:'Barlow Condensed',sans-serif}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--border2);display:flex;z-index:100;padding:8px 0 max(16px,env(safe-area-inset-bottom))}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px 0;transition:color .15s}
.bnav-btn .ni{font-size:22px;line-height:1}
.bnav-btn .nl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bnav-btn.on{color:var(--blue)}
.bnav-btn:not(.on){color:var(--ink3)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:var(--white)}
.inp::placeholder{color:var(--ink4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 18px var(--blue-glow)}
.btn-blue:not(:disabled):hover{background:var(--blue-mid);transform:translateY(-2px);box-shadow:0 8px 32px var(--blue-glow)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink2)}
.btn-ghost{background:var(--bg2);color:var(--ink)}
.btn-sm{padding:9px 18px;font-size:16px;width:auto;border-radius:50px}
.card{background:var(--white);border-radius:20px;border:1px solid var(--border2)}
.hdr{background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%);padding:16px 20px 0}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}
.logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#fff;letter-spacing:-.5px}
.qr-card{background:var(--ink);border-radius:24px;margin:14px 16px 0;padding:22px 18px;position:relative;overflow:hidden;animation:fadeIn .35s ease}
.qr-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 80% 0%,rgba(0,87,255,.85),rgba(0,60,220,.45) 50%,rgba(0,20,120,.2) 80%,transparent);pointer-events:none}
.qr-inner{position:relative;z-index:1}
.qr-box{background:var(--white);border-radius:16px;padding:12px;display:inline-block}
.qr-box.blur{filter:blur(6px);pointer-events:none}
.qr-overlay{position:absolute;inset:0;border-radius:16px;background:rgba(6,13,46,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .3s}
.qr-cd{filter:grayscale(1) brightness(.35);transition:filter .3s}
.cd-track{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:8px 0}
.cd-fill{height:100%;border-radius:2px;transition:width 1s linear,background .5s}
.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-k{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.row-item{background:var(--white);display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:4px;cursor:pointer;border:1px solid var(--border2);transition:background .12s}
.row-item:active{background:var(--bg2)}
.row-ico{width:36px;height:36px;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.row-lbl{font-size:15px;font-weight:600;flex:1;color:var(--ink)}
.row-r{font-size:13px;font-weight:600;color:var(--ink3)}
.row-chev{font-size:18px;color:var(--ink4)}
.row-danger .row-lbl{color:var(--red)}
.row-danger .row-ico{background:#FFF0F2}
.row-danger .row-chev{color:var(--red)}
.hist-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border2)}
.hist-row:last-child{border-bottom:none}
.hist-ico{width:44px;height:44px;background:var(--blue-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--white);border-radius:16px;padding:14px 10px;border:1px solid var(--border2);text-align:center}
.stat-v{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:var(--ink);line-height:1}
.stat-l{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.plan-card{border:1.5px solid var(--border2);border-radius:20px;padding:20px;cursor:pointer;transition:all .22s;position:relative;margin-bottom:10px;background:var(--white)}
.plan-card:hover{border-color:var(--blue);box-shadow:0 8px 28px var(--blue-glow);transform:translateY(-2px)}
.plan-card.sel{border:2px solid var(--blue);box-shadow:0 8px 28px var(--blue-glow),0 0 0 3px var(--blue-soft)}
.plan-card.feat{background:linear-gradient(145deg,var(--blue-dark),var(--blue));border-color:transparent;box-shadow:0 12px 32px var(--blue-glow)}
.plan-card.feat.sel{box-shadow:0 16px 44px rgba(0,87,255,.4),0 0 0 3px rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.6)!important}
.ref-card{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px;padding:22px;margin-bottom:14px}
.ref-link-box{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.52);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--white);border-radius:28px 28px 0 0;width:100%;max-width:430px;padding:26px 22px max(40px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-pill{width:36px;height:4px;background:#E0E0DF;border-radius:2px;margin:0 auto 22px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:20px;color:var(--ink)}
#notif{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:990;max-width:390px;width:calc(100% - 40px);box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#notif.show{transform:translateX(-50%) translateY(0)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--ink);color:#fff;border-radius:50px;padding:11px 20px;font-size:14px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#stripe-el{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;transition:border-color .2s}
#stripe-el.StripeElement--focus{border-color:var(--blue);background:var(--white)}
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
#install-banner{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--ink);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:200;max-width:400px;width:calc(100% - 32px);box-shadow:0 4px 30px rgba(0,0,0,.25);border:1px solid var(--border);animation:fadeUp .3s ease}
</style>
</head>
<body>
<div id="app"><div id="volt-splash" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%)"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:76px;color:#fff;letter-spacing:-2px;line-height:1">VOLT.</div><div style="font-size:14px;font-weight:500;color:rgba(255,255,255,.38);margin-top:12px">Chargement…</div></div></div>
<div id="toast"></div>
<div id="notif">
  <span id="notif-icon" style="font-size:20px;flex-shrink:0"></span>
  <span id="notif-text" style="font-size:13px;font-weight:700;flex:1"></span>
  <button onclick="document.getElementById('notif').classList.remove('show')" style="background:none;border:none;color:rgba(255,255,255,.35);font-size:18px;cursor:pointer">✕</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
<script src="https://js.stripe.com/v3/" async></script>
<script>
const CFG = {
  API: 'https://volt-backend-final.vercel.app',
  STRIPE_KEY: 'pk_live_51TYCHoClAT61ADIRmCN6fiHdNNAzqWW3Se7zCOVUQzRrMllm8VQdGPwnOfpNE9rTKqCpFQbCPBhj1TJgTIkIoyDR000T77uHse',
  CD_SECS: 900,
};
const PLANS = [
  { id:'month',   label:'MENSUEL',      chf:'9.90',  per:'/mois',    saving:null,             badge:null,             feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Sans engagement'] },
  { id:'year',    label:'ANNUEL',       chf:'79.00', per:'/an',      saving:'Save 33%',       badge:'⚡ BEST VALUE',   feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','2 mois offerts'] },
  { id:'student', label:'ÉTUDIANT',     chf:'5.90',  per:'/mois',    saving:'Save 40%',       badge:'🎓 ÉTUDIANT',     feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Vérification .edu'] },
];
let APP = {
  screen:'home',
  user:null,
  session:null,
  station:null,
  stations:[],
  history:[],
  notifOn:true,
  plan:null,
  stripe:null,
  stripeEl:null,
  deferredInstall:null,
  selectedPlan:'month',
};
const DB = {
  save(k,v){try{localStorage.setItem('volt_'+k,JSON.stringify(v))}catch(e){}},
  load(k,d=null){try{const v=localStorage.getItem('volt_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  remove(k){try{localStorage.removeItem('volt_'+k)}catch(e){}}
};
function toast(msg,dur=2800){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
function showNotif(icon,msg,dur=4000){
  const el=document.getElementById('notif');
  document.getElementById('notif-icon').textContent=icon;
  document.getElementById('notif-text').textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
function api(path,opts={}){
  const h={'Content-Type':'application/json'};
  if(APP.session?.token)h['Authorization']='Bearer '+APP.session.token;
  return fetch(CFG.API+path,{...opts,headers:{...h,...(opts.headers||{})}}).then(r=>r.json());
}
function nav(screen){
  APP.screen=screen;
  render();
}
function render(){
  const el=document.getElementById('app');
  switch(APP.screen){
    case 'home':    el.innerHTML=renderHome();    break;
    case 'scan':    el.innerHTML=renderScan();    break;
    case 'history': el.innerHTML=renderHistory(); break;
    case 'profile': el.innerHTML=renderProfile(); break;
    case 'plans':   el.innerHTML=renderPlans();   break;
    case 'auth':    el.innerHTML=renderAuth();    break;
    default:        el.innerHTML=renderHome();
  }
  attachHandlers();
}
function bnav(active){
  return `<nav class="bnav">
    <button class="bnav-btn ${active==='home'?'on':''}" onclick="nav('home')"><span class="ni">⚡</span><span class="nl">Accueil</span></button>
    <button class="bnav-btn ${active==='scan'?'on':''}" onclick="nav('scan')"><span class="ni">📷</span><span class="nl">Scanner</span></button>
    <button class="bnav-btn ${active==='history'?'on':''}" onclick="nav('history')"><span class="ni">📋</span><span class="nl">Historique</span></button>
    <button class="bnav-btn ${active==='profile'?'on':''}" onclick="nav('profile')"><span class="ni">👤</span><span class="nl">Profil</span></button>
  </nav>`;
}
function renderHome(){
  const u=APP.user;
  const isActive=u?.subscription_status==='active';
  const cd=APP.countdown||0;
  const fill=isActive?Math.max(0,Math.min(100,((CFG.CD_SECS-cd)/CFG.CD_SECS)*100)):0;
  const fillColor=fill>50?'var(--green)':fill>20?'var(--orange)':'var(--red)';
  const nearbyCount=APP.stations.filter(s=>s.status==='online').length;
  return `
  <div class="hdr">
    <div class="hdr-row">
      <span class="logo-txt bc">VOLT.</span>
      <div style="display:flex;align-items:center;gap:10px">
        ${nearbyCount>0?`<span style="font-size:12px;font-weight:700;color:rgba(255,255,255,.55);background:rgba(255,255,255,.08);padding:4px 10px;border-radius:50px">${nearbyCount} station${nearbyCount>1?'s':''} proches</span>`:''}
        <button onclick="showInstallBanner()" style="background:rgba(255,255,255,.1);border:none;border-radius:50px;color:#fff;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer">+ Installer</button>
      </div>
    </div>
    <div class="qr-card">
      <div class="qr-inner">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
          <div>
            <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em">Statut</div>
            <div style="font-size:18px;font-weight:800;color:#fff;margin-top:2px">${isActive?'✅ Abonnement actif':'❌ Inactif'}</div>
          </div>
          ${isActive?`<div style="text-align:right"><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em">Plan</div><div style="font-size:15px;font-weight:800;color:#fff;margin-top:2px">${(u?.plan_id||'').toUpperCase()}</div></div>`:''}
        </div>
        ${isActive?`
        <div style="display:flex;gap:14px;align-items:flex-start">
          <div class="qr-box ${cd<=0?'blur':''}" id="qr-box">
            <div id="qr-render" style="width:140px;height:140px"></div>
          </div>
          <div style="flex:1">
            <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em">Temps restant</div>
            <div id="cd-display" style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:38px;color:#fff;line-height:1;margin-top:4px">${fmtCd(cd)}</div>
            <div class="cd-track"><div class="cd-fill" id="cd-fill" style="width:${fill}%;background:${fillColor}"></div></div>
            <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:4px">Scanner pour démarrer</div>
            <button onclick="nav('scan')" style="margin-top:10px;background:rgba(255,255,255,.15);border:none;border-radius:50px;color:#fff;font-size:13px;font-weight:700;padding:8px 14px;cursor:pointer">📷 Scanner QR</button>
          </div>
        </div>`:`
        <div style="text-align:center;padding:24px 0">
          <div style="font-size:40px;margin-bottom:12px">⚡</div>
          <div style="font-size:16px;font-weight:700;color:rgba(255,255,255,.8);margin-bottom:16px">Souscrivez pour accéder</div>
          <button class="btn btn-blue" onclick="nav('plans')" style="max-width:200px;margin:0 auto">Voir les plans</button>
        </div>`}
      </div>
    </div>
    <div style="display:flex;gap:8px;padding:12px 0 14px">
      <button onclick="nav('scan')" style="flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;padding:10px;font-size:13px;font-weight:700;cursor:pointer">📷 Scanner</button>
      <button onclick="nav('history')" style="flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;padding:10px;font-size:13px;font-weight:700;cursor:pointer">📋 Historique</button>
      <button onclick="nav('profile')" style="flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;padding:10px;font-size:13px;font-weight:700;cursor:pointer">👤 Profil</button>
    </div>
  </div>
  <div class="screen" style="padding-top:16px">
    ${!isActive?`<div style="padding:0 16px 14px"><div class="ref-card"><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">OFFRE DE BIENVENUE</div><div style="font-size:22px;font-weight:900;color:#fff;font-family:'Barlow Condensed',sans-serif">1 MOIS OFFERT</div><div style="font-size:13px;color:rgba(255,255,255,.7);margin-top:6px">Avec le code VOLT2024 lors de votre inscription</div><button class="btn btn-blue" onclick="nav('plans')" style="margin-top:14px">Commencer maintenant</button></div></div>`:''}
    <div style="padding:0 16px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">Stations proches</div>
      ${APP.stations.length===0?`<div style="text-align:center;padding:24px;color:var(--ink4)"><div style="font-size:32px;margin-bottom:8px">📍</div><div style="font-size:14px;font-weight:600">Aucune station trouvée</div></div>`:
      APP.stations.slice(0,5).map(s=>`
        <div class="row-item" onclick="openStation('${s.id}')">
          <div class="row-ico">${s.status==='online'?'🟢':'🔴'}</div>
          <div style="flex:1">
            <div class="row-lbl">${s.name||'Station VOLT'}</div>
            <div class="row-r">${s.address||''}</div>
          </div>
          <div style="font-size:12px;font-weight:700;color:${s.status==='online'?'var(--green)':'var(--red)'}">${s.status==='online'?'En ligne':'Hors ligne'}</div>
        </div>`).join('')}
    </div>
  </div>
  ${bnav('home')}
  <div id="install-banner" style="display:none">
    <span style="font-size:28px">⚡</span>
    <div style="flex:1">
      <div style="font-size:14px;font-weight:700;color:#fff">Installer VOLT</div>
      <div style="font-size:12px;color:rgba(255,255,255,.6)">Accès rapide depuis votre écran</div>
    </div>
    <button id="install-btn" onclick="doInstall()" style="background:var(--blue);border:none;border-radius:50px;color:#fff;font-size:13px;font-weight:700;padding:8px 14px;cursor:pointer">Installer</button>
    <button onclick="document.getElementById('install-banner').style.display='none'" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer">✕</button>
  </div>`;
}
function renderScan(){
  return `

function fmtCd(s){
  if(s<=0)return'00:00';
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
async function init(){
  APP.user=DB.load('user');

  await loadStations();

  checkTwintReturn();
  render();
  if(APP.session?.active)startCountdown();
  setupPWA();
}
async function loadStations(){
  try{
    const r=await api('/stations');
    if(r.stations)APP.stations=r.stations;
  }catch(e){APP.stations=[];}
}
async function loadHistory(){
  try{

    if(r.history)APP.history=r.history;

function startCountdown(){
  if(APP._cdTimer)clearInterval(APP._cdTimer);
  const startedAt=APP.session?.started_at?new Date(APP.session.started_at):new Date();
  function tick(){
    const elapsed=Math.floor((Date.now()-startedAt)/1000);
    APP.countdown=Math.max(0,CFG.CD_SECS-elapsed);
    const cdEl=document.getElementById('cd-display');
    const fillEl=document.getElementById('cd-fill');
    if(cdEl)cdEl.textContent=fmtCd(APP.countdown);
    if(fillEl){
      const pct=Math.max(0,Math.min(100,((CFG.CD_SECS-APP.countdown)/CFG.CD_SECS)*100));
      fillEl.style.width=pct+'%';
      fillEl.style.background=pct>50?'var(--green)':pct>20?'var(--orange)':'var(--red)';
    }
    if(APP.countdown<=0){clearInterval(APP._cdTimer);endSession();}
  }
  tick();
  APP._cdTimer=setInterval(tick,1000);
}
function endSession(){
  APP.session=null;DB.remove('session');
  toast('Session terminée');
  render();
}
function checkTwintReturn(){
  const PARAMS=new URLSearchParams(window.location.search);
  if(PARAMS.get('source')==='twint_success'){
    const piId=PARAMS.get('payment_intent');
    const redirectStatus=PARAMS.get('redirect_status');
    window.history.replaceState({},document.title,window.location.pathname);
    setTimeout(async ()=>{
      if(redirectStatus==='failed'){
        toast('Paiement TWINT annulé ou refusé. Réessayez.');
        return;
      }
      toast('Vérification du paiement TWINT…');
      try{
        const r=await api('/subscriptions/confirm-twint',{method:'POST',body:JSON.stringify({payment_intent_id:piId})});
        if(r.ok){
          toast('✅ Abonnement TWINT activé !');
          APP.user=r.user;DB.save('user',r.user);
          nav('home');
        } else {
          toast('❌ Erreur TWINT: '+(r.error||'inconnu'));
        }
      }catch(e){
        toast('❌ Erreur réseau TWINT');
      }
    },800);
  }
}
async function doAuth(){
  const email=document.getElementById('auth-email')?.value?.trim();
  const pw=document.getElementById('auth-pw')?.value;
  const name=document.getElementById('auth-name')?.value?.trim();
  const isRegister=document.getElementById('auth-btn')?.textContent==='Créer un compte';
  if(!email||!pw){toast('Remplissez tous les champs');return;}
  const btn=document.getElementById('auth-btn');
  btn.innerHTML='<div class="spin"></div>';btn.disabled=true;
  try{
    const endpoint=isRegister?'/auth/register':'/auth/login';
    const body=isRegister?{email,password:pw,full_name:name}:{email,password:pw};
    const r=await api(endpoint,{method:'POST',body:JSON.stringify(body)});
    if(r.token){
      APP.session={token:r.token};DB.save('session',APP.session);
      APP.user=r.user;DB.save('user',r.user);
      toast('Bienvenue '+(r.user?.full_name||r.user?.email||''));
      await loadHistory();
      nav('home');
    } else {
      toast('❌ '+(r.error||'Erreur'));
      btn.innerHTML=isRegister?'Créer un compte':'Se connecter';btn.disabled=false;
    }
  }catch(e){
    toast('❌ Erreur réseau');btn.innerHTML=isRegister?'Créer un compte':'Se connecter';btn.disabled=false;
  }
}

  const btn=document.getElementById('auth-btn');

function switchPayMethod(method,cs,sid){

}
async function confirmPayment(clientSecret,subId){
  const btn=document.getElementById('pay-btn');
  if(btn){btn.innerHTML='<div class="spin"></div>';btn.disabled=true;}
  try{
    if(APP._payMethod==='twint'){
      const returnUrl=window.location.origin+window.location.pathname+'?source=twint_success';
      const r=await APP.stripe.confirmTwintPayment(clientSecret,{return_url:returnUrl});
      if(r.error){
        toast('❌ TWINT: '+r.error.message);
        if(btn){btn.textContent='Ouvrir TWINT';btn.disabled=false;}
      }
      return;
    }
    const r=await APP.stripe.confirmCardPayment(clientSecret,{payment_method:{card:APP.stripeEl}});
    if(r.error){
      const errEl=document.getElementById('stripe-err');
      if(errEl)errEl.textContent=r.error.message;
      toast('❌ '+r.error.message);
      if(btn){btn.textContent='Payer maintenant';btn.disabled=false;}
    } else if(r.paymentIntent?.status==='succeeded'){
      document.getElementById('stripe-modal-bg')?.remove();
      toast('Activation en cours…');
      setTimeout(async()=>{
        try{
          const cr=await api('/subscriptions/confirm',{method:'POST',body:JSON.stringify({subscription_id:subId})})
          if(cr.ok){toast('✅ Abonnement activé !');APP.user=cr.user;DB.save('user',cr.user);nav('home');}
          else toast('❌ '+(cr.error||'Erreur confirmation'));
        }catch(e){toast('❌ Erreur réseau');}
      },1200);
    }
  }catch(e){
    toast('❌ Erreur');
    if(btn){btn.textContent=APP._payMethod==='twint'?'Ouvrir TWINT':'Payer maintenant';btn.disabled=false;}
  }
}
async function startRealScan(){
  const btn=document.getElementById('scan-btn');
  if(btn){btn.textContent='Initialisation…';btn.disabled=true;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const resultDiv=document.getElementById('scan-result');
    if(resultDiv){
      resultDiv.innerHTML=`
        <video id="scan-video" autoplay playsinline style="width:100%;border-radius:12px;max-height:200px;object-fit:cover"></video>
        <canvas id="scan-canvas" style="display:none"></canvas>`;
      const video=document.getElementById('scan-video');
      video.srcObject=stream;
      APP._scanStream=stream;
      setTimeout(()=>captureAndDecode(stream),2000);
    }
  }catch(e){
    toast('❌ Caméra non disponible');
    if(btn){btn.textContent='📷 Activer la caméra';btn.disabled=false;}
  }
}
function captureAndDecode(stream){
  const video=document.getElementById('scan-video');
  const canvas=document.getElementById('scan-canvas');
  if(!video||!canvas)return;
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  stream.getTracks().forEach(t=>t.stop());
  const stationId='demo-station-001';
  handleStationScan(stationId);
}
function showManualEntry(){
  const resultDiv=document.getElementById('scan-result');
  if(resultDiv)resultDiv.innerHTML=`
    <div style="width:100%">
      <label class="lbl">Code station</label>
      <input class="inp" id="manual-code" placeholder="ex: VOLT-A1B2" style="margin-bottom:10px"/>
      <button class="btn btn-blue" onclick="handleManualCode()">Confirmer</button>
    </div>`;
}
function handleManualCode(){
  const code=document.getElementById('manual-code')?.value?.trim();
  if(!code){toast('Entrez un code');return;}
  handleStationScan(code);
}
async function handleStationScan(stationId){
  if(!APP.user){toast('Connectez-vous d\'abord');nav('auth');return;}
  if(APP.user?.subscription_status!=='active'){toast('Abonnement requis');nav('plans');return;}
  const resultDiv=document.getElementById('scan-result');
  if(resultDiv)resultDiv.innerHTML='<div style="text-align:center;padding:20px"><div class="spin" style="margin:0 auto;border-color:rgba(0,87,255,.3);border-top-color:var(--blue)"></div></div>';
  try{
    const r=await api('/sessions/start',{method:'POST',body:JSON.stringify({station_id:stationId})});
    if(r.ok){
      APP.session={...r.session,active:true};DB.save('session',APP.session);
      toast('✅ Session démarrée !');
      nav('home');
      startCountdown();
    } else {
      toast('❌ '+(r.error||'Erreur'));
      if(resultDiv)resultDiv.innerHTML='';
    }
  }catch(e){
    toast('❌ Erreur réseau');
    if(resultDiv)resultDiv.innerHTML='';
  }
}
async function openStation(id){
  const s=APP.stations.find(x=>x.id===id);
  if(!s)return;
  const div=document.createElement('div');
  div.className='modal-bg';
  div.innerHTML=`
  <div class="modal">
    <div class="modal-pill"></div>
    <div class="modal-title">${s.name||'Station VOLT'}</div>
    <div style="margin-bottom:16px">
      <div style="font-size:14px;color:var(--ink3);margin-bottom:8px">${s.address||'Adresse inconnue'}</div>
      <div style="display:inline-flex;align-items:center;gap:6px;background:${s.status==='online'?'rgba(0,196,122,.1)':'rgba(255,59,92,.1)'};padding:6px 12px;border-radius:50px">
        <span style="font-size:10px">●</span>
        <span style="font-size:13px;font-weight:700;color:${s.status==='online'?'var(--green)':'var(--red)'}">${s.status==='online'?'En ligne':'Hors ligne'}</span>
      </div>
    </div>
    ${s.status==='online'?`<button class="btn btn-blue" onclick="this.closest('.modal-bg').remove();handleStationScan('${s.id}')">⚡ Démarrer ici</button>`:''}
    <button class="btn btn-ghost" style="margin-top:10px" onclick="this.closest('.modal-bg').remove()">Fermer</button>
  </div>`;
  document.body.appendChild(div);
}
function attachHandlers(){
  if(APP.screen==='home'&&APP.user?.subscription_status==='active'){
    setTimeout(()=>{
      const box=document.getElementById('qr-box');
      const render_el=document.getElementById('qr-render');
      if(box&&render_el&&window.QRCode){
        render_el.innerHTML='';
        new QRCode(render_el,{text:APP.user.id||'volt-user',width:140,height:140,colorDark:'#060D2E',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
        if(APP.countdown<=0){const ov=document.createElement('div');ov.className='qr-overlay';ov.innerHTML='<span style="font-size:28px">⏸</span><span style="font-size:13px;font-weight:700;color:rgba(255,255,255,.7)">Expiré</span>';box.style.position='relative';box.appendChild(ov);}
      }
    },300);
  }
}
function setupPWA(){
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    APP.deferredInstall=e;
  });
  if(window.matchMedia('(display-mode: standalone)').matches){
    const b=document.getElementById('install-banner');
    if(b)b.style.display='none';
  }
}
function showInstallBanner(){
  if(APP.deferredInstall){
    const b=document.getElementById('install-banner');
    if(b)b.style.display='flex';
  } else {
    toast('Utilisez le menu de votre navigateur pour installer');
  }
}
async function doInstall(){
  if(!APP.deferredInstall)return;
  APP.deferredInstall.prompt();
  const r=await APP.deferredInstall.userChoice;
  APP.deferredInstall=null;
  const b=document.getElementById('install-banner');
  if(b)b.style.display='none';
  if(r.outcome==='accepted')toast('✅ VOLT installé !');
}
window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(init,600);
});
</script>
</body>
</html>
