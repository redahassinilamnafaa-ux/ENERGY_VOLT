<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
::-webkit-scrollbar{display:none}
:root{
  --blue:#0057FF;
  --blue-mid:#2979FF;
  --blue-dark:#003FCC;
  --blue-soft:rgba(0,87,255,.07);
  --blue-soft2:rgba(0,87,255,.12);
  --blue-glow:rgba(0,87,255,.22);
  --ink:#060D2E;
  --ink2:#2D3652;
  --ink3:#6B7A99;
  --ink4:#A8B4CC;
  --bg:#F7F9FF;
  --bg2:#EDF1FB;
  --white:#FFFFFF;
  --border:rgba(0,87,255,.1);
  --border2:rgba(10,15,30,.07);
  --green:#00C47A;
  --red:#FF3B5C;
  --orange:#FF9500;
}
::selection{background:var(--blue);color:#fff}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:82px;overscroll-behavior-y:contain}
.screen-full{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.bc{font-family:'Barlow Condensed',sans-serif}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--border2);display:flex;z-index:100;padding:8px 0 max(16px,env(safe-area-inset-bottom))}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px 0;transition:color .15s}
.bnav-btn .ni{font-size:22px;line-height:1}
.bnav-btn .nl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bnav-btn.on{color:var(--blue)}
.bnav-btn:not(.on){color:var(--ink3)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:var(--white)}
.inp::placeholder{color:var(--ink4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 18px var(--blue-glow)}
.btn-blue:not(:disabled):hover{background:var(--blue-mid);transform:translateY(-2px);box-shadow:0 8px 32px var(--blue-glow)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink2)}
.btn-ghost{background:var(--bg2);color:var(--ink)}
.btn-sm{padding:9px 18px;font-size:16px;width:auto;border-radius:50px}
.card{background:var(--white);border-radius:20px;border:1px solid var(--border2)}
.hdr{background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%);padding:16px 20px 0}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}
.logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#fff;letter-spacing:-.5px}
.qr-card{background:var(--ink);border-radius:24px;margin:14px 16px 0;padding:22px 18px;position:relative;overflow:hidden;animation:fadeIn .35s ease}
.qr-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 80% 0%,rgba(0,87,255,.85),rgba(0,60,220,.45) 50%,rgba(0,20,120,.2) 80%,transparent);pointer-events:none}
.qr-inner{position:relative;z-index:1}
.qr-box{background:var(--white);border-radius:16px;padding:12px;display:inline-block}
.qr-box.blur{filter:blur(6px);pointer-events:none}
.qr-overlay{position:absolute;inset:0;border-radius:16px;background:rgba(6,13,46,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .3s}
.qr-cd{filter:grayscale(1) brightness(.35);transition:filter .3s}
.cd-track{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:8px 0}
.cd-fill{height:100%;border-radius:2px;transition:width 1s linear,background .5s}
.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-k{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.row-item{background:var(--white);display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:4px;cursor:pointer;border:1px solid var(--border2);transition:background .12s}
.row-item:active{background:var(--bg2)}
.row-ico{width:36px;height:36px;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.row-lbl{font-size:15px;font-weight:600;flex:1;color:var(--ink)}
.row-r{font-size:13px;font-weight:600;color:var(--ink3)}
.row-chev{font-size:18px;color:var(--ink4)}
.row-danger .row-lbl{color:var(--red)}
.row-danger .row-ico{background:#FFF0F2}
.row-danger .row-chev{color:var(--red)}
.hist-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border2)}
.hist-row:last-child{border-bottom:none}
.hist-ico{width:44px;height:44px;background:var(--blue-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--white);border-radius:16px;padding:14px 10px;border:1px solid var(--border2);text-align:center}
.stat-v{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:var(--ink);line-height:1}
.stat-l{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.plan-card{border:1.5px solid var(--border2);border-radius:20px;padding:20px;cursor:pointer;transition:all .22s;position:relative;margin-bottom:10px;background:var(--white)}
.plan-card:hover{border-color:var(--blue);box-shadow:0 8px 28px var(--blue-glow);transform:translateY(-2px)}
.plan-card.sel{border:2px solid var(--blue);box-shadow:0 8px 28px var(--blue-glow),0 0 0 3px var(--blue-soft)}
.plan-card.feat{background:linear-gradient(145deg,var(--blue-dark),var(--blue));border-color:transparent;box-shadow:0 12px 32px var(--blue-glow)}
.plan-card.feat.sel{box-shadow:0 16px 44px rgba(0,87,255,.4),0 0 0 3px rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.6)!important}
.ref-card{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px;padding:22px;margin-bottom:14px}
.ref-link-box{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.52);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--white);border-radius:28px 28px 0 0;width:100%;max-width:430px;padding:26px 22px max(40px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-pill{width:36px;height:4px;background:#E0E0DF;border-radius:2px;margin:0 auto 22px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:20px;color:var(--ink)}
#notif{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:990;max-width:390px;width:calc(100% - 40px);box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#notif.show{transform:translateX(-50%) translateY(0)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--ink);color:#fff;border-radius:50px;padding:11px 20px;font-size:14px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#stripe-el{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;transition:border-color .2s}
#stripe-el.StripeElement--focus{border-color:var(--blue);background:var(--white)}
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
#install-banner{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--ink);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:200;max-width:400px;width:calc(100% - 32px);box-shadow:0 4px 30px rgba(0,0,0,.25);border:1px solid var(--border);animation:fadeUp .3s ease}
</style>
</head>
<body>
<div id="app"><div id="volt-splash" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%)"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:76px;color:#fff;letter-spacing:-2px;line-height:1">VOLT.</div><div style="font-size:14px;font-weight:500;color:rgba(255,255,255,.38);margin-top:12px">Chargement…</div></div></div>
<div id="toast"></div>
<div id="notif">
  <span id="notif-icon" style="font-size:20px;flex-shrink:0"></span>
  <span id="notif-text" style="font-size:13px;font-weight:700;flex:1"></span>
  <button onclick="document.getElementById('notif').classList.remove('show')" style="background:none;border:none;color:rgba(255,255,255,.35);font-size:18px;cursor:pointer">✕</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
<script src="https://js.stripe.com/v3/" async></script>
<script>
const CFG = {
  API: 'https://volt-backend-final.vercel.app',
  STRIPE_KEY: 'pk_live_51TYCHoClAT61ADIRmCN6fiHdNNAzqWW3Se7zCOVUQzRrMllm8VQdGPwnOfpNE9rTKqCpFQbCPBhj1TJgTIkIoyDR000T77uHse',
  CD_SECS: 900,
};
const PLANS = [
  { id:'month',   label:'MENSUEL',      chf:'9.90',  per:'/mois',    saving:null,             badge:null,             feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Sans engagement'] },
  { id:'quarter', label:'TRIMESTRIEL',  chf:'24.90', per:'/3 mois',  saving:'Éco. CHF 4.80',  badge:'⭐ POPULAIRE',    feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Renouvellement auto.'] },
  { id:'year',    label:'ANNUEL',       chf:'89.90', per:'/an',      saving:'Éco. CHF 28.90', badge:'🏆 MEILLEUR PRIX', feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Tarif le plus bas'] },
];
window.getExpiryText = function(u) {
  if (!u || !u.subscribed) return 'NON ABONNÉ';
  let d;
  if (u.sub_expires_at) { d = new Date(u.sub_expires_at); }
  else {
    d = u.created_at ? new Date(u.created_at) : new Date();
    const plan = PLANS.find(p => p.id === u.plan);
    if (plan) {
      if (plan.id === 'month') d.setMonth(d.getMonth() + 1);
      else if (plan.id === 'quarter') d.setMonth(d.getMonth() + 3);
      else if (plan.id === 'year') d.setFullYear(d.getFullYear() + 1);
    }
  }
  return d.toLocaleDateString('fr-CH');
};
const PARAMS = new URLSearchParams(location.search);
const DEMO = false;
if (PARAMS.get('ref')) localStorage.setItem('volt_ref', PARAMS.get('ref'));
let S = { screen:'login', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true };
function loadSess() { try { const d = JSON.parse(localStorage.getItem('volt_s') || 'null'); if (d && d.user) { S.user = d.user; S.token = d.token; S.cdEnd = d.cdEnd || 0; S.history = d.history || []; S.screen = 'home'; } } catch(e) {} }
function saveSess() { localStorage.setItem('volt_s', JSON.stringify({ user:S.user, token:S.token, cdEnd:S.cdEnd, history:S.history })); }
function doLogout() { localStorage.removeItem('volt_s'); if (qrRotateTimer) clearTimeout(qrRotateTimer); S = { screen:'login', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true }; render(); }
window.navPay = function() { nav("pay"); };
window.togglePwd = function(id, btn) { var el = document.getElementById(id); if (!el) return; var show = el.type === 'password'; el.type = show ? 'text' : 'password'; btn.innerHTML = show ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; };
window.goToLogin = function() { localStorage.removeItem("volt_s"); S = { screen:"login", user:null, token:null, plan:"quarter", cdEnd:0, history:[], tab:"conn", cgv:false, payMethod:"card", notifs:true }; window.history.replaceState({}, document.title, window.location.pathname); render(); };
async function api(path, body, method, _retry) { try { const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000); const r = await fetch(CFG.API + path, { signal: ctrl.signal, method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type':'application/json', 'Authorization': S.token ? 'Bearer '+S.token : '' }, body: body ? JSON.stringify(body) : undefined }); clearTimeout(t); if (r.status === 401) { doLogout(); return { error: 'Session expirée.' }; } return r.json(); } catch(e) { if (!_retry) { await new Promise(r => setTimeout(r, 1500)); return api(path, body, method, true); } return { error:'Connexion impossible.' }; } }
function cdLeft() { return Math.max(0, Math.ceil(S.cdEnd - Date.now()/1000)); }
function fmtCd(s) { return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; }
function toast(msg, good) { const el = document.getElementById('toast'); el.textContent = msg; el.style.background = good===false ? '#FF3B5C' : '#050A14'; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2600); }
function notif(icon, text) { document.getElementById('notif-icon').textContent = icon; document.getElementById('notif-text').textContent = text; const el = document.getElementById('notif'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); }
function nav(to) { S.screen = to; render(); }
function initials(name) { return (name||'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase() || 'VU'; }
function render() { const splash = document.getElementById('volt-splash'); if (splash) splash.remove(); const app = document.getElementById('app'); if (S.screen === 'verify-success') { app.innerHTML = renderVerifySuccess(); return; } if (!S.user) { app.innerHTML = renderLogin(); bindLogin(); return; } if (S.screen === 'verify-pending' || S.user.email_verified === false) { app.innerHTML = renderVerifyPending(); return; } const navHtml = renderNav(); if (S.screen === 'home') { app.innerHTML = renderHome() + navHtml; bindHome(); } else if (S.screen === 'pay') { app.innerHTML = renderPay() + navHtml; bindPay(); } else if (S.screen === 'hist') { app.innerHTML = renderHist() + navHtml; } else if (S.screen === 'acc') { app.innerHTML = renderAcc() + navHtml; } else if (S.screen === 'manage') { app.innerHTML = renderManage() + navHtml; } }
function renderNav() { const tabs = [{ id:'home', icon:'⚡', label:'Mon QR' },{ id:'pay', icon:'💳', label:'Abo.' },{ id:'hist', icon:'📊', label:'Historique' },{ id:'acc', icon:'👤', label:'Compte' }]; return '<nav class="bnav">' + tabs.map(t => '<button class="bnav-btn '+(S.screen===t.id?'on':'')+'" onclick="nav(\''+t.id+'\')"><span class="ni">'+t.icon+'</span><span class="nl">'+t.label+'</span></button>').join('') + '</nav>'; }
function renderLogin() { return '<div class="screen-full" style="background:var(--ink);display:flex;flex-direction:column;min-height:100%"><div style="position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column"><div style="position:absolute;inset:0;background:radial-gradient(ellipse 100% 70% at 75% 0%,rgba(0,87,255,.7),rgba(0,40,180,.35) 50%,transparent 75%);pointer-events:none"></div><div style="padding:56px 28px 28px;position:relative;animation:fadeUp .7s ease both"><div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:76px;color:#fff;letter-spacing:-2px;line-height:.9">VOLT.</div></div><div style="background:var(--white);border-radius:28px 28px 0 0;padding:26px 22px max(40px,env(safe-area-inset-bottom));margin-top:auto"><div style="display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px;margin-bottom:22px"><button onclick="setTab(\'conn\')" style="flex:1;padding:9px;border-radius:9px;border:none;font-size:15px;font-weight:800;background:'+(S.tab==='conn'?'#fff':'transparent')+';color:'+(S.tab==='conn'?'var(--ink)':'var(--ink3)')+'">Connexion</button><button onclick="setTab(\'inscr\')" style="flex:1;padding:9px;border-radius:9px;border:none;font-size:15px;font-weight:800;background:'+(S.tab==='inscr'?'#fff':'transparent')+';color:'+(S.tab==='inscr'?'var(--ink)':'var(--ink3)')+'">Inscription</button></div><div id="tab-body">' + renderTabBody() + '</div></div></div></div>'; }
function renderTabBody() { if (S.tab === 'conn') { return '<div style="display:flex;flex-direction:column;gap:14px"><div><label class="lbl">Email</label><input class="inp" id="l-email" type="email" placeholder="ton@email.ch"/></div><div><label class="lbl">Mot de passe</label><input class="inp" id="l-pwd" type="password" placeholder="••••••••"/></div><button class="btn btn-dark" id="btn-login" onclick="doLogin()">Se connecter →</button></div>'; } return '<div style="display:flex;flex-direction:column;gap:14px"><div class="row2"><div><label class="lbl">Prénom</label><input class="inp" id="r-fn" placeholder="Alex"/></div><div><label class="lbl">Nom</label><input class="inp" id="r-ln" placeholder="Martin"/></div></div><div><label class="lbl">Email</label><input class="inp" id="r-email" type="email" placeholder="ton@email.ch"/></div><div><label class="lbl">Mot de passe</label><input class="inp" id="r-pwd" type="password" placeholder="Min. 8 caractères"/></div><button class="btn btn-dark" onclick="doRegister()">Créer mon compte ⚡</button></div>'; }
window.setTab = function(t) { S.tab = t; render(); };
async function doLogin() { const email = document.getElementById('l-email').value; const pwd = document.getElementById('l-pwd').value; const res = await api('/api/login', { email, password: pwd }); if (res.error) { toast(res.error, false); return; } S.user = res.user; S.token = res.token; saveSess(); S.screen = 'home'; render(); }
function renderPay() { const u = S.user; const sel = S.plan; const method = S.payMethod; const planPrice = (PLANS.find(p=>p.id===sel)||PLANS[0]).chf; return '<div class="screen"><div class="hdr" style="padding-bottom:18px"><div class="hdr-row"><div class="bc" style="font-weight:900;font-size:28px;color:#fff">ABONNEMENT</div><div class="bc" style="font-weight:900;font-size:24px;color:#fff">VOLT.</div></div></div><div style="padding:14px 16px 0">' + PLANS.map(p => '<div class="plan-card '+(p.id===sel?'sel':'')+'" onclick="S.plan=\''+p.id+'\';render()"><div style="font-weight:800">'+p.label+'</div><div class="bc" style="font-size:24px">CHF '+p.chf+'</div></div>').join('') + '<div class="lbl" style="margin-top:20px">MÉTHODE DE PAIEMENT</div><div style="display:flex;gap:10px;margin-bottom:16px"><button onclick="S.payMethod=\'card\';render()" style="flex:1;padding:12px;border-radius:12px;border:2px solid '+(method==='card'?'var(--blue)':'var(--border2)')+'">💳 Carte</button><button onclick="S.payMethod=\'twint\';render()" style="flex:1;padding:12px;border-radius:12px;border:2px solid '+(method==='twint'?'var(--blue)':'var(--border2)')+'">📱 TWINT</button></div>' + (method==='card' ? '<div class="card" style="padding:20px;margin-bottom:14px"><div id="stripe-el"></div></div><button class="btn btn-blue" onclick="doPay()">PAYER CHF '+planPrice+'</button>' : '<div class="card" style="padding:24px;text-align:center;margin-bottom:14px"><div style="font-size:32px">📱</div><div class="bc" style="font-weight:900;font-size:20px">PAIEMENT TWINT</div><div style="font-size:13px;color:var(--ink3)">Paiement unique de CHF '+planPrice+' via l\'app TWINT.</div></div><button class="btn btn-blue" onclick="doTwint()">OUVRIR TWINT →</button>') + '</div></div>'; }
function bindPay() { if (S.payMethod === 'card') { setTimeout(initStripe, 200); } }
function initStripe() { if (!window.Stripe) return; const stripe = Stripe(CFG.STRIPE_KEY); const elements = stripe.elements(); const card = elements.create('card'); card.mount('#stripe-el'); window.stripeInst = stripe; window.stripeCard = card; }
async function doTwint() { const plan = PLANS.find(p=>p.id===S.plan); const res = await api('/api/pay-intent', { plan_id: plan.id, method: 'twint' }); if (res.client_secret) { const stripe = window.stripeInst || Stripe(CFG.STRIPE_KEY); stripe.confirmTwintPayment(res.client_secret, { return_url: window.location.href }); } }
function renderHome() { return '<div class="screen"><div class="hdr"><div class="hdr-row"><div class="bc" style="font-weight:900;font-size:28px;color:#fff">MON CODE QR</div><div class="bc" style="font-weight:900;font-size:24px;color:#fff">VOLT.</div></div></div><div class="qr-card"><div style="background:#fff;padding:15px;border-radius:15px;width:200px;margin:0 auto" id="qr-el"></div><div style="text-align:center;color:#fff;margin-top:15px">Prêt à scanner ⚡</div></div></div>'; }
function bindHome() { generateQR(); }
function generateQR() { const el = document.getElementById('qr-el'); if (!el || typeof QRCode === 'undefined') { setTimeout(generateQR, 300); return; } el.innerHTML = ''; new QRCode(el, { text: "volt://"+S.user.id, width: 200, height: 200 }); }
function renderHist() { return '<div class="screen"><div class="hdr"><div class="bc" style="font-weight:900;font-size:28px;color:#fff">HISTORIQUE</div></div><div style="padding:20px;text-align:center;color:var(--ink3)">Aucun scan récent</div></div>'; }
function renderAcc() { return '<div class="screen"><div class="hdr"><div class="bc" style="font-weight:900;font-size:28px;color:#fff">MON COMPTE</div></div><div style="padding:20px"><button class="btn btn-ghost" onclick="doLogout()">Déconnexion 🚪</button></div></div>'; }
let qrRotateTimer = null;
(function boot() { loadSess(); render(); })();
</script></body>
</html>
