async function api(path, body, method, _retry) { if (DEMO) return demoApi(path, body); try { const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000); const r = await fetch(CFG.API + path, { signal: ctrl.signal, method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type':'application/json', 'Authorization': S.token ? 'Bearer '+S.token : '' }, body: body ? JSON.stringify(body) : undefined }); clearTimeout(t); const isAuthRoute = path.indexOf('/api/login') === 0 || path.indexOf('/api/register') === 0; if (r.status === 401 && S.token && !isAuthRoute) { doLogout(); return { error: 'Session expirée.' }; } return r.json(); } catch(e) { if (!_retry) { await new Promise(r => setTimeout(r, 1500)); return api(path, body, method, true); } return { error:'Connexion impossible.' }; } }
function demoApi(path, body) { if (path === '/api/login') { if ((body.email||'').toLowerCase() === 'demo@volt.energy.ch') return { user: DEMO_USER, token: 'demo-tok' }; return { error: 'Email ou mot de passe incorrect.' }; } if (path === '/api/register') return { user: Object.assign({}, DEMO_USER, { name:(body.firstName+' '+body.lastName).trim(), email:body.email, subscribed:false }), token:'demo-tok2' }; if (path === '/api/pay-intent') return { ok:true, demo:true }; if (path === '/api/qr-token') return { token:'demo-'+Date.now(), expires_at:new Date(Date.now()+120000).toISOString(), ttl:120, cooldown_remaining:0 }; if (path === '/api/user-update?action=history') return { history:[] }; return { ok:true }; }
function cdLeft() { return Math.max(0, Math.ceil(S.cdEnd - Date.now()/1000)); }
function fmtCd(s) { return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; }
function fmtAvailAt() { try { const d = new Date(S.cdEnd*1000); const f = new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Zurich',hour:'2-digit',minute:'2-digit',hour12:false}); return f.format(d).replace(':','h'); } catch(e) { const d = new Date(S.cdEnd*1000); return d.getHours().toString().padStart(2,'0')+'h'+d.getMinutes().toString().padStart(2,'0'); } }
function toast(msg, good) { const el = document.getElementById('toast'); el.textContent = msg; el.style.background = good===false ? '#FF3B5C' : '#050A14'; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2600); }
function notif(icon, text) { document.getElementById('notif-icon').textContent = icon; document.getElementById('notif-text').textContent = text; const el = document.getElementById('notif'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); }

let stripeInst = null, stripeCard = null;
/**
 * Affiche la RAISON d'un QR indisponible, au lieu d'un eclair gris.
 *
 * L'ancienne version avalait l'erreur et reessayait toutes les 10 s en
 * silence : un abonne a jour de paiement voyait un carre gris sans explication,
 * et le support n'avait aucune piste. Session expiree, email non verifie,
 * limite de requetes — chacune demande une action differente, il faut donc la
 * nommer.
 */
function showQrError(el, res, hasQR) {
  if (hasQR) return;           // un QR valide est deja affiche : ne pas l'effacer
  var msg = res.error || 'QR indisponible.';
  var action = '';
  if (res.code === 'EMAIL_NOT_VERIFIED') {
    action = 'Vérifie ta boîte mail (et les indésirables).';
  } else if (res.status === 401 || /authenti/i.test(msg)) {
    msg = 'Session expirée.';
    action = 'Reconnecte-toi pour retrouver ton QR.';
  } else if (res.status === 429) {
    action = 'Patiente quelques secondes.';
  }
  el.innerHTML = '<div style="width:180px;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;box-sizing:border-box">'
    + '<div style="font-size:30px;margin-bottom:8px">⚠️</div>'
    + '<div style="font-size:12px;font-weight:700;color:var(--ink2);line-height:1.4">' + msg + '</div>'
    + (action ? '<div style="font-size:11px;color:var(--ink3);margin-top:6px;line-height:1.4">' + action + '</div>' : '')
    + '</div>';
}

ght:900;font-size:22px;color:#fff">∞</div><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase">RÉSEAU</div></div><div style="text-align:center"><div class="bc" style="font-weight:900;font-size:22px;color:#fff">15</div><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase">MIN COOLDOWN</div></div><div style="text-align:center"><div class="bc" id="scan-count" style="font-weight:900;font-size:22px;color:#fff">—</div><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase">CE MOIS</div></div></div></div></div>'+(cd===0?'<div style="padding:14px 16px 0"><div style="background:rgba(0,87,255,.06);border:1.5px solid rgba(0,87,255,.18);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px"><div style="font-size:22px;flex-shrink:0">📲</div><div><div class="bc" style="font-weight:800;font-size:18px;color:var(--ink)">PRÉSENTE TON CODE QR AU SCANNER</div><div style="font-size:12px;font-weight:500;color:var(--ink3);margin-top:2px">La machine lit ton Code QR automatiquement</div></div></div></div>':'')+expiryBanner+'<div style="padding:12px 16px 0"><div class="stat-grid"><div class="stat-box"><div class="stat-v" id="stat-today">—</div><div class="stat-l">Aujourd\'hui</div></div><div class="stat-box"><div class="stat-v" id="stat-month">—</div><div class="stat-l">Ce mois</div></div><div class="stat-box"><div class="stat-v">15\'</div><div class="stat-l">Cooldown</div></div></div></div><div style="padding:12px 16px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase">Dernières boissons</div><button onclick="nav(\'hist\')" style="background:none;border:none;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer">Voir tout →</button></div><div class="card" id="home-hist" style="padding:0 let qrRotateTimer = null;

async function generateRotatingQR() { const el = document.getElementById('qr-el'); if (!el) return; if (typeof QRCode === 'undefined') { setTimeout(generateRotatingQR, 400); return; } const now = Date.now(); const hasQR = !!el.querySelector('img'); const reschedule = (ms) => { if (qrRotateTimer) clearTimeout(qrRotateTimer); qrRotateTimer = setTimeout(generateRotatingQR, ms); }; if (qrCache.dataUrl && now < qrCache.expiry) { if (!hasQR) showQrImg(el, qrCache.dataUrl); reschedule(Math.max(500, qrCache.expiry - now)); return; } if (!hasQR) { el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center"><div class="spin" style="border-color:rgba(0,87,255,.3);border-top-color:var(--blue)"></div></div>'; } const res = await api('/api/qr-token', null, 'GET'); if (res.error) { showQrError(el, res, hasQR); reschedule(10_000); return; } const prevCd = cdLeft(); if (res.cooldown_remaining > 0) { S.cdEnd = Date.now()/1000 + res.cooldown_remaining; saveSess(); if (prevCd === 0) { render(); return; } startCdTick(); } if (!res.token) { if (!hasQR) el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; reschedule(10_000); return; } try { const tmp = document.createElement('div'); new QRCode(tmp, { text: 'volt://' + res.token, width: 180, height: 180, colorDark: '#050A14', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); const canvas = tmp.querySelector('canvas'); const dataUrl = canvas ? canvas.toDataURL() : null; if (dataUrl) { qrCache.dataUrl = dataUrl; qrCache.expiry = now + 9_500; showQrImg(el, dataUrl); } else { el.innerHTML = ''; while (tmp.firstChild) el.appendChild(tmp.firstChild); } } catch(e) { if (!hasQR) el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>'; } reschedule(10_000); }
