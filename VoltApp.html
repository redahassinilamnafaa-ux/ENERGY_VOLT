<html lang="fr">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
:root{
  --blue:#0057FF;
  --blue-mid:#2979FF;
  --blue-dark:#003FCC;
  --blue-soft:rgba(0,87,255,.07);
  --blue-soft2:rgba(0,87,255,.12);
  --blue-glow:rgba(0,87,255,.22);
  --ink:#060D2E;
  --ink2:#2D3652;
  --ink3:#6B7A99;
  --ink4:#A8B4CC;
  --bg:#F7F9FF;
  --bg2:#EDF1FB;
  --white:#FFFFFF;
  --border:rgba(0,87,255,.1);
  --border2:rgba(10,15,30,.07);
  --green:#00C47A;
  --red:#FF3B5C;
  --orange:#FF9500;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
::selection{background:var(--blue);color:#fff}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:82px}
.screen-full{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* FONTS */
.bc{font-family:'Barlow Condensed',sans-serif}

/* NAV BOTTOM */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--border2);display:flex;z-index:100;padding:8px 0 max(16px,env(safe-area-inset-bottom))}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px 0;transition:color .15s}
.bnav-btn .ni{font-size:22px;line-height:1}
.bnav-btn .nl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bnav-btn.on{color:var(--blue)}
.bnav-btn:not(.on){color:var(--ink3)}

/* INPUTS */
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:var(--white)}
.inp::placeholder{color:var(--ink4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BUTTONS */
.btn{width:100%;padding:15px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 18px var(--blue-glow)}
.btn-blue:not(:disabled):hover{background:var(--blue-mid);transform:translateY(-2px);box-shadow:0 8px 32px var(--blue-glow)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink2)}
.btn-ghost{background:var(--bg2);color:var(--ink)}
.btn-sm{padding:9px 18px;font-size:16px;width:auto;border-radius:50px}

/* CARD */
.card{background:var(--white);border-radius:20px;border:1px solid var(--border2)}

/* DARK HEADER */
.hdr{background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%);padding:16px 20px 0}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}
.logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#fff;letter-spacing:-.5px}

/* QR CARD */
.qr-card{background:var(--ink);border-radius:24px;margin:14px 16px 0;padding:22px 18px;position:relative;overflow:hidden}
.qr-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 80% 0%,rgba(0,87,255,.85),rgba(0,60,220,.45) 50%,rgba(0,20,120,.2) 80%,transparent);pointer-events:none}
.qr-inner{position:relative;z-index:1}
.qr-box{background:var(--white);border-radius:16px;padding:12px;display:inline-block}
.qr-box.blur{filter:blur(6px);pointer-events:none}
.qr-overlay{position:absolute;inset:0;border-radius:16px;background:rgba(10,15,30,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}

/* COOLDOWN BAR */
.cd-track{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:8px 0}
.cd-fill{height:100%;border-radius:2px;transition:width 1s linear,background .5s}

/* TOGGLE */
.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-k{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ROW ITEM */
.row-item{background:var(--white);display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:4px;cursor:pointer;border:1px solid var(--border2);transition:background .12s}
.row-item:active{background:var(--bg2)}
.row-ico{width:36px;height:36px;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.row-lbl{font-size:15px;font-weight:600;flex:1;color:var(--ink)}
.row-r{font-size:13px;font-weight:600;color:var(--ink3)}
.row-chev{font-size:18px;color:var(--ink4)}
.row-danger .row-lbl{color:var(--red)}
.row-danger .row-ico{background:#FFF0F2}
.row-danger .row-chev{color:var(--red)}

/* HIST */
.hist-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border2)}
.hist-row:last-child{border-bottom:none}
.hist-ico{width:44px;height:44px;background:var(--blue-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--border)}

/* STAT BOX */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--white);border-radius:16px;padding:14px 10px;border:1px solid var(--border2);text-align:center}
.stat-v{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:var(--ink);line-height:1}
.stat-l{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}

/* PLAN CARD */
.plan-card{border:1.5px solid var(--border2);border-radius:20px;padding:20px;cursor:pointer;transition:all .22s;position:relative;margin-bottom:10px;background:var(--white)}
.plan-card:hover{border-color:var(--blue);box-shadow:0 8px 28px var(--blue-glow);transform:translateY(-2px)}
.plan-card.sel{border:2px solid var(--blue);box-shadow:0 8px 28px var(--blue-glow),0 0 0 3px var(--blue-soft)}
.plan-card.feat{background:linear-gradient(145deg,var(--blue-dark),var(--blue));border-color:transparent;box-shadow:0 12px 32px var(--blue-glow)}
.plan-card.feat.sel{box-shadow:0 16px 44px rgba(0,87,255,.4),0 0 0 3px rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.6)!important}

/* REFERRAL */
.ref-card{background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px;padding:22px;margin-bottom:14px}
.ref-link-box{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:12px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.52);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--white);border-radius:28px 28px 0 0;width:100%;max-width:430px;padding:26px 22px max(40px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-pill{width:36px;height:4px;background:#E0E0DF;border-radius:2px;margin:0 auto 22px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:20px;color:var(--ink)}

/* NOTIF */
#notif{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:990;max-width:390px;width:calc(100% - 40px);box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#notif.show{transform:translateX(-50%) translateY(0)}

/* TOAST */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--ink);color:#fff;border-radius:50px;padding:11px 20px;font-size:14px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* STRIPE */
#stripe-el{background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;transition:border-color .2s}
#stripe-el.StripeElement--focus{border-color:var(--blue);background:var(--white)}

/* SPINNER */
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* INSTALL BANNER */
#install-banner{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--ink);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:200;max-width:400px;width:calc(100% - 32px);box-shadow:0 4px 30px rgba(0,0,0,.25);border:1px solid var(--border);animation:fadeUp .3s ease}
</style>
</head>
<body>
<div id="app"><div id="volt-splash" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#060D2E 0%,#0A1A5C 60%,#0D2280 100%)"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:76px;color:#fff;letter-spacing:-2px;line-height:1">VOLT.</div><div style="font-size:14px;font-weight:500;color:rgba(255,255,255,.38);margin-top:12px">Chargement…</div></div></div>
<div id="toast"></div>
<div id="notif">
  <span id="notif-icon" style="font-size:20px;flex-shrink:0"></span>
  <span id="notif-text" style="font-size:13px;font-weight:700;flex:1"></span>
  <button onclick="document.getElementById('notif').classList.remove('show')" style="background:none;border:none;color:rgba(255,255,255,.35);font-size:18px;cursor:pointer">✕</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
<script src="https://js.stripe.com/v3/" async></script>
<script>
// ═══════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════
const CFG = {
  API: 'https://volt-backend-final.vercel.app',
  STRIPE_KEY: 'pk_live_51TYCHoClAT61ADIRmCN6fiHdNNAzqWW3Se7zCOVUQzRrMllm8VQdGPwnOfpNE9rTKqCpFQbCPBhj1TJgTIkIoyDR000T77uHse',
  DEMO_CODE: 'volt-admin-2025',
  CD_SECS: 900,
};

const PLANS = [
  { id:'month',   label:'MENSUEL',      chf:'9.90',  per:'/mois',    saving:null,             badge:null,             feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Sans engagement'] },
  { id:'quarter', label:'TRIMESTRIEL',  chf:'24.90', per:'/3 mois',  saving:'Éco. CHF 4.80',  badge:'⭐ POPULAIRE',    feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Renouvellement auto.'] },
  { id:'year',    label:'ANNUEL',       chf:'89.90', per:'/an',      saving:'Éco. CHF 28.90', badge:'🏆 MEILLEUR PRIX', feat:['1 boisson / 15 min','QR code permanent','Réseau partenaires','Tarif le plus bas'] },
];

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
window.getExpiryText = function(u) {
  if (!u || !u.subscribed) return 'NON ABONNÉ';
  let d;
  if (u.sub_expires_at) {
    d = new Date(u.sub_expires_at);
  } else {
    d = u.created_at ? new Date(u.created_at) : new Date();
    const plan = PLANS.find(p => p.id === u.plan);
    if (plan) {
      if (plan.id === 'month') d.setMonth(d.getMonth() + 1);
      else if (plan.id === 'quarter') d.setMonth(d.getMonth() + 3);
      else if (plan.id === 'year') d.setFullYear(d.getFullYear() + 1);
    }
  }
  return d.toLocaleDateString('fr-CH');
};

const PARAMS = new URLSearchParams(location.search);
const DEMO = PARAMS.get('access') === CFG.DEMO_CODE;

let S = {
  screen: 'login',
  user: null,
  token: null,
  plan: 'quarter',
  cdEnd: 0,
  history: [],
  tab: 'conn',
  cgv: false,
  payMethod: 'card',
  notifs: true,
};

const DEMO_USER = {
  id:'demo-00000001',
  name:'Alex Martin',
  email:'demo@volt.energy.ch',
  phone:'+41 79 000 00 00',
  initials:'AM',
  plan:'quarter',
  subscribed:true,
  authorized:true,
  gym:'Fitness partenaire',
  referral_code:'VOLTAM01',
  referral_count:3,
  free_months:3,
};

function loadSess() {
  try {
    const d = JSON.parse(localStorage.getItem('volt_s') || 'null');
    if (d && d.user) { S.user = d.user; S.token = d.token; S.cdEnd = d.cdEnd || 0; S.screen = 'home'; }
  } catch(e) {}
}
function saveSess() {
  localStorage.setItem('volt_s', JSON.stringify({ user:S.user, token:S.token, cdEnd:S.cdEnd }));
}
function doLogout() {
  localStorage.removeItem('volt_s');
  S = { screen:'login', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card' };
  render();
}

window.navPay = function() { nav("pay"); };

window.goToLogin = function() {
  localStorage.removeItem("volt_s");
  S = { screen:"login", user:null, token:null, plan:"quarter", cdEnd:0, history:[], tab:"conn", cgv:false, payMethod:"card", notifs:true };
  window.history.replaceState({}, document.title, window.location.pathname);
  render();
};

window.toggleNotifs = function() {
  S.notifs = !S.notifs;
  const lbl = document.getElementById('notif-toggle-label');
  if (lbl) { lbl.textContent = S.notifs ? 'Actives' : 'Désactivées'; lbl.style.color = S.notifs ? 'var(--blue)' : 'var(--ink3)'; }
};

window.showInvoices = async function() {
  openModal('Mes factures', '<div style="text-align:center;padding:24px 0"><div class="spin" style="border-color:rgba(0,0,0,.1);border-top-color:var(--blue);margin:0 auto"></div></div>');
  const r = await api('/api/invoices', null, 'GET');
  if (!r.invoices || r.invoices.length === 0) {
    openModal('Mes factures', '<div style="text-align:center;padding:24px 0;color:var(--ink3);font-size:14px">Aucune facture pour le moment.</div><button class="btn btn-ghost" style="margin-top:16px" onclick="closeModal()">Fermer</button>');
    return;
  }
  openModal('Mes factures',
    '<div style="display:flex;flex-direction:column;gap:10px">'
    + r.invoices.map(inv =>
        '<div class="row-item" style="justify-content:space-between">'
        +'<div><div style="font-size:14px;font-weight:700">CHF '+((inv.amount_due||0)/100).toFixed(2)+'</div>'
        +'<div style="font-size:12px;color:var(--ink3)">'+new Date(inv.created*1000).toLocaleDateString('fr-CH')+'</div></div>'
        +(inv.invoice_pdf ? '<button onclick="window.sendOneInvoice(\''+inv.id+'\')" style="background:var(--blue-soft);border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer">PDF →</button>' : '')
        +'</div>'
      ).join('')
    + '<button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Fermer</button></div>'
  );
};

window.sendOneInvoice = async function(invoiceId) {
  toast('Envoi en cours...');
  const res = await api('/api/user-update?action=send-invoice', { invoiceId }, 'POST');
  if (res.ok) toast('Facture envoyée par email ✓', true);
  else toast(res.error || 'Erreur envoi', false);
};

window.confirmDeleteAccount = function() {
  openModal('Supprimer mon compte',
    '<div style="text-align:center;padding:8px 0">'
    +'<div style="font-size:40px;margin-bottom:16px">⚠️</div>'
    +'<div style="font-size:15px;font-weight:600;color:var(--ink);margin-bottom:8px">Cette action est irréversible.</div>'
    +'<div style="font-size:13px;color:var(--ink3);margin-bottom:24px">Ton abonnement sera annulé et toutes tes données supprimées.</div>'
    +'<button class="btn btn-dark" style="background:var(--red)" onclick="doDeleteAccount()">Oui, supprimer mon compte</button>'
    +'<button class="btn btn-ghost" style="margin-top:10px" onclick="closeModal()">Annuler</button>'
    +'</div>'
  );
};

window.doDeleteAccount = async function() {
  closeModal();
  toast('Suppression en cours...');
  const r = await api('/api/user-update', { action:'delete' }, 'DELETE');
  if (r.ok) {
    localStorage.removeItem('volt_s');
    S = { screen:'login', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true };
    render();
    toast('Compte supprimé.', true);
  } else {
    toast(r.error || 'Erreur lors de la suppression.', false);
  }
};

async function api(path, body, method) {
  if (DEMO) return demoApi(path, body);
  const opts = {
    method: method || (body ? 'POST' : 'GET'),
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer '+S.token } : {}) },
  };
  if (body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(CFG.API + path, opts);
    return await r.json();
  } catch(e) { return { error: 'Erreur réseau.' }; }
}

function demoApi(path, body) {
  if (path.includes('qr-token')) return Promise.resolve({ token: 'DEMO-'+Date.now() });
  if (path.includes('history')) return Promise.resolve({ history: [
    { gym:'Fitness Demo', time:'Aujourd\'hui 10:32', today:true },
    { gym:'Fitness Demo', time:'Hier 08:15', today:false },
  ]});
  if (path.includes('invoices')) return Promise.resolve({ invoices: [] });
  return Promise.resolve({ ok: true });
}

function cdLeft() { return Math.max(0, Math.ceil(S.cdEnd - Date.now()/1000)); }
function fmtCd(s) { return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; }

function toast(msg, good) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.style.background = good === false ? 'var(--red)' : good === true ? 'var(--green)' : 'var(--ink)';
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function notif(icon, text) {
  const el = document.getElementById('notif');
  const ic = document.getElementById('notif-icon');
  const tx = document.getElementById('notif-text');
  if (!el) return;
  if (ic) ic.textContent = icon;
  if (tx) tx.textContent = text;
  el.classList.add('show');
  clearTimeout(notif._t);
  notif._t = setTimeout(() => el.classList.remove('show'), 5000);
}

function nav(to) { S.screen = to; render(); }

function initials(name) {
  const p = (name||'').trim().split(' ');
  return ((p[0]||'')[0]+(p[1]||p[0]||'')[0]).toUpperCase();
}

async function shareRef() {
  const code = S.user.referral_code || S.user.id.slice(0,8).toUpperCase();
  const link = 'https://volt.energy.ch/join?ref=' + code;
  if (navigator.share) { await navigator.share({ title:'VOLT. — Rejoins-moi !', url:link }); }
  else { try { await navigator.clipboard.writeText(link); toast('Lien copié ! ✓'); } catch(e) { toast(link); } }
}

let cdTick = null;
function startCdTick() {
  clearInterval(cdTick);
  cdTick = setInterval(() => {
    const rem = cdLeft();
    const tEl = document.getElementById('cd-time');
    const fEl = document.getElementById('cd-fill');
    const sEl = document.getElementById('cd-sub');
    const col = rem < 60 ? '#FF3B5C' : rem < 180 ? '#FF9500' : '#0057FF';
    if (tEl) { tEl.textContent = fmtCd(rem); tEl.style.color = col; }
    if (fEl) { fEl.style.width = (rem/CFG.CD_SECS*100)+'%'; fEl.style.background = col; }
    if (sEl) { sEl.textContent = fmtCd(rem); }
    if (rem === 0) { clearInterval(cdTick); notif('⚡','Ton prochain scan est disponible !'); render(); }
  }, 1000);
}

async function doLogin() {
  const email = (document.getElementById('l-email')||{}).value || '';
  const pwd   = (document.getElementById('l-pwd')||{}).value || '';
  if (!email || !pwd) { toast('Remplis tous les champs.', false); return; }
  const btn = document.getElementById('btn-login');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spin"></div>'; }
  const r = await api('/api/auth', { action:'login', email, password:pwd });
  if (btn) { btn.disabled = false; btn.innerHTML = 'Se connecter →'; }
  if (r.error) { toast(r.error, false); return; }
  S.user = r.user; S.token = r.token; S.screen = 'home';
  saveSess(); render();
}

async function doRegister() {
  const fn    = (document.getElementById('r-fn')||{}).value || '';
  const ln    = (document.getElementById('r-ln')||{}).value || '';
  const email = (document.getElementById('r-email')||{}).value || '';
  const phone = (document.getElementById('r-phone')||{}).value || '';
  const pwd   = (document.getElementById('r-pwd')||{}).value || '';
  if (!fn || !ln || !email || !pwd) { toast('Remplis tous les champs.', false); return; }
  if (!S.cgv) { toast('Accepte les CGV pour continuer.', false); return; }
  if (pwd.length < 8) { toast('Mot de passe trop court (8 min).', false); return; }
  const btn = document.getElementById('btn-register');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spin"></div>'; }
  const ref = PARAMS.get('ref');
  const r = await api('/api/auth', { action:'register', firstName:fn, lastName:ln, email, phone, password:pwd, referral:ref });
  if (btn) { btn.disabled = false; btn.innerHTML = 'Créer mon compte ⚡'; }
  if (r.error) { toast(r.error, false); return; }
  S.user = r.user; S.token = r.token; S.screen = 'home';
  saveSess(); render();
}

// ── QR ROTATIF ─────────────────────────────────────────────────────
let qrRotateTimer = null;

async function generateRotatingQR() {
  const el = document.getElementById('qr-el');
  if (!el) return;
  if (typeof QRCode === 'undefined') { setTimeout(generateRotatingQR, 400); return; }

  // Affiche un spinner pendant le chargement
  el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center"><div class="spin" style="border-color:rgba(0,87,255,.3);border-top-color:var(--blue)"></div></div>';

  const res = await api('/api/qr-token', null, 'GET');
  if (res.error || !res.token) {
    el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>';
    return;
  }

  // Génère le QR avec le token temporaire
  el.innerHTML = '';
  try {
    new QRCode(el, {
      text: 'VOLT:' + res.token,
      width: 180, height: 180,
      colorDark: '#050A14', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(e) {
    el.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px">⚡</div>';
  }

  // Renouvelle automatiquement avant expiration (toutes les 110 secondes)
  if (qrRotateTimer) clearTimeout(qrRotateTimer);
  qrRotateTimer = setTimeout(generateRotatingQR, 110 * 1000);
}

function bindHome() {
  const u = S.user;
  if (u.subscribed) {
    generateRotatingQR();
  }
  if (cdLeft() > 0) startCdTick();
  api('/api/history', null, 'GET').then(r => {
    if (r.history) {
      S.history = r.history;
      const cnt = document.getElementById('scan-count');
      const st  = document.getElementById('stat-today');
      const sm  = document.getElementById('stat-month');
      if (cnt) cnt.textContent = r.history.length;
      if (st)  st.textContent = r.history.filter(h=>h.today).length;
      if (sm)  sm.textContent = r.history.length;
    } else {
      ['scan-count','stat-today','stat-month'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent = '0'; });
    }
  });
}

window.cancelSub = async function() {
  closeModal();
  toast('Annulation en cours...');
  const r = await api('/api/pay-confirm', { action:'cancel' }, 'POST');
  if (r.ok) {
    S.user.subscribed = false;
    saveSess();

  } else {

  }
};

window.selPlan = function(id) {
  S.plan = id; S.screen = 'pay'; render();
  setTimeout(() => { if (S.payMethod === 'card') initStripe(); }, 100);
};

window.setMethod = function(m) {
  S.payMethod = m;
  const pay = document.getElementById('btn-pay');
  const stripeDiv = document.querySelector('#stripe-el');
  const twintDiv = document.querySelector('.twint-info');
  if (m === 'card') {
    if (stripeDiv) stripeDiv.style.display = '';
  }
  S.screen = 'pay';
  render();
  setTimeout(() => { if (m === 'card') initStripe(); }, 100);
};

function bindPay() {
  const btn = document.getElementById('btn-pay');
  if (btn) btn.onclick = () => S.payMethod === 'twint' ? doTwint() : doPay();
  if (S.payMethod === 'card') waitForStripeKey(20);
}

function waitForStripeKey(attempts) {
  if (typeof Stripe !== 'undefined') { initStripe(); return; }
  if (attempts > 0) setTimeout(() => waitForStripeKey(attempts - 1), 300);
}

function initStripe() {
  if (typeof Stripe === 'undefined') return;
  stripeInst = new Stripe(CFG.STRIPE_KEY);
  const el = document.getElementById('stripe-el');
  if (!el || el._stripe) return;
  el._stripe = true;
  const elements = stripeInst.elements();
  cardEl = elements.create('card', {
    style: {
      base: { fontSize:'16px', fontFamily:'Barlow,sans-serif', color:'#060D2E', '::placeholder':{ color:'#A8B4CC' } },
      invalid: { color:'#FF3B5C' }
    },
    hidePostalCode: true,
  });
  cardEl.mount('#stripe-el');
}

let stripeInst = null;
let cardEl = null;

async function doPay() {
  const btn = document.getElementById('btn-pay');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spin"></div> Traitement...'; }
  showPayErr('');
  try {
    const plan = PLANS.find(p=>p.id===S.plan) || PLANS[0];
    const res = await api('/api/pay-intent', { plan_id: plan.id });
    if (res.error) { showPayErr(res.error); if (btn) { btn.disabled = false; btn.innerHTML = '⚡ S\'ABONNER MAINTENANT'; } return; }

    const { setupIntent, error } = await stripeInst.confirmCardSetup(res.client_secret, {
      payment_method: { card: cardEl }
    });

    if (error) { showPayErr(error.message); if (btn) { btn.disabled = false; btn.innerHTML = '⚡ S\'ABONNER MAINTENANT'; } return; }

    const confirm = await api('/api/pay-confirm', { setup_intent_id: setupIntent.id, plan_id: plan.id, payment_method_id: setupIntent.payment_method });
    if (confirm.error) { showPayErr(confirm.error); if (btn) { btn.disabled = false; btn.innerHTML = '⚡ S\'ABONNER MAINTENANT'; } return; }

    S.user = Object.assign({}, S.user, confirm.user || {});
    if (confirm.user) S.user.subscribed = true;
    saveSess();
    render();
    toast('✅ Abonnement activé ! Bienvenue chez VOLT.', true);
  } catch(e) {
    showPayErr('Erreur de paiement. Réessaie.');
    if (btn) { btn.disabled = false; btn.innerHTML = '⚡ S\'ABONNER MAINTENANT'; }
  }
}

function showPayErr(msg) {
  const el = document.getElementById('pay-err');
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function doTwint() {
  const btn = document.getElementById('btn-pay');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spin"></div> Redirection TWINT...'; }
  showPayErr('');
  try {
    const plan = PLANS.find(p=>p.id===S.plan) || PLANS[0];
    const returnUrl = window.location.origin + '/VoltApp.html?payment=twint_success';
    const res = await api('/api/pay-intent', { plan_id: plan.id, method: 'twint', return_url: returnUrl });
    if (res.error) { showPayErr(res.error); if (btn) { btn.disabled = false; btn.innerHTML = '⚡ S\'ABONNER MAINTENANT'; } return; }

    if (typeof Stripe === 'undefined') { showPayErr('Stripe non chargé. Réessaie.'); if (btn) { btn.disabled = false; btn.innerHTML = '⚡ S\'ABONNER MAINTENANT'; } return; }
    if (!stripeInst) stripeInst = new Stripe(CFG.STRIPE_KEY);

    const { error } = await stripeInst.confirmTwintPayment(res.client_secret, {
      return_url: returnUrl,
    });
    if (error) { showPayErr(error.message); if (btn) { btn.disabled = false; btn.innerHTML = '⚡ S\'ABONNER MAINTENANT'; } }
  } catch(e) {
    showPayErr('Erreur TWINT. Réessaie.');
    if (btn) { btn.disabled = false; btn.innerHTML = '⚡ S\'ABONNER MAINTENANT'; }
  }
}

    +'<div style="flex:1"><div class="bc" style="font-weight:800;font-size:16px;color:#fff">INSTALLER VOLT.</div><div style="font-size:12px;color:rgba(255,255,255,.45);margin-top:1px">Accès direct depuis l\'écran d\'accueil</div></div>'
    +'<button onclick="doInstall()" style="background:var(--blue);border:none;border-radius:50px;padding:8px 14px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap">Installer</button>'
    +'<button onclick="this.closest(\'#install-banner\').remove();sessionStorage.setItem(\'volt-noinst\',\'1\')" style="background:none;border:none;color:rgba(255,255,255,.3);font-size:20px;cursor:pointer;padding:4px">✕</button>';
  document.body.appendChild(b);
}

window.doInstall = async function() {
  if (!dip) return;
  dip.prompt();
  const { outcome } = await dip.userChoice;
  dip = null;
  const b = document.getElementById('install-banner');
  if (b) b.remove();
};

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
if (isIOS && isSafari && !isStandalone && !sessionStorage.getItem('volt-noinst')) {
  setTimeout(() => notif('📲', "Partage → Sur l'écran d'accueil pour installer"), 3000);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// ═══════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════
(function boot() {
  try {
    loadSess();
    if (DEMO && !S.user) { S.user = DEMO_USER; S.token = 'demo'; S.screen = 'home'; }

    // Gestion retour lien email
    const VERIFY_STATUS = PARAMS.get('verify');
    if (VERIFY_STATUS === 'success') {
      localStorage.removeItem('volt_s');
      S = { screen:'verify-success', user:null, token:null, plan:'quarter', cdEnd:0, history:[], tab:'conn', cgv:false, payMethod:'card', notifs:true };
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (VERIFY_STATUS === 'expired') {
      window.history.replaceState({}, document.title, window.location.pathname);
      setTimeout(() => toast('Lien expiré. Reconnecte-toi pour renvoyer un email.', false), 400);
    }

    const PAYMENT_STATUS = PARAMS.get('payment');
    if (PAYMENT_STATUS === 'twint_success') {
      window.history.replaceState({}, document.title, window.location.pathname);
      setTimeout(async () => {
        if (S.token) {
          const meRes = await api('/api/user-update?action=me', null, 'GET');
          if (meRes.user) {
            S.user = Object.assign({}, S.user, meRes.user);
            saveSess();
            render();
            if (S.user.subscribed) {
              toast('✅ Abonnement activé ! Bienvenue chez VOLT.', true);
            } else {
              toast('Paiement en cours de traitement. Réessaie dans quelques instants.', true);
            }
          }
        }
      }, 2500);
    }

    render();
  } catch(e) {
    try {
      const app = document.getElementById('app');
      if (app) { app.innerHTML = renderLogin(); bindLogin(); }
    } catch(e2) {
      const app = document.getElementById('app');
      if (app) app.innerHTML = '<div style="height:100%;background:#060D2E;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center"><div style="font-family:system-ui,sans-serif;font-weight:900;font-size:60px;color:#fff;letter-spacing:-2px">VOLT.</div><div style="color:rgba(255,255,255,.5);font-size:14px;margin-top:16px">Erreur de chargement.</div><button onclick="location.reload()" style="margin-top:24px;background:#0057FF;color:#fff;border:none;border-radius:50px;padding:14px 32px;font-size:16px;font-weight:700;cursor:pointer">Réessayer</button></div>';
    }
  }
})();
</script>
</body>
</html>
