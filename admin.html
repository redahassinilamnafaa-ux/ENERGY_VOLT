<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VOLT. — Admin</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0057FF;--blue2:#2979FF;--blue-dark:#003FCC;
  --glow:rgba(0,87,255,.2);--soft:rgba(0,87,255,.08);
  --ink:#0A0F1E;--ink2:#2D3652;--ink3:#6B7A99;--ink4:#A8B4CC;
  --bg:#F7F9FF;--bg2:#EDF1FB;--white:#fff;
  --border:rgba(0,87,255,.1);--border2:rgba(10,15,30,.07);
  --green:#00C47A;--red:#FF3B5C;--orange:#FF9500;
}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.bc{font-family:'Barlow Condensed',sans-serif}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink);position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 80% 20%,rgba(0,87,255,.25),transparent 70%)}
.login-box{background:#fff;border-radius:28px;padding:40px 36px;width:100%;max-width:420px;position:relative;z-index:1;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:52px;color:var(--ink);letter-spacing:-1px;margin-bottom:4px}
.login-sub{font-size:13px;font-weight:600;color:var(--ink3);margin-bottom:32px;display:flex;align-items:center;gap:8px}
.login-sub span{background:var(--soft);border:1px solid var(--border);border-radius:50px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--blue)}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--ink);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;color:#fff;letter-spacing:-1px}
.sidebar-logo-badge{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sidebar-nav{padding:16px 12px;flex:1;overflow-y:auto}
.nav-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.1em;text-transform:uppercase;padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.active{background:rgba(0,87,255,.2);border:1px solid rgba(0,87,255,.3)}
.nav-item .ni{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-item .nl{font-size:14px;font-weight:600;color:rgba(255,255,255,.7)}
.nav-item.active .nl{color:#fff}
.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.07)}
.main{margin-left:240px;flex:1;padding:32px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:36px;color:var(--ink);letter-spacing:-1px}
.page-sub{font-size:14px;font-weight:500;color:var(--ink3);margin-top:2px}

/* CARDS */
.card{background:#fff;border-radius:20px;border:1px solid var(--border2)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#fff;border-radius:20px;padding:20px 24px;border:1px solid var(--border2);transition:all .2s}
.kpi:hover{box-shadow:0 8px 24px var(--glow);border-color:var(--blue);transform:translateY(-2px)}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:38px;color:var(--ink);line-height:1;letter-spacing:-1px}
.kpi-val.blue{color:var(--blue)}
.kpi-val.green{color:var(--green)}
.kpi-val.orange{color:var(--orange)}
.kpi-label{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.kpi-sub{font-size:12px;font-weight:500;color:var(--ink4);margin-top:3px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border2);white-space:nowrap;background:var(--bg)}
td{font-size:14px;font-weight:500;color:var(--ink);padding:14px 16px;border-bottom:1px solid var(--border2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:50px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-green{background:rgba(0,196,122,.1);color:var(--green)}
.badge-red{background:rgba(255,59,92,.1);color:var(--red)}
.badge-blue{background:var(--soft);color:var(--blue)}
.badge-orange{background:rgba(255,149,0,.1);color:var(--orange)}
.badge-gray{background:var(--bg2);color:var(--ink3)}

/* INPUTS */
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:#fff}
.inp::placeholder{color:var(--ink4)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* BUTTONS */
.btn{padding:12px 24px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 16px var(--glow)}
.btn-blue:hover{background:var(--blue2);transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:var(--bg2);color:var(--ink)}
.btn-sm{padding:7px 16px;font-size:14px;border-radius:50px}
.btn-success{background:rgba(0,196,122,.1);color:var(--green);border:1px solid rgba(0,196,122,.2)}
.btn-success:hover{background:var(--green);color:#fff}
.btn-danger{background:rgba(255,59,92,.08);color:var(--red);border:1px solid rgba(255,59,92,.15)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-orange{background:rgba(255,149,0,.1);color:var(--orange);border:1px solid rgba(255,149,0,.2)}
.btn-orange:hover{background:var(--orange);color:#fff}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s}
.modal{background:#fff;border-radius:24px;width:100%;max-width:520px;padding:32px;animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:24px}

/* TOAST */
#toast{position:fixed;top:20px;right:20px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:all .3s;opacity:0;transform:translateY(-10px);pointer-events:none;max-width:300px}
#toast.show{opacity:1;transform:translateY(0)}

/* RÉCAP COMPTA */
.compta-month{background:#fff;border:1px solid var(--border2);border-radius:16px;padding:20px;margin-bottom:12px;transition:all .2s}
.compta-month:hover{border-color:var(--blue);box-shadow:0 4px 16px var(--glow)}
.compta-header{display:flex;align-items:center;gap:12px;cursor:pointer}
.compta-body{margin-top:16px;padding-top:16px;border-top:1px solid var(--border2);display:none}
.compta-body.open{display:block}

/* STATUS SELECT */
.status-select{padding:6px 12px;border-radius:50px;border:1.5px solid var(--border2);font-size:12px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;background:#fff;outline:none}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>

// ── Helpers ───────────────────────────────────────────────
function toast(msg, good) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = good === false ? '#FF3B5C' : '#0A0F1E';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function closeModal() {
  document.getElementById('modal-bg')?.remove();
}

function fmtChf(n) {
  return 'CHF ' + Number(n).toFixed(2);
}

function today() {
  return new Date().toLocaleDateString('fr-CH', { day:'numeric', month:'short', year:'numeric' });
}

// ── Nav ───────────────────────────────────────────────────
const PAGES = [
  { id:'dashboard', icon:'📊', label:'Dashboard'  },
  { id:'virements', icon:'💸', label:'Virements'  },
  { id:'compta',    icon:'📋', label:'Comptabilité'},
  { id:'gyms',      icon:'🏋️', label:'Fitness'    },
  { id:'clients',   icon:'👥', label:'Clients'    },
  { id:'payments',  icon:'💳', label:'Paiements'  },
];

function goTo(page) {
  S.page = page;
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('main-content').innerHTML = renderPage();
  bindPage();
}

function renderPage() {
  if (S.page === 'dashboard') return pageDashboard();
  if (S.page === 'virements') return pageVirements();
  if (S.page === 'compta')    return pageCompta();
  if (S.page === 'gyms')      return pageGyms();
  if (S.page === 'clients')   return pageClients();
  if (S.page === 'payments')  return pagePayments();
  return '';
}

function bindPage() {
  // Bind status selects for virements
  document.querySelectorAll('.virement-status-select').forEach(sel => {
    sel.onchange = function() {
      const id     = this.dataset.id;
      const status = this.value;
      const v      = S.virements.find(x => x.id === id);
      if (!v) return;
      v.status    = status;
      v.date_paid = status === 'paid' ? today() : null;
      toast(status === 'paid' ? `✅ Virement ${v.gym_name} — ${v.month} marqué PAYÉ` :
            status === 'not_paid' ? `⚠️ Marqué NON PAYÉ` : `🔄 Mis en attente`);
      // Refresh juste la ligne
      goTo(S.page);
    };
  });
}

// ── LOGIN ─────────────────────────────────────────────────
function renderLogin() {
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">VOLT.</div>
      <div class="login-sub"><span>⚡ ADMIN</span> Espace administrateur</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><label class="lbl">Email</label><input class="inp" id="l-email" type="email" value="admin@volt.energy.ch"/></div>
        <div><label class="lbl">Mot de passe</label><input class="inp" id="l-pwd" type="password" placeholder="••••••••"/></div>
        <div id="l-err" style="display:none;background:#FFF0F2;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:#FF3B5C"></div>
        <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="doLogin()">Accéder au dashboard →</button>
      </div>
    </div>
  </div>`;
  document.getElementById('l-pwd').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
}

function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pwd   = document.getElementById('l-pwd').value;
  if (email === ADMIN_EMAIL && pwd === ADMIN_PWD) {
    S.logged = true;
    renderApp();
  } else {
    const err = document.getElementById('l-err');
    err.textContent = 'Email ou mot de passe incorrect.';
    err.style.display = 'block';
  }
}

function doLogout() {
  S.logged = false;
  renderLogin();
}

// ── APP SHELL ─────────────────────────────────────────────
function renderApp() {
  const navItems = PAGES.map(p => `
    <button class="nav-item ${S.page===p.id?'active':''}" data-page="${p.id}" onclick="goTo('${p.id}')">
      <span class="ni">${p.icon}</span>
      <span class="nl">${p.label}</span>
    </button>`).join('');

  document.getElementById('app').innerHTML = `
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-txt">VOLT.</div>
        <div class="sidebar-logo-badge">⚡ Administration</div>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section">Navigation</div>
        ${navItems}

      <div class="sidebar-footer">
        <button class="nav-item" onclick="doLogout()" style="width:100%">
          <span class="ni">🚪</span>
          <span class="nl" style="color:rgba(255,59,92,.7)">Déconnexion</span>
        </button>
      </div>
    </div>
    <div class="main" id="main-content">${renderPage()}</div>
  </div>`;

  bindPage();
}

      <div style="display:flex;align-items:flex-end;gap:8px;height:80px">
        ${vals.map((v,i)=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <div style="font-size:10px;font-weight:700;color:var(--ink3)">${v}</div>
          <div style="width:100%;height:${Math.round(v/maxV*60)}px;background:var(--blue);border-radius:4px 4px 0 0;opacity:${i===vals.length-1?1:.6}"></div>
          <div style="font-size:10px;font-weight:600;color:var(--ink4)">${months[i]}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="card" style="padding:24px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px">Répartition plans</div>
      ${[{l:'Mensuel',pct:45,n:19,c:'#0057FF'},{l:'Trimestriel',pct:38,n:16,c:'#2979FF'},{l:'Annuel',pct:17,n:7,c:'#A8C4FF'}].map(p=>`
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:13px;font-weight:600">${p.l}</span>
          <span style="font-size:13px;font-weight:700;color:var(--ink3)">${p.n}</span>
        </div>
        <div style="height:6px;background:var(--bg2);border-radius:3px">
          <div style="height:100%;width:${p.pct}%;background:${p.c};border-radius:3px"></div>
        </div>
      </div>`).join('')}
    </div>
  </div>

  <!-- Virements urgents -->
  ${pendingV > 0 ? `
  <div class="card" style="padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase">Virements en attente</div>
      <button class="btn btn-blue btn-sm" onclick="goTo('virements')">Gérer →</button>
    </div>
    ${S.virements.filter(v=>v.status==='pending').map(v=>`
    <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border2)">
      <div style="font-weight:700;flex:1">${v.gym_name}</div>
      <div style="color:var(--ink3);font-size:13px">${v.month}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px">${fmtChf(v.net)}</div>
      <span class="badge badge-orange">⏳ En attente</span>
    </div>`).join('')}
    <div style="display:flex;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:2px solid var(--border2)">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px">Total : ${fmtChf(totalPendingNet)}</div>
    </div>
  </div>` : ''}`;
}

// ── VIREMENTS ─────────────────────────────────────────────
function statusBadge(status) {
  if (status === 'paid')     return '<span class="badge badge-green">✓ Payé</span>';
  if (status === 'not_paid') return '<span class="badge badge-red">✗ Non payé</span>';
  return '<span class="badge badge-orange">⏳ En attente</span>';
}

function statusSelect(v) {
  return `
  <select class="status-select virement-status-select" data-id="${v.id}" style="border-color:${v.status==='paid'?'var(--green)':v.status==='not_paid'?'var(--red)':'var(--orange)'}">
    <option value="pending"  ${v.status==='pending' ?'selected':''}>⏳ En attente</option>
    <option value="paid"     ${v.status==='paid'    ?'selected':''}>✓ Payé</option>
    <option value="not_paid" ${v.status==='not_paid'?'selected':''}>✗ Non payé</option>
  </select>`;
}

function pageVirements() {
  const months = [...new Set(S.virements.map(v=>v.month))];
  const pending = S.virements.filter(v=>v.status==='pending');
  const totalPending = pending.reduce((s,v)=>s+v.net,0);

  return `
  <div class="topbar">
    <div><div class="page-title">Virements</div><div class="page-sub">Reversements 80% du chiffre d'affaires aux fitness</div></div>
    <button class="btn btn-ghost btn-sm" onclick="goTo('compta')">📋 Récap compta →</button>
  </div>

  ${pending.length > 0 ? `
  <div style="background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px;padding:24px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
    <div>
      <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">${pending.length} virement(s) en attente</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:44px;color:#fff;letter-spacing:-1px">${fmtChf(totalPending)}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.5);margin-top:4px">à reverser aux fitness partenaires</div>
    </div>
    <button class="btn" style="background:#fff;color:var(--blue)" onclick="payAllPending()">Tout marquer payé ✓</button>
  </div>` : `
  <div style="background:rgba(0,196,122,.07);border:1px solid rgba(0,196,122,.2);border-radius:16px;padding:20px;margin-bottom:24px;text-align:center">
    <div style="font-size:28px;margin-bottom:8px">✅</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--green)">Tous les virements sont à jour !</div>
  </div>`}

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fitness</th>
            <th>Mois</th>
            <th>CA brut</th>
            <th>Commission VOLT (20%)</th>
            <th>Net à reverser (80%)</th>
            <th>Date paiement</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody>
          ${S.virements.map(v => `
          <tr>
            <td><strong>${v.gym_name}</strong></td>
            <td style="color:var(--ink3)">${v.month}</td>
            <td>${fmtChf(v.brut)}</td>
            <td style="color:var(--blue)">${fmtChf(v.commission)}</td>
            <td><strong>${fmtChf(v.net)}</strong></td>
            <td style="color:var(--ink3);font-size:13px">${v.date_paid || '—'}</td>
            <td>${statusSelect(v)}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr style="background:var(--bg)">
            <td colspan="2"><strong>TOTAL</strong></td>
            <td><strong>${fmtChf(S.virements.reduce((s,v)=>s+v.brut,0))}</strong></td>
            <td style="color:var(--blue)"><strong>${fmtChf(S.virements.reduce((s,v)=>s+v.commission,0))}</strong></td>
            <td><strong>${fmtChf(S.virements.reduce((s,v)=>s+v.net,0))}</strong></td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;
}

function payAllPending() {
  const t = today();
  S.virements = S.virements.map(v => v.status === 'pending' ? {...v, status:'paid', date_paid:t} : v);
  toast('✅ Tous les virements en attente marqués comme payés !');
  goTo('virements');
}

// ── COMPTABILITÉ ──────────────────────────────────────────
function pageCompta() {
  const months = [...new Set(S.virements.map(v=>v.month))];

  return `
  <div class="topbar">
    <div><div class="page-title">Comptabilité</div><div class="page-sub">Récapitulatif mensuel — VOLT.</div></div>
    <button class="btn btn-ghost btn-sm" onclick="printCompta()">🖨️ Imprimer</button>
  </div>

  <!-- Résumé global -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
    <div class="kpi">
      <div class="kpi-val blue">${fmtChf(S.virements.reduce((s,v)=>s+v.brut,0))}</div>
      <div class="kpi-label">CA total généré</div>
    </div>
    <div class="kpi">
      <div class="kpi-val green">${fmtChf(S.virements.reduce((s,v)=>s+v.commission,0))}</div>
      <div class="kpi-label">Commission VOLT (20%)</div>
      <div class="kpi-sub">Ton revenu net</div>
    </div>
    <div class="kpi">
      <div class="kpi-val">${fmtChf(S.virements.filter(v=>v.status==='paid').reduce((s,v)=>s+v.net,0))}</div>
      <div class="kpi-label">Total reversé aux fitness</div>
    </div>
  </div>

  <!-- Par mois -->
  ${months.map(month => {
    const mvs    = S.virements.filter(v=>v.month===month);
    const brut   = mvs.reduce((s,v)=>s+v.brut,0);
    const comm   = mvs.reduce((s,v)=>s+v.commission,0);
    const net    = mvs.reduce((s,v)=>s+v.net,0);
    const paidN  = mvs.filter(v=>v.status==='paid').length;
    const allPaid = paidN === mvs.length;
    return `
    <div class="compta-month" id="cm-${month.replace(/[^a-z0-9]/gi,'_')}">
      <div class="compta-header" onclick="toggleCompta('${month.replace(/[^a-z0-9]/gi,'_')}')">
        <div style="flex:1">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px">${month}</div>
          <div style="font-size:12px;color:var(--ink3);margin-top:2px">${mvs.length} fitness · ${paidN}/${mvs.length} payés</div>
        </div>
        <div style="display:flex;align-items:center;gap:20px">
          <div style="text-align:right">
            <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase">CA brut</div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px">${fmtChf(brut)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase">Commission</div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--blue)">${fmtChf(comm)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase">Net fitness</div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px">${fmtChf(net)}</div>
          </div>
          ${allPaid ? '<span class="badge badge-green">✓ Tout payé</span>' : `<span class="badge badge-orange">⏳ ${mvs.length-paidN} en attente</span>`}
          <div style="font-size:18px;color:var(--ink3)">▼</div>
        </div>
      </div>
      <div class="compta-body" id="body-${month.replace(/[^a-z0-9]/gi,'_')}">
        <table>
          <thead><tr><th>Fitness</th><th>CA brut</th><th>Commission (20%)</th><th>Net (80%)</th><th>Statut</th><th>Date paiement</th></tr></thead>
          <tbody>
            ${mvs.map(v=>`
            <tr>
              <td><strong>${v.gym_name}</strong></td>
              <td>${fmtChf(v.brut)}</td>
              <td style="color:var(--blue)">${fmtChf(v.commission)}</td>
              <td><strong>${fmtChf(v.net)}</strong></td>
              <td>${statusSelect(v)}</td>
              <td style="color:var(--ink3);font-size:13px">${v.date_paid||'—'}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr style="background:var(--bg)">
              <td><strong>Total ${month}</strong></td>
              <td><strong>${fmtChf(brut)}</strong></td>
              <td style="color:var(--blue)"><strong>${fmtChf(comm)}</strong></td>
              <td><strong>${fmtChf(net)}</strong></td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>`;
  }).join('')}`;
}

function toggleCompta(id) {
  const body = document.getElementById('body-' + id);
  if (body) body.classList.toggle('open');
}

function printCompta() {
  window.print();
}

// ── GYMS ──────────────────────────────────────────────────
function pageGyms() {
  return `
  <div class="topbar">
    <div><div class="page-title">Fitness partenaires</div><div class="page-sub">${S.gyms.length} établissements — ${S.gyms.filter(g=>g.active).length} actifs</div></div>
    <button class="btn btn-blue btn-sm" onclick="showAddGym()">+ Ajouter un fitness</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fitness</th><th>Filiale</th><th>Email login</th><th>Membres</th><th>CA / mois</th><th>Statut</th><th>Actions</th></tr></thead>
        <tbody>
          ${S.gyms.map(g => `
          <tr>
            <td><strong>${g.name}</strong></td>
            <td><span class="badge badge-blue">${g.filiale}</span></td>
            <td style="color:var(--ink3);font-size:13px">${g.email}</td>
            <td>${g.members}</td>
            <td><strong>${fmtChf(g.revenue)}</strong></td>
            <td>${g.active ? '<span class="badge badge-green">● Actif</span>' : '<span class="badge badge-gray">● Inactif</span>'}</td>
            <td style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn btn-ghost btn-sm" style="font-size:12px" onclick="showEditGym('${g.id}')">✏️ Modifier</button>
              <button class="btn ${g.active?'btn-danger':'btn-success'} btn-sm" style="font-size:12px" onclick="toggleGym('${g.id}')">${g.active?'Désactiver':'Activer'}</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function showAddGym() {
  document.body.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-title">Ajouter un fitness partenaire</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><label class="lbl">Nom du fitness</label><input class="inp" id="g-name" placeholder="FitnessPlus Lausanne"/></div>
        <div class="row2">
          <div><label class="lbl">Filiale / Réseau</label><input class="inp" id="g-filiale" placeholder="FitnessPlus"/></div>
          <div><label class="lbl">Ville</label><input class="inp" id="g-ville" placeholder="Lausanne"/></div>
        </div>
        <div><label class="lbl">Email du gérant (= login)</label><input class="inp" id="g-email" type="email" placeholder="manager@fitness.ch"/></div>
        <div><label class="lbl">Mot de passe provisoire</label><input class="inp" id="g-pwd" type="text" value="fitness123" /></div>
        <div style="background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;font-weight:500;color:var(--blue)">
          ℹ️ Le gérant se connecte sur <strong>energy-volt.vercel.app/VoltApp.html</strong> avec cet email et ce mot de passe.
        </div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn btn-blue" style="flex:1;justify-content:center" onclick="addGym()">Créer le compte ✓</button>
          <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="closeModal()">Annuler</button>
        </div>
      </div>
    </div>
  </div>`);
}

function showEditGym(id) {
  const g = S.gyms.find(x=>x.id===id);
  if (!g) return;
  document.body.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-title">Modifier — ${g.name}</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><label class="lbl">Nom</label><input class="inp" id="eg-name" value="${g.name}"/></div>
        <div><label class="lbl">Filiale</label><input class="inp" id="eg-filiale" value="${g.filiale}"/></div>
        <div><label class="lbl">Email</label><input class="inp" id="eg-email" type="email" value="${g.email}"/></div>
        <div><label class="lbl">Nouveau mot de passe (laisser vide = inchangé)</label><input class="inp" id="eg-pwd" type="text" placeholder="Nouveau mot de passe"/></div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn btn-blue" style="flex:1;justify-content:center" onclick="editGym('${id}')">Enregistrer ✓</button>
          <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="closeModal()">Annuler</button>
        </div>
      </div>
    </div>
  </div>`);
}

function addGym() {
  const name    = document.getElementById('g-name').value.trim();
  const filiale = document.getElementById('g-filiale').value.trim();
  const email   = document.getElementById('g-email').value.trim();
  const pwd     = document.getElementById('g-pwd').value.trim();
  if (!name || !filiale || !email || !pwd) { toast('Remplis tous les champs.', false); return; }
  const id = Date.now().toString();
  S.gyms.push({ id, name, filiale, email, pwd, members:0, scans:0, revenue:0, active:true });
  closeModal();
  toast(`✅ ${name} ajouté ! Email: ${email} / MDP: ${pwd}`);
  goTo('gyms');
}

function editGym(id) {
  const g = S.gyms.find(x=>x.id===id);
  if (!g) return;
  g.name    = document.getElementById('eg-name').value.trim() || g.name;
  g.filiale = document.getElementById('eg-filiale').value.trim() || g.filiale;
  g.email   = document.getElementById('eg-email').value.trim() || g.email;
  const pwd = document.getElementById('eg-pwd').value.trim();
  if (pwd) g.pwd = pwd;
  closeModal();
  toast(`✅ ${g.name} mis à jour !`);
  goTo('gyms');
}

function toggleGym(id) {
  const g = S.gyms.find(x=>x.id===id);
  if (!g) return;
  g.active = !g.active;
  toast(g.active ? `✅ ${g.name} activé` : `⚠️ ${g.name} désactivé`);
  goTo('gyms');
}

// ── CLIENTS ───────────────────────────────────────────────
function pageClients() {
  return `
  <div class="topbar">
    <div><div class="page-title">Clients</div><div class="page-sub">${S.clients.filter(c=>c.subscribed).length} abonnés actifs sur ${S.clients.length}</div></div>
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 CSV</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>Fitness</th><th>Plan</th><th>Scans</th><th>CA</th><th>Inscrit</th><th>Statut</th></tr></thead>
        <tbody>
          ${S.clients.map(c=>`
          <tr>
            <td><div style="font-weight:700">${c.name}</div><div style="font-size:12px;color:var(--ink3)">${c.email}</div></td>
            <td style="color:var(--ink3);font-size:13px">${c.gym}</td>
            <td><span class="badge badge-blue">${c.plan}</span></td>
            <td>${c.scans}</td>
            <td><strong>${fmtChf(c.revenue)}</strong></td>
            <td style="color:var(--ink3);font-size:13px">${c.joined}</td>
            <td>${c.subscribed?'<span class="badge badge-green">✓ Actif</span>':'<span class="badge badge-red">✗ Expiré</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── PAIEMENTS ─────────────────────────────────────────────
function pagePayments() {
  const total = S.payments.filter(p=>p.status==='success').reduce((s,p)=>s+p.amount,0);
  return `
  <div class="topbar">
    <div><div class="page-title">Paiements</div><div class="page-sub">Total encaissé : ${fmtChf(total)}</div></div>
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 CSV</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>Plan</th><th>Montant</th><th>Méthode</th><th>Date</th><th>Statut</th></tr></thead>
        <tbody>
          ${S.payments.map(p=>`
          <tr>
            <td><strong>${p.client}</strong></td>
            <td><span class="badge badge-blue">${p.plan}</span></td>
            <td><strong>${fmtChf(p.amount)}</strong></td>
            <td style="color:var(--ink3)">${p.method}</td>
            <td style="color:var(--ink3);font-size:13px">${p.date}</td>
            <td>${p.status==='success'?'<span class="badge badge-green">✓ Succès</span>':'<span class="badge badge-red">✗ Échoué</span>'}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr style="background:var(--bg)">
            <td colspan="2"><strong>Total encaissé</strong></td>
            <td colspan="4"><strong>${fmtChf(total)}</strong></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;
}

// ── UTILS ─────────────────────────────────────────────────
function exportCSV() {
  const data = S.virements.map(v =>
    [v.gym_name, v.month, v.brut, v.commission, v.net, v.status, v.date_paid||''].join(',')
  );
  const csv  = ['Fitness,Mois,CA Brut,Commission,Net,Statut,Date paiement', ...data].join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'volt-virements.csv'; a.click();
  toast('📥 CSV téléchargé !');
}

// ── BOOT ──────────────────────────────────────────────────
renderLogin();
</script>
