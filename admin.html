<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VOLT. — Admin</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0057FF;--blue2:#2979FF;--blue-dark:#003FCC;
  --glow:rgba(0,87,255,.2);--soft:rgba(0,87,255,.08);
  --ink:#0A0F1E;--ink2:#2D3652;--ink3:#6B7A99;--ink4:#A8B4CC;
  --bg:#F7F9FF;--bg2:#EDF1FB;--white:#fff;
  --border:rgba(0,87,255,.1);--border2:rgba(10,15,30,.07);
  --green:#00C47A;--red:#FF3B5C;--orange:#FF9500;
}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.bc{font-family:'Barlow Condensed',sans-serif}
::selection{background:var(--blue);color:#fff}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink);position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 80% 20%,rgba(0,87,255,.25),transparent 70%)}
.login-box{background:#fff;border-radius:28px;padding:40px 36px;width:100%;max-width:420px;position:relative;z-index:1;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:52px;color:var(--ink);letter-spacing:-1px;margin-bottom:4px}
.login-sub{font-size:13px;font-weight:600;color:var(--ink3);margin-bottom:32px;display:flex;align-items:center;gap:8px}
.login-sub span{background:var(--soft);border:1px solid var(--border);border-radius:50px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--blue)}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--ink);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;color:#fff;letter-spacing:-1px}
.sidebar-logo-badge{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sidebar-nav{padding:16px 12px;flex:1;overflow-y:auto}
.nav-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.1em;text-transform:uppercase;padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.active{background:rgba(0,87,255,.2);border:1px solid rgba(0,87,255,.3)}
.nav-item .ni{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-item .nl{font-size:14px;font-weight:600;color:rgba(255,255,255,.7)}
.nav-item.active .nl{color:#fff}
.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.07)}
.main{margin-left:240px;flex:1;padding:32px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.page-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:36px;color:var(--ink);letter-spacing:-1px}
.page-sub{font-size:14px;font-weight:500;color:var(--ink3);margin-top:2px}

/* CARDS */
.card{background:#fff;border-radius:20px;border:1px solid var(--border2)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#fff;border-radius:20px;padding:20px 24px;border:1px solid var(--border2);transition:all .2s}
.kpi:hover{box-shadow:0 8px 24px var(--glow);border-color:var(--blue);transform:translateY(-2px)}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:38px;color:var(--ink);line-height:1;letter-spacing:-1px}
.kpi-val.blue{color:var(--blue)}
.kpi-val.green{color:var(--green)}
.kpi-label{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.kpi-sub{font-size:12px;font-weight:500;color:var(--ink4);margin-top:3px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border2);white-space:nowrap}
td{font-size:14px;font-weight:500;color:var(--ink);padding:14px 16px;border-bottom:1px solid var(--border2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:50px;font-size:11px;font-weight:700}
.badge-green{background:rgba(0,196,122,.1);color:var(--green)}
.badge-red{background:rgba(255,59,92,.1);color:var(--red)}
.badge-blue{background:var(--soft);color:var(--blue)}
.badge-orange{background:rgba(255,149,0,.1);color:var(--orange)}

/* INPUTS */
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:#fff}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}

/* BUTTONS */
.btn{padding:12px 24px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 16px var(--glow)}
.btn-blue:hover{background:var(--blue2);transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:var(--bg2);color:var(--ink)}
.btn-sm{padding:7px 16px;font-size:14px}
.btn-success{background:rgba(0,196,122,.1);color:var(--green);border:1px solid rgba(0,196,122,.2)}
.btn-success:hover{background:var(--green);color:#fff}
.btn-danger{background:rgba(255,59,92,.08);color:var(--red);border:1px solid rgba(255,59,92,.15)}
.btn-danger:hover{background:var(--red);color:#fff}

/* VIREMENT */
.virement-row{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border-radius:14px;border:1px solid var(--border2);margin-bottom:8px;transition:all .2s}
.virement-row:hover{border-color:var(--blue);box-shadow:0 4px 16px var(--glow)}

/* TOGGLE */
.toggle{width:40px;height:24px;border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle-k{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s}
.modal{background:#fff;border-radius:24px;width:100%;max-width:480px;padding:32px;animation:slideUp .3s ease;max-height:90vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* TOAST */
#toast{position:fixed;top:20px;right:20px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:all .3s;opacity:0;transform:translateY(-10px);pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}

/* CHART BAR */
.chart-bar{display:flex;align-items:flex-end;gap:8px;height:80px;margin-top:12px}
.bar{flex:1;background:var(--blue);border-radius:4px 4px 0 0;transition:all .3s;cursor:pointer;position:relative}
.bar:hover{background:var(--blue2)}
.bar-label{font-size:10px;font-weight:600;color:var(--ink3);text-align:center;margin-top:6px}

/* RESPONSIVE */
@media(max-width:1024px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .sidebar{width:200px}
  .main{margin-left:200px;padding:24px}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .main{margin-left:0;padding:16px}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const API = 'https://volt-backend-final.vercel.app';

// ── State ─────────────────────────────────────────────────
let state = {

  data: {
    kpis: null,
    gyms: [],
    clients: [],
    payments: [],
    virements: [],
  }
};

// ── Toast ─────────────────────────────────────────────────
function toast(msg, good) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = good === false ? '#FF3B5C' : '#0A0F1E';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── API helper ────────────────────────────────────────────
async function api(path, body, method) {
  try {
    const r = await fetch(API + path, {
      method: method || (body ? 'POST' : 'GET'),
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    return r.json();
  } catch(e) { return { error: 'Connexion impossible.' }; }
}

// ── Login ─────────────────────────────────────────────────
function renderLogin() {
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">VOLT.</div>
      <div class="login-sub"><span>⚡ ADMIN</span> Espace administrateur</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><label class="lbl">Email</label><input class="inp" id="l-email" type="email" placeholder="admin@volt.energy.ch" value="admin@volt.energy.ch"/></div>
        <div><label class="lbl">Mot de passe</label><input class="inp" id="l-pwd" type="password" placeholder="••••••••"/></div>
        <div id="l-err" style="display:none;background:#FFF0F2;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:#FF3B5C"></div>
        <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="doLogin()">Accéder au dashboard →</button>
      </div>
    </div>
  </div>`;
  document.getElementById('l-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pwd   = document.getElementById('l-pwd').value;
  if (email === ADMIN_EMAIL && pwd === ADMIN_PWD) {
    state.logged = true;
    state.data = getDemoData();
    renderApp();
  } else {
    const err = document.getElementById('l-err');
    err.textContent = 'Email ou mot de passe incorrect.';
    err.style.display = 'block';
  }
}

// ── App ───────────────────────────────────────────────────
function renderApp() {
  const pages = [
    { id:'dashboard', icon:'📊', label:'Dashboard' },
    { id:'virements', icon:'💸', label:'Virements' },
    { id:'gyms',      icon:'🏋️', label:'Fitness' },
    { id:'clients',   icon:'👥', label:'Clients' },
    { id:'payments',  icon:'💳', label:'Paiements' },
  ];

  const navItems = pages.map(p => `
    <button class="nav-item ${state.page===p.id?'active':''}" onclick="goTo('${p.id}')">
      <span class="ni">${p.icon}</span>
      <span class="nl">${p.label}</span>
    </button>`).join('');

  document.getElementById('app').innerHTML = `
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-txt">VOLT.</div>
        <div class="sidebar-logo-badge">⚡ Administration</div>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section">Navigation</div>
        ${navItems}
      </div>
      <div class="sidebar-footer">
        <button class="nav-item" onclick="doLogout()" style="width:100%">
          <span class="ni">🚪</span>
          <span class="nl" style="color:rgba(255,59,92,.7)">Déconnexion</span>
        </button>
      </div>
    </div>
    <div class="main" id="main-content"></div>
  </div>`;

  renderPage();
}

function goTo(page) {
  state.page = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.getAttribute('onclick') === `goTo('${page}')`) el.classList.add('active');
  });
  renderPage();
}

function doLogout() {
  state.logged = false;
  state.page = 'dashboard';
  renderLogin();
}

function renderPage() {
  const main = document.getElementById('main-content');
  if (!main) return;
  if      (state.page === 'dashboard') main.innerHTML = pageDashboard();
  else if (state.page === 'virements') main.innerHTML = pageVirements();
  else if (state.page === 'gyms')      main.innerHTML = pageGyms();
  else if (state.page === 'clients')   main.innerHTML = pageClients();
  else if (state.page === 'payments')  main.innerHTML = pagePayments();
}

// ── DASHBOARD ─────────────────────────────────────────────
function pageDashboard() {
  const k = state.data.kpis;
  const months = ['Jan','Fév','Mar','Avr','Mai','Jun'];
  const vals   = [12, 18, 26, 31, 38, 42];
  const maxV   = Math.max(...vals);
  const bars   = vals.map((v,i) => `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center">
      <div class="bar" style="width:100%;height:${Math.round(v/maxV*70)}px" title="${v} abonnés"></div>
      <div class="bar-label">${months[i]}</div>
    </div>`).join('');

  return `
  <div class="topbar">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-sub">Vue globale VOLT. · ${new Date().toLocaleDateString('fr-CH',{day:'numeric',month:'long',year:'numeric'})}</div>

    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 Exporter CSV</button>
  </div>

  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-val blue">CHF ${k.revenue_month.toFixed(2)}</div>
      <div class="kpi-label">Revenus ce mois</div>
      <div class="kpi-sub">CHF ${k.revenue_total.toFixed(2)} total</div>
    </div>
    <div class="kpi">
      <div class="kpi-val green">${k.subscribers}</div>
      <div class="kpi-label">Abonnés actifs</div>
      <div class="kpi-sub">+3 ce mois</div>
    </div>
    <div class="kpi">
      <div class="kpi-val">${k.scans_month}</div>
      <div class="kpi-label">Scans ce mois</div>
      <div class="kpi-sub">${Math.round(k.scans_month/k.subscribers)} moy./abonné</div>
    </div>
    <div class="kpi">
      <div class="kpi-val" style="color:var(--orange)">${k.pending_virements}</div>
      <div class="kpi-label">Virements en attente</div>
      <div class="kpi-sub"><button class="btn btn-ghost btn-sm" onclick="goTo('virements')" style="font-size:12px;padding:4px 10px">Voir →</button></div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
    <div class="card" style="padding:24px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Croissance abonnés</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:12px">2025</div>
      <div class="chart-bar">${bars}</div>
    </div>
    <div class="card" style="padding:24px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px">Répartition par plan</div>
      ${[
        { label:'Mensuel',     pct:45, n:19, col:'#0057FF' },
        { label:'Trimestriel', pct:38, n:16, col:'#2979FF' },
        { label:'Annuel',      pct:17, n:7,  col:'#A8C4FF' },
      ].map(p => `
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span style="font-size:13px;font-weight:600">${p.label}</span>
            <span style="font-size:13px;font-weight:700;color:var(--ink3)">${p.n} · ${p.pct}%</span>
          </div>
          <div style="height:6px;background:var(--bg2);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${p.pct}%;background:${p.col};border-radius:3px;transition:width .5s"></div>
          </div>
        </div>`).join('')}
    </div>
  </div>

  <div class="card" style="padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase">Top fitness ce mois</div>
      <button class="btn btn-ghost btn-sm" onclick="goTo('gyms')" style="font-size:12px">Voir tout →</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fitness</th><th>Filiale</th><th>Membres</th><th>Scans</th><th>Revenus</th><th>Virement</th></tr></thead>
        <tbody>
          ${state.data.gyms.map(g => `
          <tr>
            <td><strong>${g.name}</strong></td>
            <td><span class="badge badge-blue">${g.filiale}</span></td>
            <td>${g.members}</td>
            <td>${g.scans}</td>
            <td><strong>CHF ${g.revenue.toFixed(2)}</strong></td>
            <td>${g.virement_status==='paid'
              ? '<span class="badge badge-green">✓ Payé</span>'
              : `<span class="badge badge-orange">⏳ En attente</span>`}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── VIREMENTS ─────────────────────────────────────────────
function pageVirements() {
  const gyms = state.data.gyms;
  const pending = gyms.filter(g => g.virement_status === 'pending');
  const paid    = gyms.filter(g => g.virement_status === 'paid');
  const totalPending = pending.reduce((s,g) => s + g.virement_amount, 0);

  return `
  <div class="topbar">
    <div>
      <div class="page-title">Virements</div>
      <div class="page-sub">Reversements aux fitness partenaires</div>
    </div>
  </div>

  ${pending.length > 0 ? `
  <div style="background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px;padding:24px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">Total en attente</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:44px;color:#fff;letter-spacing:-1px">CHF ${totalPending.toFixed(2)}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.5);margin-top:4px">${pending.length} fitness à payer</div>
    </div>
    <button class="btn" style="background:#fff;color:var(--blue);font-size:16px" onclick="payAll()">Tout marquer payé ✓</button>
  </div>` : `
  <div style="background:rgba(0,196,122,.08);border:1px solid rgba(0,196,122,.2);border-radius:16px;padding:20px;margin-bottom:24px;text-align:center">
    <div style="font-size:28px;margin-bottom:8px">✅</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--green)">Tous les virements sont à jour !</div>
  </div>`}

  <div style="margin-bottom:8px;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase">EN ATTENTE (${pending.length})</div>
  ${pending.map(g => virementsRow(g)).join('')}

  ${paid.length > 0 ? `
  <div style="margin:20px 0 8px;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase">PAYÉS (${paid.length})</div>
  ${paid.map(g => virementsRow(g)).join('')}` : ''}`;
}

function virementsRow(g) {
  const isPending = g.virement_status === 'pending';
  return `
  <div class="virement-row">
    <div style="width:44px;height:44px;background:var(--soft);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🏋️</div>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:700">${g.name}</div>
      <div style="font-size:12px;font-weight:500;color:var(--ink3)">${g.members} membres · ${g.scans} scans · Dernier: ${g.last_virement}</div>
    </div>
    <div style="text-align:right;margin-right:16px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px">CHF ${g.virement_amount.toFixed(2)}</div>
      <div style="font-size:11px;color:var(--ink3)">80% de CHF ${g.revenue.toFixed(2)}</div>
    </div>
    ${isPending
      ? `<button class="btn btn-success btn-sm" onclick="markPaid('${g.id}')">Marquer payé ✓</button>`
      : `<span class="badge badge-green">✓ Payé</span>`}
  </div>`;
}

function markPaid(gymId) {
  state.data.gyms = state.data.gyms.map(g =>
    g.id === gymId ? { ...g, virement_status: 'paid', last_virement: new Date().toLocaleDateString('fr-CH',{day:'numeric',month:'short',year:'numeric'}) } : g
  );
  state.data.kpis.pending_virements = state.data.gyms.filter(g => g.virement_status === 'pending').length;
  toast('✅ Virement marqué comme payé !');
  renderPage();
}

function payAll() {
  const today = new Date().toLocaleDateString('fr-CH',{day:'numeric',month:'short',year:'numeric'});
  state.data.gyms = state.data.gyms.map(g => ({ ...g, virement_status: 'paid', last_virement: today }));
  state.data.kpis.pending_virements = 0;
  toast('✅ Tous les virements marqués comme payés !');
  renderPage();
}

// ── GYMS ──────────────────────────────────────────────────
function pageGyms() {
  return `
  <div class="topbar">
    <div>
      <div class="page-title">Fitness partenaires</div>
      <div class="page-sub">${state.data.gyms.length} établissements dans le réseau</div>
    </div>
    <button class="btn btn-blue btn-sm" onclick="showAddGym()">+ Ajouter un fitness</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fitness</th><th>Filiale</th><th>Email</th><th>Membres</th><th>Scans / mois</th><th>Revenus</th><th>Actions</th></tr></thead>
        <tbody>
          ${state.data.gyms.map(g => `
          <tr>
            <td><strong>${g.name}</strong></td>
            <td><span class="badge badge-blue">${g.filiale}</span></td>
            <td style="color:var(--ink3)">${g.id}@volt.ch</td>
            <td>${g.members}</td>
            <td>${g.scans}</td>
            <td><strong>CHF ${g.revenue.toFixed(2)}</strong></td>
            <td style="display:flex;gap:6px">
              <button class="btn btn-ghost btn-sm" style="font-size:12px" onclick="toast('Modification à venir')">✏️</button>
              <button class="btn btn-danger btn-sm" style="font-size:12px" onclick="removeGym('${g.id}')">🗑️</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function showAddGym() {
  document.body.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin-bottom:24px">Ajouter un fitness</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><label class="lbl">Nom du fitness</label><input class="inp" id="g-name" placeholder="FitnessPlus Lausanne"/></div>
        <div><label class="lbl">Adresse</label><input class="inp" id="g-addr" placeholder="Rue de la Gare 1 · Lausanne"/></div>
        <div><label class="lbl">Filiale (réseau d'accès)</label><input class="inp" id="g-filiale" placeholder="FitnessPlus"/></div>
        <div><label class="lbl">Email du gérant</label><input class="inp" id="g-email" type="email" placeholder="manager@fitness.ch"/></div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn btn-blue" style="flex:1;justify-content:center" onclick="addGym()">Ajouter ✓</button>
          <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="closeModal()">Annuler</button>
        </div>
      </div>
    </div>
  </div>`);
}

function addGym() {
  const name    = document.getElementById('g-name').value.trim();
  const addr    = document.getElementById('g-addr').value.trim();
  const filiale = document.getElementById('g-filiale').value.trim();
  const email   = document.getElementById('g-email').value.trim();
  if (!name || !filiale || !email) { toast('Remplis tous les champs.', false); return; }
  const newGym = { id: Date.now().toString(), name, address: addr, filiale, members:0, scans:0, revenue:0, virement_status:'paid', virement_amount:0, last_virement:'—' };
  state.data.gyms.push(newGym);
  state.data.kpis.gyms++;
  closeModal();
  toast(`✅ ${name} ajouté au réseau !`);
  renderPage();
}

function removeGym(id) {
  if (!confirm('Supprimer ce fitness du réseau ?')) return;
  state.data.gyms = state.data.gyms.filter(g => g.id !== id);
  state.data.kpis.gyms--;
  toast('Fitness supprimé.', false);
  renderPage();
}

// ── CLIENTS ───────────────────────────────────────────────
function pageClients() {
  const clients = state.data.clients;
  return `
  <div class="topbar">
    <div>
      <div class="page-title">Clients</div>
      <div class="page-sub">${clients.filter(c=>c.subscribed).length} abonnés actifs sur ${clients.length}</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 CSV</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>Fitness</th><th>Plan</th><th>Scans</th><th>Revenus</th><th>Inscrit le</th><th>Statut</th></tr></thead>
        <tbody>
          ${clients.map(c => `
          <tr>
            <td>
              <div style="font-weight:700">${c.name}</div>
              <div style="font-size:12px;color:var(--ink3)">${c.email}</div>
            </td>
            <td style="color:var(--ink3);font-size:13px">${c.gym}</td>
            <td><span class="badge badge-blue">${c.plan}</span></td>
            <td>${c.scans}</td>
            <td><strong>CHF ${c.revenue.toFixed(2)}</strong></td>
            <td style="color:var(--ink3);font-size:13px">${c.joined}</td>
            <td>${c.subscribed
              ? '<span class="badge badge-green">✓ Actif</span>'
              : '<span class="badge badge-red">✗ Expiré</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── PAYMENTS ──────────────────────────────────────────────
function pagePayments() {
  const payments = state.data.payments;
  const total = payments.filter(p=>p.status==='success').reduce((s,p)=>s+p.amount,0);
  return `
  <div class="topbar">
    <div>
      <div class="page-title">Paiements</div>
      <div class="page-sub">Total encaissé : CHF ${total.toFixed(2)}</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 CSV</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>Plan</th><th>Montant</th><th>Méthode</th><th>Date</th><th>Statut</th></tr></thead>
        <tbody>
          ${payments.map(p => `
          <tr>
            <td><strong>${p.client}</strong></td>
            <td><span class="badge badge-blue">${p.plan}</span></td>
            <td><strong>CHF ${p.amount.toFixed(2)}</strong></td>
            <td style="color:var(--ink3)">${p.method}</td>
            <td style="color:var(--ink3);font-size:13px">${p.date}</td>
            <td>${p.status==='success'
              ? '<span class="badge badge-green">✓ Succès</span>'
              : '<span class="badge badge-red">✗ Échoué</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── UTILS ─────────────────────────────────────────────────
function closeModal() {
  document.getElementById('modal-bg')?.remove();
}

function exportCSV() {
  toast('📥 Export CSV envoyé par email !');
}

// ── BOOT ──────────────────────────────────────────────────
renderLogin();
</script>
</body>
</html>
