<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VOLT. — Administration</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0057FF;--blue2:#2979FF;--blue-dark:#003FCC;
  --glow:rgba(0,87,255,.18);--soft:rgba(0,87,255,.07);
  --ink:#0A0F1E;--ink2:#2D3652;--ink3:#6B7A99;--ink4:#A8B4CC;
  --bg:#F7F9FF;--bg2:#EDF1FB;--white:#fff;
  --border:rgba(0,87,255,.1);--border2:rgba(10,15,30,.07);
  --green:#00C47A;--red:#FF3B5C;--orange:#FF9500;
  --sidebar:240px;
}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.bc{font-family:'Barlow Condensed',sans-serif}
.spin{width:20px;height:20px;border:2.5px solid rgba(0,87,255,.2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink);position:relative;overflow:hidden;}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 75% 10%,rgba(0,87,255,.35),transparent 65%)}
.login-wrap::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.login-box{background:#fff;border-radius:28px;padding:44px 40px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 32px 80px rgba(0,0,0,.35);animation:fadeUp .6s ease both;}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:56px;color:var(--ink);letter-spacing:-2px;line-height:1;margin-bottom:4px}
.login-logo em{color:var(--ink);font-style:normal}
.login-tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--border);border-radius:50px;padding:4px 12px;margin-bottom:28px}
.login-tag span{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--ink);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;border-right:1px solid rgba(255,255,255,.05);}
.sidebar-logo{padding:26px 22px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:32px;color:#fff;letter-spacing:-1px;line-height:1}
.sidebar-logo-txt em{color:#fff;font-style:normal}
.sidebar-logo-badge{font-size:10px;font-weight:700;color:rgba(0,87,255,.7);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.sidebar-nav{padding:14px 10px;flex:1;overflow-y:auto}
.nav-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:.12em;text-transform:uppercase;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:1px solid transparent;background:none;width:100%;text-align:left;}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:rgba(0,87,255,.18);border-color:rgba(0,87,255,.25)}
.nav-item .ni{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav-item .nl{font-size:13px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.01em}
.nav-item.active .nl{color:#fff}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:50px;padding:2px 7px;min-width:18px;text-align:center}
.sidebar-footer{padding:14px 10px;border-top:1px solid rgba(255,255,255,.06)}
.sidebar-admin{padding:12px 12px;margin-bottom:6px}
.sidebar-admin-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.8)}
.sidebar-admin-email{font-size:11px;color:rgba(255,255,255,.3);margin-top:2px}
.main{margin-left:var(--sidebar);flex:1;padding:28px 32px;min-height:100vh;animation:fadeIn .3s ease}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:34px;color:var(--ink);letter-spacing:-.5px;line-height:1}
.page-sub{font-size:13px;font-weight:500;color:var(--ink3);margin-top:3px}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap::before{content:'🔍';position:absolute;left:12px;font-size:13px;pointer-events:none}
.search-inp{background:var(--white);border:1.5px solid var(--border2);border-radius:50px;padding:8px 16px 8px 34px;font-size:13px;font-weight:500;color:var(--ink);font-family:'Barlow',sans-serif;outline:none;width:200px;transition:all .2s}
.search-inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,87,255,.08);width:240px}
.search-inp::placeholder{color:var(--ink4)}
.card{background:#fff;border-radius:20px;border:1px solid var(--border2);overflow:hidden}
.card-pad{padding:24px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:18px;padding:20px 22px;border:1px solid var(--border2);transition:all .2s;cursor:default;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:var(--soft);border-radius:0 0 0 60px;opacity:.6}
.kpi:hover{box-shadow:0 8px 24px var(--glow);border-color:rgba(0,87,255,.2);transform:translateY(-2px)}
.kpi-ico{font-size:22px;margin-bottom:10px;display:block}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:36px;color:var(--ink);line-height:1;letter-spacing:-.5px}
.kpi-val.blue{color:var(--blue)}.kpi-val.green{color:var(--green)}.kpi-val.orange{color:var(--orange)}.kpi-val.red{color:var(--red)}
.kpi-label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.kpi-sub{font-size:12px;font-weight:500;color:var(--ink4);margin-top:3px}
.kpi-trend{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;margin-top:6px;padding:2px 8px;border-radius:50px}
.kpi-trend.up{background:rgba(0,196,122,.1);color:var(--green)}.kpi-trend.down{background:rgba(255,59,92,.1);color:var(--red)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;padding:11px 16px;text-align:left;border-bottom:1.5px solid var(--border2);white-space:nowrap;background:var(--bg);cursor:pointer;user-select:none;transition:color .15s}
th:hover{color:var(--blue)}
td{font-size:13px;font-weight:500;color:var(--ink);padding:13px 16px;border-bottom:1px solid var(--border2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg);transition:background .1s}
.td-name{font-weight:700;font-size:14px}
.td-sub{font-size:11px;color:var(--ink3);margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:50px;font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.badge-green{background:rgba(0,196,122,.1);color:var(--green)}.badge-red{background:rgba(255,59,92,.1);color:var(--red)}.badge-blue{background:var(--soft);color:var(--blue)}.badge-orange{background:rgba(255,149,0,.1);color:var(--orange)}.badge-gray{background:var(--bg2);color:var(--ink3)}
.inp{background:var(--bg2);border:1.5px solid transparent;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:500;color:var(--ink);outline:none;width:100%;font-family:'Barlow',sans-serif;transition:all .2s}
.inp:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,87,255,.07)}
.inp::placeholder{color:var(--ink4)}
.lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{padding:10px 22px;border:none;border-radius:50px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px;letter-spacing:.01em}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 14px var(--glow)}.btn-blue:hover{background:var(--blue2);transform:translateY(-1px);box-shadow:0 6px 20px var(--glow)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#1a2240}
.btn-ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--bg);border-color:rgba(0,87,255,.2)}
.btn-sm{padding:7px 16px;font-size:13px}
.btn-success{background:rgba(0,196,122,.1);color:var(--green);border:1px solid rgba(0,196,122,.2)}.btn-success:hover{background:var(--green);color:#fff;border-color:var(--green)}
.btn-danger{background:rgba(255,59,92,.08);color:var(--red);border:1px solid rgba(255,59,92,.15)}.btn-danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn-orange{background:rgba(255,149,0,.1);color:var(--orange);border:1px solid rgba(255,149,0,.2)}.btn-orange:hover{background:var(--orange);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:24px;width:100%;max-width:500px;padding:32px;animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;margin-bottom:22px;color:var(--ink)}
.modal-divider{height:1px;background:var(--border2);margin:16px 0}
#toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .3s;opacity:0;transform:translateY(10px);pointer-events:none;max-width:320px;border:1px solid rgba(255,255,255,.08)}
#toast.show{opacity:1;transform:translateY(0)}
#toast.err{background:var(--red)}
.compta-month{background:#fff;border:1px solid var(--border2);border-radius:16px;padding:18px 22px;margin-bottom:10px;transition:all .2s;cursor:pointer}
.compta-month:hover{border-color:rgba(0,87,255,.2);box-shadow:0 4px 16px var(--glow)}
.compta-body{margin-top:14px;padding-top:14px;border-top:1px solid var(--border2);display:none}
.compta-body.open{display:block}
.status-select{padding:5px 12px;border-radius:50px;border:1.5px solid var(--border2);font-size:11px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;background:#fff;outline:none}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:80px}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-val{font-size:10px;font-weight:700;color:var(--ink3)}
.bar-fill{width:100%;border-radius:4px 4px 0 0;transition:height .4s ease;min-height:4px}
.bar-lbl{font-size:10px;font-weight:600;color:var(--ink4)}
.empty{text-align:center;padding:60px 24px;color:var(--ink3)}
.empty-ico{font-size:40px;margin-bottom:14px}
.empty-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--ink);margin-bottom:6px}
.empty-sub{font-size:14px;font-weight:500}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--ink3);font-weight:600;font-size:14px}
@media(max-width:820px){
  .layout{flex-direction:column}
  .sidebar{position:sticky;top:0;width:100%;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid rgba(255,255,255,.08)}
  .sidebar-logo{padding:14px 16px;border-bottom:none;border-right:1px solid rgba(255,255,255,.06);flex-shrink:0}
  .sidebar-logo-badge{display:none}
  .sidebar-nav{display:flex;flex-direction:row;padding:8px;gap:6px;flex:1;overflow-x:auto}
  .nav-item{width:auto;white-space:nowrap;margin-bottom:0}
  .sidebar-footer{display:none}
  .main{margin-left:0;padding:18px 14px}
  .topbar{flex-wrap:wrap;gap:10px}
}
@media print{.sidebar,.topbar-actions,.btn{display:none!important}.main{margin:0;padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const BACKEND   = 'https://volt-backend-final.vercel.app';
const ADMIN_SECRET = 'volt-admin-secret-2025';
const ADMIN_EMAIL  = 'info@volt-energy.ch';
const ADMIN_PWD    = 'VoltAdmin2026!';

let S = {
  logged:false, page:'dashboard',
  clients:[], payments:[], gyms:[], machines:[], virements:[],
  _stats:{}, search:'', vFilter_month:'', vFilter_gym:'',
  loading:false,
};

function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

async function adminApi(path, body, method='GET') {
  try {
    const opts = { method, headers:{ 'Content-Type':'application/json', 'x-admin-secret': ADMIN_SECRET } };
    if (body && method !== 'GET') opts.body = JSON.stringify(body);
    const r = await fetch(BACKEND + path, opts);
    if (r.status === 401) { S.logged = false; renderLogin(); return { error: 'Session expirée.' }; }
    return await r.json();
  } catch(e) { return { error: e.message }; }
}

function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = ok ? 'show' : 'show err';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.className = '', 3500);
}
function closeModal() { document.getElementById('modal-bg')?.remove(); }
function fmtChf(n) { return 'CHF ' + Number(n||0).toFixed(2); }
function today() { return new Date().toLocaleDateString('fr-CH',{day:'numeric',month:'short',year:'numeric'}); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('fr-CH',{day:'numeric',month:'short',year:'numeric'}) : '—'; }
function filterBySearch(arr, keys) {
  if (!S.search) return arr;
  const q = S.search.toLowerCase();
  return arr.filter(item => keys.some(k => (item[k]||'').toString().toLowerCase().includes(q)));
}

const PAGES = [
  { id:'dashboard', icon:'📊', label:'Dashboard'   },
  { id:'clients',   icon:'👥', label:'Clients'     },
  { id:'payments',  icon:'💳', label:'Paiements'   },
  { id:'virements', icon:'💸', label:'Virements'   },
  { id:'compta',    icon:'📋', label:'Comptabilité'},
  { id:'gyms',      icon:'🏋️', label:'Fitness'     },
  { id:'machines',  icon:'🖥️',  label:'Machines'    },
  { id:'config',    icon:'⚙️',  label:'Config'      },
];

function goTo(page) {
  S.page = page; S.search = '';
  document.querySelectorAll('.nav-item[data-page]').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('main-content').innerHTML = renderPage();
  bindPage();
}

function renderPage() {
  if (S.page === 'dashboard') return pageDashboard();
  if (S.page === 'clients')   return pageClients();
  if (S.page === 'payments')  return pagePayments();
  if (S.page === 'virements') return pageVirements();
  if (S.page === 'compta')    return pageCompta();
  if (S.page === 'gyms')      return pageGyms();
  if (S.page === 'machines')  return pageMachines();
  if (S.page === 'config')    return pageConfig();
  return '';
}

function bindPage() {
  document.querySelectorAll('.virement-status-select').forEach(sel => {
    sel.onchange = async function() {
      const id = this.dataset.id; const status = this.value;
      const v = S.virements.find(x => x.id === id);
      if (!v) return;
      const res = await adminApi('/api/admin?action=virements', { gym_id: v.gym_id, month_date: v.id.split('-').slice(1).join('-'), status }, 'PUT');
      if (res.error) { toast('Erreur: ' + res.error, false); goTo(S.page); return; }
      v.status = status; v.date_paid = status === 'paid' ? today() : null;
      toast(status === 'paid' ? `✅ Virement ${v.gym_name} marqué PAYÉ` : `🔄 Statut mis à jour`);
      goTo(S.page);
    };
  });
  const si = document.getElementById('search-inp');
  if (si) si.oninput = e => { S.search = e.target.value; document.getElementById('main-content').innerHTML = renderPage(); bindPage(); };
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">VOLT<em>.</em></div>
      <div class="login-tag"><span>⚡ Administration</span></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><label class="lbl">Email</label><input class="inp" id="l-email" type="email" value="${ADMIN_EMAIL}" autocomplete="email"/></div>
        <div><label class="lbl">Mot de passe</label><input class="inp" id="l-pwd" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
        <div id="l-err" style="display:none;background:#FFF0F2;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--red)"></div>
        <button class="btn btn-blue" style="width:100%;justify-content:center;margin-top:4px" onclick="doLogin()">Accéder au dashboard →</button>
      </div>
      <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--ink4)">VOLT. · Administration · Crissier</div>
    </div>
  </div>`;
  document.getElementById('l-pwd').onkeydown = e => { if (e.key==='Enter') doLogin(); };
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pwd   = document.getElementById('l-pwd').value;
  if (email !== ADMIN_EMAIL || pwd !== ADMIN_PWD) {
    const err = document.getElementById('l-err');
    err.textContent = '❌ Email ou mot de passe incorrect.';
    err.style.display = 'block'; return;
  }
  const btn = document.querySelector('.login-box .btn-blue');
  if (btn) { btn.innerHTML = '<div class="spin"></div> Chargement...'; btn.disabled = true; }
  S.logged = true;
  try {
    const [stats, clientsRes, paymentsRes, gymsRes, machinesRes, virementsRes] = await Promise.all([
      adminApi('/api/admin?action=stats'),
      adminApi('/api/admin?action=clients'),
      adminApi('/api/admin?action=payments'),
      adminApi('/api/admin?action=gyms'),
      adminApi('/api/admin?action=machines'),
      adminApi('/api/admin?action=virements'),
    ]);
    if (!stats.error) S._stats = stats;
    if (!clientsRes.error  && Array.isArray(clientsRes.clients))      S.clients   = clientsRes.clients;
    if (!paymentsRes.error && Array.isArray(paymentsRes.payments))    S.payments  = paymentsRes.payments;
    if (!gymsRes.error     && Array.isArray(gymsRes.gyms))            S.gyms      = gymsRes.gyms;
    if (!machinesRes.error && Array.isArray(machinesRes.machines))    S.machines  = machinesRes.machines;
    if (!virementsRes.error&& Array.isArray(virementsRes.virements))  S.virements = virementsRes.virements;
  } catch(e) { console.log('Backend indisponible, mode démo'); }
  renderApp();
}

function doLogout() {
  S.logged = false; S.clients=[]; S.payments=[]; S.gyms=[]; S.machines=[]; S.virements=[]; S._stats={};
  renderLogin();
}

function renderApp() {
  const navItems = PAGES.map(p => {
    let badge = '';
    if (p.id === 'virements') {
      const n = S.virements.filter(v=>v.status==='pending').length;
      if (n > 0) badge = `<span class="nav-badge">${n}</span>`;
    }
    return `<button class="nav-item ${S.page===p.id?'active':''}" data-page="${p.id}" onclick="goTo('${p.id}')">
      <span class="ni">${p.icon}</span><span class="nl">${p.label}</span>${badge}
    </button>`;
  }).join('');
  document.getElementById('app').innerHTML = `
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-txt">VOLT<em>.</em></div>
        <div class="sidebar-logo-badge">⚡ Administration</div>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section">Navigation</div>
        ${navItems}
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-admin">
          <div class="sidebar-admin-name">Reda Hassini</div>
          <div class="sidebar-admin-email">${ADMIN_EMAIL}</div>
        </div>
        <button class="nav-item" onclick="doLogout()" style="width:100%">
          <span class="ni">🚪</span>
          <span class="nl" style="color:rgba(255,59,92,.7)">Déconnexion</span>

async function toggleAccess(userId, authorized) {
  const res = await adminApi('/api/admin?action=access', { user_id: userId, authorized }, 'POST');
  if (res.error) { toast('Erreur: ' + res.error, false); return; }
  const c = S.clients.find(x=>x.id==userId);
  if (c) c.authorized = authorized;
  toast(authorized ? '🔓 Accès rétabli' : '🔒 Accès bloqué');
  goTo('clients');
}

function showSubscribeModal(userId) {
  const c = S.clients.find(x=>x.id==userId);
  if (!c) return;
  if (c.subscribed) {
    document.body.insertAdjacentHTML('beforeend',`
    <div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">⛔ Résilier l'abonnement</div>
        <div style="font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:20px">${c.name} · ${c.email}</div>
        <div style="background:rgba(255,59,92,.07);border:1px solid rgba(255,59,92,.15);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--red);font-weight:500;margin-bottom:20px">
          ⚠️ L'abonnement sera désactivé immédiatement. Le QR code ne fonctionnera plus.
        </div>
        <div class="row2">
          <button class="btn btn-danger" style="justify-content:center" onclick="toggleSubscribe('${userId}',false,'${c.plan||'month'}')"> Résilier ✓</button>
          <button class="btn btn-ghost" style="justify-content:center" onclick="closeModal()">Annuler</button>
        </div>
      </div>
    </div>`);
    return;
  }
  document.body.insertAdjacentHTML('beforeend',`
  <div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-title">✅ Activer l'abonnement</div>
      <div style="font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:20px">${c.name} · ${c.email}</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label class="lbl">Plan</label>
          <select class="inp" id="sub-plan">
            <option value="month">Mensuel — CHF 9.90/mois</option>
            <option value="quarter" selected>Trimestriel — CHF 24.90/3 mois</option>
            <option value="year">Annuel — CHF 89.90/an</option>
          </select>
        </div>
        <div style="background:rgba(255,149,0,.08);border:1px solid rgba(255,149,0,.2);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--orange);font-weight:500">
          ⚠️ Activation manuelle sans paiement Stripe. Pour les tests ou gestes commerciaux.
        </div>
        <div class="row2" style="margin-top:4px">
          <button class="btn btn-blue" style="justify-content:center" onclick="toggleSubscribe('${userId}',true,document.getElementById('sub-plan').value)">Activer ✓</button>
          <button class="btn btn-ghost" style="justify-content:center" onclick="closeModal()">Annuler</button>
        </div>
      </div>
    </div>
  </div>`);
}

async function toggleSubscribe(userId, subscribed, plan) {
  const btn = document.querySelector('#modal-bg .btn-blue, #modal-bg .btn-danger');
  if (btn) { btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; }
  const res = await adminApi('/api/admin?action=subscribe', { user_id: userId, subscribed, plan }, 'POST');
  if (res.error) { toast('Erreur: ' + res.error, false); if (btn) { btn.disabled = false; btn.innerHTML = subscribed ? 'Activer ✓' : 'Résilier ✓'; } return; }
  closeModal();
  const c = S.clients.find(x=>x.id==userId);
  if (c) { c.subscribed = subscribed; if (subscribed) c.plan = plan; }
  toast(subscribed ? `✅ Abonnement activé (${plan})` : `⛔ Abonnement résilié`);
  goTo('clients');
}

async function payAllPending() {
  const pending = S.virements.filter(v => v.status === 'pending');
  if (pending.length === 0) { toast('Aucun virement en attente.'); return; }
  if (!confirm(`Marquer ${pending.length} virement(s) en attente comme PAYÉS ?\n\nCette action enregistre les paiements de façon définitive.`)) return;
  const t = today();
  const items = pending.map(v => ({ gym_id: v.gym_id, month_date: v.id.split('-').slice(1).join('-'), status: 'paid' }));
  const res = await adminApi('/api/admin?action=virements', { items }, 'PUT');
  if (res.error) { toast('Erreur: ' + res.error, false); return; }
  S.virements = S.virements.map(v => v.status==='pending' ? {...v,status:'paid',date_paid:t} : v);
  toast('✅ Tous les virements en attente marqués comme payés !');
  goTo('virements');
}

async function addGym() {
  const name    = document.getElementById('g-name').value.trim();
  const filiale = document.getElementById('g-filiale').value.trim();
  const email   = document.getElementById('g-email').value.trim();
  const pwd     = document.getElementById('g-pwd').value.trim();
  const address = document.getElementById('g-ville')?.value.trim() || '';
  if (!name||!filiale||!email||!pwd) { toast('Remplis tous les champs.', false); return; }
  const btn = document.querySelector('#modal-bg .btn-blue');
  if (btn) { btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; }
  const res = await adminApi('/api/admin?action=gyms', { name, address, filiale, email, password:pwd }, 'POST');
  if (res.error) { toast('Erreur: ' + res.error, false); if (btn) { btn.innerHTML = 'Créer ✓'; btn.disabled = false; } return; }
  S.gyms.push({ id: res.gym?.id || Date.now().toString(), name, filiale, email, address, members:0, scans:0, revenue:0, active:true });
  closeModal();
  toast(`✅ ${name} ajouté !`);
  goTo('gyms');
}

async function editGym(id) {
  const g = S.gyms.find(x=>x.id==id);
  if (!g) return;
  const name    = document.getElementById('eg-name').value.trim()    || g.name;
  const address = document.getElementById('eg-address').value.trim();
  const filiale = document.getElementById('eg-filiale').value.trim() || g.filiale;
  const email   = document.getElementById('eg-email').value.trim()   || g.email;
  const pwd     = document.getElementById('eg-pwd').value.trim();
  const btn = document.querySelector('#modal-bg .btn-blue');
  if (btn) { btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; }
  const res = await adminApi('/api/admin?action=gyms', { id, name, address, filiale, email, password:pwd||undefined }, 'PUT');
  if (res.error) { toast('Erreur: ' + res.error, false); if (btn) { btn.innerHTML = 'Enregistrer ✓'; btn.disabled = false; } return; }
  g.name=name; g.address=address; g.filiale=filiale; g.email=email;
  closeModal();
  toast(`✅ ${name} mis à jour !`);
  goTo('gyms');
}

async function toggleGym(id) {
  const g = S.gyms.find(x=>x.id==id);
  if (!g) return;
  const active = !g.active;
  if (!active && !confirm(`Désactiver « ${g.name} » ?\n\nLes scans sur ses machines seront refusés.`)) return;
  const res = await adminApi('/api/admin?action=gyms', { id, active }, 'PUT');

  g.active = active;
  toast(active ? `✅ ${g.name} activé` : `⚠️ ${g.name} désactivé`);
  goTo('gyms');
}

async function addMachine() {

  const name       = document.getElementById('m-name').value.trim();
  const gym_id     = document.getElementById('m-gym').value || null;

  const btn = document.querySelector('#modal-bg .btn-blue');
  if (btn) { btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; }
  const res = await adminApi('/api/admin?action=machines', { machine_id, name, gym_id, secret }, 'POST');
  if (res.error) { toast('Erreur: ' + res.error, false); if (btn) { btn.innerHTML = 'Créer ✓'; btn.disabled = false; } return; }
  const gym = S.gyms.find(g=>g.id==gym_id);
  S.machines.push({ id: res.machine?.id || Date.now().toString(), machine_id, name, gym_id, gym_name: gym?.name||null, secret, active:true });
  closeModal(); toast(`✅ Machine ${machine_id} ajoutée !`); goTo('machines');
}

async function editMachine(id) {
  const m = S.machines.find(x=>x.id==id);
  if (!m) return;
  const machine_id = document.getElementById('em-id').value.trim()     || m.machine_id;
  const name       = document.getElementById('em-name').value.trim()   || m.name;
  const gym_id     = document.getElementById('em-gym').value           || null;
  const secret     = document.getElementById('em-secret').value.trim() || m.secret;
  const btn = document.querySelector('#modal-bg .btn-blue');
  if (btn) { btn.innerHTML = '<div class="spin"></div>'; btn.disabled = true; }
  const res = await adminApi('/api/admin?action=machines', { id, machine_id, name, gym_id, secret }, 'PUT');
  if (res.error) { toast('Erreur: ' + res.error, false); if (btn) { btn.innerHTML = 'Enregistrer ✓'; btn.disabled = false; } return; }
  const gym = S.gyms.find(g=>g.id==gym_id);
  Object.assign(m, { machine_id, name, gym_id, gym_name: gym?.name||null, secret });

async function toggleMachine(id) {

function pageConfig() {
  return `

    <div><div class="page-title">Configuration</div><div class="page-sub">Outils de maintenance de la base de données</div></div>
  </div>

    <div class="card" style="padding:24px">
      <div style="font-size:16px;font-weight:700;margin-bottom:6px">🛠️ Setup / Migration DB</div>
      <div style="font-size:13px;color:var(--ink3);margin-bottom:16px;line-height:1.6">
        Crée ou met à jour les tables manquantes : <code>machines</code>, colonnes <code>machine_id</code>, <code>gym_id</code>, <code>authorized</code>, <code>filiale</code>…<br/>
        À lancer si tu vois une erreur <em>«&nbsp;column does not exist&nbsp;»</em> ou <em>«&nbsp;relation does not exist&nbsp;»</em>.
      </div>
      <button class="btn btn-blue" onclick="runDbSetup()" id="btn-dbsetup">⚡ Lancer les migrations</button>
    </div>
    <div class="card" id="dbsetup-result" style="padding:20px;display:none"></div>
  </div>`;
}

async function runDbSetup() {
  const btn = document.getElementById('btn-dbsetup');
  const res_el = document.getElementById('dbsetup-result');
  if (btn) { btn.innerHTML = '<div class="spin"></div> Migration en cours…'; btn.disabled = true; }
  if (res_el) res_el.style.display = 'none';
  const res = await adminApi('/api/admin?action=db-setup', {}, 'POST');
  if (btn) { btn.innerHTML = '⚡ Lancer les migrations'; btn.disabled = false; }
  if (!res_el) return;
  res_el.style.display = 'block';
  if (res.error) { res_el.innerHTML = `<div style="color:var(--red);font-weight:600">❌ Erreur : ${escapeHtml(res.error)}</div>`; return; }
  const steps = res.steps || [];
  const allOk = steps.every(s => s.ok);
  res_el.innerHTML = `
    <div style="font-weight:700;margin-bottom:12px;color:${allOk?'#00C47A':'#FF9500'}">${allOk?'✅ Toutes les migrations OK':'⚠️ Certaines étapes ont échoué'}</div>
    ${steps.map(s=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px">
      <span>${s.ok?'✅':'❌'}</span>
      <span style="flex:1;font-family:monospace">${escapeHtml(s.step)}</span>
      ${s.error?`<span style="color:var(--red);font-size:11px">${escapeHtml(s.error)}</span>`:''}
    </div>`).join('')}`;
  if (allOk) { toast('✅ Migrations terminées !'); setTimeout(() => refreshData(), 800); }
}

async function refreshData() {
  toast('🔄 Actualisation...');
  try {
    const [stats, clientsRes, paymentsRes, gymsRes, machinesRes, virementsRes] = await Promise.all([
      adminApi('/api/admin?action=stats'),
      adminApi('/api/admin?action=clients'),
      adminApi('/api/admin?action=payments'),
      adminApi('/api/admin?action=gyms'),
      adminApi('/api/admin?action=machines'),
      adminApi('/api/admin?action=virements'),
    ]);
    if (!stats.error) S._stats = stats;
    if (!clientsRes.error  && Array.isArray(clientsRes.clients))      S.clients   = clientsRes.clients;
    if (!paymentsRes.error && Array.isArray(paymentsRes.payments))    S.payments  = paymentsRes.payments;
    if (!gymsRes.error     && Array.isArray(gymsRes.gyms))            S.gyms      = gymsRes.gyms;
    if (!machinesRes.error && Array.isArray(machinesRes.machines))    S.machines  = machinesRes.machines;
    if (!virementsRes.error&& Array.isArray(virementsRes.virements))  S.virements = virementsRes.virements;
    toast('✅ Données actualisées !');
    goTo(S.page);
  } catch(e) { toast('Erreur de connexion', false); }
}

function downloadCSV(content, filename) {
  const blob = new Blob(['﻿'+content], { type:'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  toast('📥 ' + filename + ' téléchargé !');
}

function exportCSV() {
  const rows = S.virements.map(v => [v.gym_name, v.month, v.brut, v.net, v.status, v.date_paid||''].join(','));
  downloadCSV(['Fitness,Mois,CA Brut,Net,Statut,Date paiement', ...rows].join('\n'), 'volt-virements.csv');
}
